on, it helps you examine the question: Explain how external cues support users. For example, consider this UX research situation: Redesign multi-step onboarding. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Recognition versus recall: visible options reduce retrieval burden; mental models concern the underlying logic users expect."}, {"term": "Mental model", "meaning": "A mental model is the user’s internal explanation of how a system works and what actions will do. If users expect a filter to apply instantly but the interface requires a hidden Apply button, the mismatch causes confusion. Research mental models through prediction tasks, observation and interviews rather than assuming users think like designers."}], "explanation": "Repeatedly forcing users to remember previous fields raises cognitive load and error risk. Externalise state and support recognition, but avoid assuming users share the designer's conceptual model. A workflow can be technically consistent and still surprising.", "workedExample": "During investigation case setup, users choose a verification type on screen 1 but cannot see it on screen 4. A persistent summary supports recognition and reduces memory demands.", "comparison": "Recognition versus recall: visible options reduce retrieval burden; mental models concern the underlying logic users expect.", "pitfall": "Using seven-step forms without orientation because each step is individually simple.", "practice": "Propose three memory-support features for a complex claims workflow and identify downsides.", "selfCheck": "Persistent summary, clear progress and recoverable edits; avoid overloading the view with redundant information.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [{"title": "How We Make Memories: Crash Course Psychology #13", "creator": "CrashCourse", "id": "bSycdIx-C48"}], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Memory+and+mental+models+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "7.3", "title": "Workload and error", "concepts": "NASA-TLX, slips, mistakes and task demands", "goal": "Identify human error risks without blaming users.", "example": "High-stakes approval screens.", "readings": [{"title": "Nielsen Norman Group", "focus": "Ten usability heuristics", "url": "https://www.nngroup.com/articles/ten-usability-heuristics/", "access": "Free online"}, {"title": "NASA TLX", "focus": "Task workload dimensions", "url": "https://humansystems.arc.nasa.gov/groups/tlx/", "access": "Free online"}, {"title": "Designing with the Mind in Mind", "focus": "Jeff Johnson, relevant chapters on attention and memory (book reference)", "url": "", "access": "Book reference; obtain through library/bookstore"}], "studySteps": ["Define the central ideas: NASA-TLX, slips, mistakes and task demands.", "Use the UX scenario: High-stakes approval screens.", "Test your understanding: explain how the idea supports this objective: Identify human error risks without blaming users.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "NASA-TLX", "meaning": "NASA Task Load Index is a subjective workload assessment method with six dimensions: mental demand, physical demand, temporal demand, performance, effort and frustration. It is often used after a task to compare perceived workload. The questionnaire is evidence about participant experience, not a direct physical measure of cognition."}, {"term": "Slip", "meaning": "Slip means execution error despite a broadly correct intention. In this lesson, it helps you examine the question: Identify human error risks without blaming users. For example, consider this UX research situation: High-stakes approval screens. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Slip versus mistake: one concerns execution, the other the goal or plan."}, {"term": "Mistake", "meaning": "Mistake means error in planning or choosing an intention. In this lesson, it helps you examine the question: Identify human error risks without blaming users. For example, consider this UX research situation: High-stakes approval screens. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Slip versus mistake: one concerns execution, the other the goal or plan."}, {"term": "Workload", "meaning": "Workload means demands placed on cognitive and physical resources. In this lesson, it helps you examine the question: Identify human error risks without blaming users. For example, consider this UX research situation: High-stakes approval screens. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Slip versus mistake: one concerns execution, the other the goal or plan."}], "explanation": "The same task can be fast yet mentally exhausting. NASA-TLX considers mental, physical and temporal demand, performance, effort and frustration. Distinguish an accidental click from misunderstanding which workflow is needed. Error prevention and recovery must address the underlying mechanism.", "workedExample": "A field agent clicks “close case” instead of “save draft” due to adjacent controls (slip). An agent submits the wrong verification type because the category logic is misunderstood (mistake).", "comparison": "Slip versus mistake: one concerns execution, the other the goal or plan.", "pitfall": "Treating every user error as proof that the user needs more training.", "practice": "For a form with frequent wrong submissions, identify one slip and one mistake mitigation.", "selfCheck": "Use action separation/undo for slips; improve labels, examples and model explanation for mistakes.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Workload+and+error+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "7.4", "title": "Evaluation metrics", "concepts": "Success, time, errors and qualitative context", "goal": "Choose metrics that match research questions.", "example": "Plan a short comparative usability test.", "readings": [{"title": "Nielsen Norman Group", "focus": "Ten usability heuristics", "url": "https://www.nngroup.com/articles/ten-usability-heuristics/", "access": "Free online"}, {"title": "NASA TLX", "focus": "Task workload dimensions", "url": "https://humansystems.arc.nasa.gov/groups/tlx/", "access": "Free online"}, {"title": "Designing with the Mind in Mind", "focus": "Jeff Johnson, relevant chapters on attention and memory (book reference)", "url": "", "access": "Book reference; obtain through library/bookstore"}], "studySteps": ["Define the central ideas: Success, time, errors and qualitative context.", "Use the UX scenario: Plan a short comparative usability test.", "Test your understanding: explain how the idea supports this objective: Choose metrics that match research questions.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Task success", "meaning": "Task success means whether a defined task meets success criteria. In this lesson, it helps you examine the question: Choose metrics that match research questions. For example, consider this UX research situation: Plan a short comparative usability test. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Performance measures versus experience measures: speed and success don't replace perceived confidence or frustration."}, {"term": "Time on task", "meaning": "Time on task means duration under a specified start/stop rule. In this lesson, it helps you examine the question: Choose metrics that match research questions. For example, consider this UX research situation: Plan a short comparative usability test. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Performance measures versus experience measures: speed and success don't replace perceived confidence or frustration."}, {"term": "Error rate", "meaning": "Error rate means number or proportion of defined errors. In this lesson, it helps you examine the question: Choose metrics that match research questions. For example, consider this UX research situation: Plan a short comparative usability test. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Performance measures versus experience measures: speed and success don't replace perceived confidence or frustration."}, {"term": "SUS", "meaning": "The System Usability Scale is a ten-item usability questionnaire producing a score from 0 to 100 after specified scoring steps. It summarises perceived usability across standardised items, not the percentage of users who successfully completed a task. Interpret it with task performance, participants and benchmark context."}], "explanation": "Usability evaluation works best with a complementary set of measures. Count task success and time, capture critical errors, collect short comments and interpret scores in context. Don't turn small convenience samples into population estimates. SUS is a standardised questionnaire score, not a percentage of tasks completed.", "workedExample": "Five analysts test a case reassignment workflow. Four succeed; median time is 73 seconds; one fails at role permissions. The failure deserves qualitative investigation, not just a success figure of 80%.", "comparison": "Performance measures versus experience measures: speed and success don't replace perceived confidence or frustration.", "pitfall": "Reporting SUS 72 as “72% of users are satisfied.”", "practice": "Write a usability test script with a success rule, two quantitative metrics and two interview probes.", "selfCheck": "Clear task start/stop, objective success conditions, recorded errors and neutral questions.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Evaluation+metrics+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}], "assignments": [{"id": "7-a1", "title": "Human factors audit", "prompt": "Audit a complex workflow for attention and error risk", "length": "700–900 words", "criteria": "Use at least three cognitive principles and prioritise mitigations.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}, {"id": "7-a2", "title": "Usability protocol", "prompt": "Create a test script, measures and post-task prompts", "length": "450–650 words", "criteria": "Provide realistic tasks, success criteria and a consent note.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}], "quiz": [{"q": "Recognition rather than recall often…", "options": ["Increases memory demand", "Reduces memory demand", "Proves perfect usability", "Removes need for testing"], "answer": 1, "why": "Visible cues can reduce reliance on memory."}, {"q": "A slip differs from a mistake because…", "options": ["The goal may be correct but execution goes wrong", "It is always intentional", "It only occurs in children", "It is a statistical test"], "answer": 0, "why": "Slips often concern execution; mistakes often concern planning or understanding."}, {"q": "Task success rate measures…", "options": ["Completion of defined tasks", "Average revenue", "Visual contrast", "Mean age"], "answer": 0, "why": "It measures the proportion meeting task-specific success criteria."}], "links": ["https://www.nngroup.com/articles/ten-usability-heuristics/", "https://humansystems.arc.nasa.gov/groups/tlx/"], "quizBank": [{"q": "Recognition rather than recall often…", "options": ["Increases memory demand", "Reduces memory demand", "Proves perfect usability", "Removes need for testing"], "answer": 1, "why": "Visible cues can reduce reliance on memory."}, {"q": "A slip differs from a mistake because…", "options": ["The goal may be correct but execution goes wrong", "It is always intentional", "It only occurs in children", "It is a statistical test"], "answer": 0, "why": "Slips often concern execution; mistakes often concern planning or understanding."}, {"q": "Task success rate measures…", "options": ["Completion of defined tasks", "Average revenue", "Visual contrast", "Mean age"], "answer": 0, "why": "It measures the proportion meeting task-specific success criteria."}, {"q": "Which concept best matches: Prioritising some information while other signals receive less processing?", "options": ["Selective attention", "Visual search", "Salience", "Signal detection"], "answer": 0, "why": "Selective attention: Prioritising some information while other signals receive less processing"}, {"q": "Which concept best matches: Scanning to find a target?", "options": ["Visual search", "Selective attention", "Salience", "Signal detection"], "answer": 0, "why": "Visual search: Scanning to find a target"}, {"q": "Which concept best matches: Limited-capacity system for temporarily holding and manipulating information?", "options": ["Working memory", "Recognition", "Recall", "Mental model"], "answer": 0, "why": "Working memory: Limited-capacity system for temporarily holding and manipulating information"}, {"q": "Which concept best matches: Identifying familiar options with cues present?", "options": ["Recognition", "Working memory", "Recall", "Mental model"], "answer": 0, "why": "Recognition: Identifying familiar options with cues present"}, {"q": "Which concept best matches: Subjective workload rating instrument with six dimensions?", "options": ["NASA-TLX", "Slip", "Mistake", "Workload"], "answer": 0, "why": "NASA-TLX: Subjective workload rating instrument with six dimensions"}, {"q": "Which concept best matches: Execution error despite a broadly correct intention?", "options": ["Slip", "NASA-TLX", "Mistake", "Workload"], "answer": 0, "why": "Slip: Execution error despite a broadly correct intention"}, {"q": "Which concept best matches: Whether a defined task meets success criteria?", "options": ["Task success", "Time on task", "Error rate", "SUS"], "answer": 0, "why": "Task success: Whether a defined task meets success criteria"}, {"q": "Which concept best matches: Duration under a specified start/stop rule?", "options": ["Time on task", "Task success", "Error rate", "SUS"], "answer": 0, "why": "Time on task: Duration under a specified start/stop rule"}]}, {"id": 8, "title": "Integrated Mini Research Project", "dates": "Dec 21–27", "desc": "Bring research, visualisation and theory together", "lessons": [{"id": "8.1", "title": "Problem framing", "concepts": "Context, constraints and a narrow testable question", "goal": "Choose a realistic enterprise UX problem.", "example": "Use an investigation or analytics workflow.", "readings": [{"title": "OpenIntro Statistics", "focus": "Sampling, analysis and uncertainty", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Fundamentals of Data Visualization", "focus": "Storytelling, effective comparisons and annotation", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}, {"title": "Learning analytics paper", "focus": "Contextual inquiry, methods and constraints", "url": "papers/learning-analytics.pdf", "access": "Bundled PDF"}, {"title": "BetterEvaluation: evaluation approaches", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://www.betterevaluation.org/", "access": "Free reference"}], "studySteps": ["Define the central ideas: Context, constraints and a narrow testable question.", "Use the UX scenario: Use an investigation or analytics workflow.", "Test your understanding: explain how the idea supports this objective: Choose a realistic enterprise UX problem.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Problem frame", "meaning": "Problem frame means bounded account of who faces what difficulty and why it matters. In this lesson, it helps you examine the question: Choose a realistic enterprise UX problem. For example, consider this UX research situation: Use an investigation or analytics workflow. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Problem versus solution: an interface idea should not be embedded as an inevitable answer before research."}, {"term": "Scope", "meaning": "Scope means explicit included/excluded questions. In this lesson, it helps you examine the question: Choose a realistic enterprise UX problem. For example, consider this UX research situation: Use an investigation or analytics workflow. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Problem versus solution: an interface idea should not be embedded as an inevitable answer before research."}, {"term": "Assumption", "meaning": "Assumption means claim needing evidence. In this lesson, it helps you examine the question: Choose a realistic enterprise UX problem. For example, consider this UX research situation: Use an investigation or analytics workflow. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Problem versus solution: an interface idea should not be embedded as an inevitable answer before research."}, {"term": "Research objective", "meaning": "Research objective means what knowledge a study should produce. In this lesson, it helps you examine the question: Choose a realistic enterprise UX problem. For example, consider this UX research situation: Use an investigation or analytics workflow. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Problem versus solution: an interface idea should not be embedded as an inevitable answer before research."}], "explanation": "A useful project is small enough to test, not broad enough to sound important. Define the decision a design team needs to make and the evidence that would change that decision. Document constraints so the work remains feasible alongside other obligations.", "workedExample": "Instead of “improve investigation UX”, ask whether a progressive form reduces missing mandatory attachments for first-time agency executives.", "comparison": "Problem versus solution: an interface idea should not be embedded as an inevitable answer before research.", "pitfall": "Writing “users need AI” without evidence of a concrete unmet need.", "practice": "Draft a 150-word study brief naming user, job, pain, decision, and exclusion.", "selfCheck": "A bounded brief makes a possible result and next decision explicit.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Problem+framing+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "8.2", "title": "Dataset and analysis", "concepts": "Small dataset, cleaning, summaries and defensible charts", "goal": "Avoid unsupported conclusions and document assumptions.", "example": "Use synthetic or anonymised data.", "readings": [{"title": "OpenIntro Statistics", "focus": "Sampling, analysis and uncertainty", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Fundamentals of Data Visualization", "focus": "Storytelling, effective comparisons and annotation", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}, {"title": "Learning analytics paper", "focus": "Contextual inquiry, methods and constraints", "url": "papers/learning-analytics.pdf", "access": "Bundled PDF"}, {"title": "BetterEvaluation: evaluation approaches", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://www.betterevaluation.org/", "access": "Free reference"}], "studySteps": ["Define the central ideas: Small dataset, cleaning, summaries and defensible charts.", "Use the UX scenario: Use synthetic or anonymised data.", "Test your understanding: explain how the idea supports this objective: Avoid unsupported conclusions and document assumptions.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Data cleaning", "meaning": "Data cleaning means finding and documenting invalid, inconsistent or missing values. In this lesson, it helps you examine the question: Avoid unsupported conclusions and document assumptions. For example, consider this UX research situation: Use synthetic or anonymised data. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Data correction versus data fabrication: corrections require reasons and traceable rules."}, {"term": "Missingness", "meaning": "Missingness means absent observations with potentially systematic causes. In this lesson, it helps you examine the question: Avoid unsupported conclusions and document assumptions. For example, consider this UX research situation: Use synthetic or anonymised data. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Data correction versus data fabrication: corrections require reasons and traceable rules."}, {"term": "Summary statistic", "meaning": "Summary statistic means compact representation of a data property. In this lesson, it helps you examine the question: Avoid unsupported conclusions and document assumptions. For example, consider this UX research situation: Use synthetic or anonymised data. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Data correction versus data fabrication: corrections require reasons and traceable rules."}, {"term": "Visual audit", "meaning": "Visual audit means checking the chart against the actual dataset. In this lesson, it helps you examine the question: Avoid unsupported conclusions and document assumptions. For example, consider this UX research situation: Use synthetic or anonymised data. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Data correction versus data fabrication: corrections require reasons and traceable rules."}], "explanation": "Analysis includes decisions about errors and missing values. Don't silently drop difficult cases because they hurt the chart's appearance. Keep a data dictionary and transformation log. Make the chart answer the research question rather than choosing a chart by visual fashion.", "workedExample": "Case durations contain zero, negative and 9999-minute records. Determine whether they are real, placeholders or clock errors before computing averages; document exclusions.", "comparison": "Data correction versus data fabrication: corrections require reasons and traceable rules.", "pitfall": "Removing outliers simply because they make the result less persuasive.", "practice": "Design a cleaning log for 20 hypothetical case durations and define a decision rule.", "selfCheck": "Specify error types, source checks, transformation and count retained.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Dataset+and+analysis+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "8.3", "title": "Prototype and evaluation", "concepts": "Sketch an interface, define measures and conduct a critique", "goal": "Connect research evidence with decisions.", "example": "Build one interactive view.", "readings": [{"title": "OpenIntro Statistics", "focus": "Sampling, analysis and uncertainty", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Fundamentals of Data Visualization", "focus": "Storytelling, effective comparisons and annotation", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}, {"title": "Learning analytics paper", "focus": "Contextual inquiry, methods and constraints", "url": "papers/learning-analytics.pdf", "access": "Bundled PDF"}, {"title": "BetterEvaluation: evaluation approaches", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://www.betterevaluation.org/", "access": "Free reference"}], "studySteps": ["Define the central ideas: Sketch an interface, define measures and conduct a critique.", "Use the UX scenario: Build one interactive view.", "Test your understanding: explain how the idea supports this objective: Connect research evidence with decisions.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Prototype", "meaning": "Prototype means representation of an interaction for exploration or testing. In this lesson, it helps you examine the question: Connect research evidence with decisions. For example, consider this UX research situation: Build one interactive view. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Preference test versus performance test: asking “which do you like?” doesn't directly measure whether one version prevents errors."}, {"term": "Evaluation protocol", "meaning": "Evaluation protocol means repeatable instructions and measures. In this lesson, it helps you examine the question: Connect research evidence with decisions. For example, consider this UX research situation: Build one interactive view. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Preference test versus performance test: asking “which do you like?” doesn't directly measure whether one version prevents errors."}, {"term": "Pilot test", "meaning": "Pilot test means small rehearsal of research procedure. In this lesson, it helps you examine the question: Connect research evidence with decisions. For example, consider this UX research situation: Build one interactive view. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Preference test versus performance test: asking “which do you like?” doesn't directly measure whether one version prevents errors."}, {"term": "Iteration", "meaning": "Iteration means revision guided by evidence and constraints. In this lesson, it helps you examine the question: Connect research evidence with decisions. For example, consider this UX research situation: Build one interactive view. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Preference test versus performance test: asking “which do you like?” doesn't directly measure whether one version prevents errors."}], "explanation": "A prototype only needs enough fidelity to test the hypothesis. Specify tasks and success criteria before asking users to evaluate. Pilot the protocol to detect ambiguous instructions or broken interactions. Keep findings separated into observation, interpretation and recommendation.", "workedExample": "Test a guided claim form prototype with six users using identical scenarios. Record omitted documents, time and confusion points. Revise the prototype only after coding results.", "comparison": "Preference test versus performance test: asking “which do you like?” doesn't directly measure whether one version prevents errors.", "pitfall": "Changing test instructions between participants because early sessions went badly.", "practice": "Draft three task prompts and two observation fields for a prototype evaluation.", "selfCheck": "Use neutral instructions, observable outcomes and consistent moderator behavior.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Prototype+and+evaluation+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "8.4", "title": "Reflexive critique", "concepts": "Limitations, power and alternative design choices", "goal": "Consider who benefits and what measurements omit.", "example": "Critique a performance dashboard.", "readings": [{"title": "OpenIntro Statistics", "focus": "Sampling, analysis and uncertainty", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Fundamentals of Data Visualization", "focus": "Storytelling, effective comparisons and annotation", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}, {"title": "Learning analytics paper", "focus": "Contextual inquiry, methods and constraints", "url": "papers/learning-analytics.pdf", "access": "Bundled PDF"}, {"title": "BetterEvaluation: evaluation approaches", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://www.betterevaluation.org/", "access": "Free reference"}], "studySteps": ["Define the central ideas: Limitations, power and alternative design choices.", "Use the UX scenario: Critique a performance dashboard.", "Test your understanding: explain how the idea supports this objective: Consider who benefits and what measurements omit.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Reflexivity", "meaning": "Reflexivity means examining how researcher assumptions influence questions and interpretations. In this lesson, it helps you examine the question: Consider who benefits and what measurements omit. For example, consider this UX research situation: Critique a performance dashboard. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Limitation versus failure: an explicit boundary improves the validity of a modest conclusion."}, {"term": "Limitation", "meaning": "Limitation means known boundary of a claim or method. In this lesson, it helps you examine the question: Consider who benefits and what measurements omit. For example, consider this UX research situation: Critique a performance dashboard. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Limitation versus failure: an explicit boundary improves the validity of a modest conclusion."}, {"term": "Alternative explanation", "meaning": "Alternative explanation means plausible rival account of findings. In this lesson, it helps you examine the question: Consider who benefits and what measurements omit. For example, consider this UX research situation: Critique a performance dashboard. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Limitation versus failure: an explicit boundary improves the validity of a modest conclusion."}, {"term": "Trade-off", "meaning": "Trade-off means benefit gained at some cost to another value. In this lesson, it helps you examine the question: Consider who benefits and what measurements omit. For example, consider this UX research situation: Critique a performance dashboard. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Limitation versus failure: an explicit boundary improves the validity of a modest conclusion."}], "explanation": "Academic design work is strengthened by honest boundaries. State what the data supports, what remains unknown and whose perspective is missing. Connect limitations to next research actions rather than writing generic disclaimers. Ethical critique includes the power consequences of your measurement and interface choices.", "workedExample": "A speed improvement appears after redesign, but the sample contains only experienced analysts. You can report performance among these participants, not claim equal benefits for new staff.", "comparison": "Limitation versus failure: an explicit boundary improves the validity of a modest conclusion.", "pitfall": "Listing “small sample” without saying how it affects interpretation.", "practice": "Write a 300-word limitations section for your mini project, including ethics and next study.", "selfCheck": "Identify recruitment bias, measurement limitations and the cost of applying results prematurely.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Reflexive+critique+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}], "assignments": [{"id": "8-a1", "title": "Mini research report", "prompt": "Complete an evidence-led project report", "length": "1,200–1,600 words", "criteria": "Abstract, problem, method, findings, design, evaluation plan, limitations and references.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}, {"id": "8-a2", "title": "Five-minute presentation", "prompt": "Write a talk track explaining the research and design tradeoffs", "length": "500–700 words", "criteria": "Explain research question, strongest evidence, design choice and limitations.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}], "quiz": [{"q": "When using simulated data, you should…", "options": ["Present it as observed", "Label it as synthetic", "Hide assumptions", "Infer population truth"], "answer": 1, "why": "Synthetic data must be transparently labelled."}, {"q": "A limitations section should…", "options": ["Discuss alternative explanations", "Only praise the design", "Replace findings", "Avoid uncertainty"], "answer": 0, "why": "Limitations identify the bounds of the claims."}, {"q": "Which is the strongest claim from a small convenience sample?", "options": ["All users prefer A", "Participants in this sample preferred A", "A will always work better", "The UI causes fewer errors globally"], "answer": 1, "why": "Claims should match study scope."}], "links": ["https://clauswilke.com/dataviz/", "https://www.openintro.org/book/os/"], "quizBank": [{"q": "When using simulated data, you should…", "options": ["Present it as observed", "Label it as synthetic", "Hide assumptions", "Infer population truth"], "answer": 1, "why": "Synthetic data must be transparently labelled."}, {"q": "A limitations section should…", "options": ["Discuss alternative explanations", "Only praise the design", "Replace findings", "Avoid uncertainty"], "answer": 0, "why": "Limitations identify the bounds of the claims."}, {"q": "Which is the strongest claim from a small convenience sample?", "options": ["All users prefer A", "Participants in this sample preferred A", "A will always work better", "The UI causes fewer errors globally"], "answer": 1, "why": "Claims should match study scope."}, {"q": "Which concept best matches: Bounded account of who faces what difficulty and why it matters?", "options": ["Problem frame", "Scope", "Assumption", "Research objective"], "answer": 0, "why": "Problem frame: Bounded account of who faces what difficulty and why it matters"}, {"q": "Which concept best matches: Explicit included/excluded questions?", "options": ["Scope", "Problem frame", "Assumption", "Research objective"], "answer": 0, "why": "Scope: Explicit included/excluded questions"}, {"q": "Which concept best matches: Finding and documenting invalid, inconsistent or missing values?", "options": ["Data cleaning", "Missingness", "Summary statistic", "Visual audit"], "answer": 0, "why": "Data cleaning: Finding and documenting invalid, inconsistent or missing values"}, {"q": "Which concept best matches: Absent observations with potentially systematic causes?", "options": ["Missingness", "Data cleaning", "Summary statistic", "Visual audit"], "answer": 0, "why": "Missingness: Absent observations with potentially systematic causes"}, {"q": "Which concept best matches: Representation of an interaction for exploration or testing?", "options": ["Prototype", "Evaluation protocol", "Pilot test", "Iteration"], "answer": 0, "why": "Prototype: Representation of an interaction for exploration or testing"}, {"q": "Which concept best matches: Repeatable instructions and measures?", "options": ["Evaluation protocol", "Prototype", "Pilot test", "Iteration"], "answer": 0, "why": "Evaluation protocol: Repeatable instructions and measures"}, {"q": "Which concept best matches: Examining how researcher assumptions influence questions and interpretations?", "options": ["Reflexivity", "Limitation", "Alternative explanation", "Trade-off"], "answer": 0, "why": "Reflexivity: Examining how researcher assumptions influence questions and interpretations"}, {"q": "Which concept best matches: Known boundary of a claim or method?", "options": ["Limitation", "Reflexivity", "Alternative explanation", "Trade-off"], "answer": 0, "why": "Limitation: Known boundary of a claim or method"}]}, {"id": 9, "title": "Data Visualization Intensive", "dates": "Dec 28–Jan 8", "desc": "Consolidation before the first diploma module", "lessons": [{"id": "9.1", "title": "Information taxonomy", "concepts": "Classes of data, relationships and chart selection", "goal": "Defend why a chart fits the question.", "example": "Audit five different chart types.", "readings": [{"title": "Fundamentals of Data Visualization", "focus": "Chart types, scales, uncertainty, storytelling", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}, {"title": "Election visualisation paper", "focus": "Data pipeline, hypotheses, encoding and visual discovery", "url": "papers/election-visualisation.pdf", "access": "Bundled PDF"}, {"title": "Movie narrative visualisation paper", "focus": "Interaction and narrative model", "url": "papers/movie-narratives.pdf", "access": "Bundled PDF"}, {"title": "Observable Plot documentation", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://observablehq.com/plot/", "access": "Free reference"}], "studySteps": ["Define the central ideas: Classes of data, relationships and chart selection.", "Use the UX scenario: Audit five different chart types.", "Test your understanding: explain how the idea supports this objective: Defend why a chart fits the question.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Data taxonomy", "meaning": "Data taxonomy means grouping variables by roles, scale, structure and relationships. In this lesson, it helps you examine the question: Defend why a chart fits the question. For example, consider this UX research situation: Audit five different chart types. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Data type versus analytical task: the same time variable may participate in a trend line or a distribution histogram."}, {"term": "Temporal data", "meaning": "Temporal data means observations organised by time. In this lesson, it helps you examine the question: Defend why a chart fits the question. For example, consider this UX research situation: Audit five different chart types. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Data type versus analytical task: the same time variable may participate in a trend line or a distribution histogram."}, {"term": "Network data", "meaning": "Network data means entities connected by explicit relationships. In this lesson, it helps you examine the question: Defend why a chart fits the question. For example, consider this UX research situation: Audit five different chart types. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Data type versus analytical task: the same time variable may participate in a trend line or a distribution histogram."}, {"term": "Multivariate data", "meaning": "Multivariate data means observations characterised by several variables. In this lesson, it helps you examine the question: Defend why a chart fits the question. For example, consider this UX research situation: Audit five different chart types. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Data type versus analytical task: the same time variable may participate in a trend line or a distribution histogram."}], "explanation": "Chart selection begins with the analytical question: comparison, distribution, trend, relationship, part-to-whole, geography or network. Then inspect measurement scale and data shape. Avoid choosing a complex chart until simpler encodings fail the task.", "workedExample": "For claim status counts use bars; for weekly backlog use lines; for turnaround by agent use distributions; for entity relationships use a node-link view only if connections matter.", "comparison": "Data type versus analytical task: the same time variable may participate in a trend line or a distribution histogram.", "pitfall": "Assuming a map is best whenever postal codes are present, even if geographic variation is irrelevant.", "practice": "Match six analysis questions to charts and justify two rejected alternatives.", "selfCheck": "Justif estion: Design an exploration task, not decorative motion. For example, consider this UX research situation: Analyse the election visualisation paper. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Filtering versus highlighting: filtering removes nonmatching items; highlighting preserves context while changing emphasis."}, {"term": "Brushing", "meaning": "Brushing means selecting observations graphically. In this lesson, it helps you examine the question: Design an exploration task, not decorative motion. For example, consider this UX research situation: Analyse the election visualisation paper. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Filtering versus highlighting: filtering removes nonmatching items; highlighting preserves context while changing emphasis."}, {"term": "Linked view", "meaning": "Linked view means multiple charts highlighting related data. In this lesson, it helps you examine the question: Design an exploration task, not decorative motion. For example, consider this UX research situation: Analyse the election visualisation paper. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Filtering versus highlighting: filtering removes nonmatching items; highlighting preserves context while changing emphasis."}, {"term": "Details-on-demand", "meaning": "Details-on-demand means additional information revealed when requested. In this lesson, it helps you examine the question: Design an exploration task, not decorative motion. For example, consider this UX research situation: Analyse the election visualisation paper. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Filtering versus highlighting: filtering removes nonmatching items; highlighting preserves context while changing emphasis."}], "explanation": "An interaction is valuable when it changes what can be discovered. Filters should show active state and data scope; linked views must maintain consistent definitions. A reader needs to understand how a selection propagates across charts and whether denominators have changed.", "workedExample": "Select a district in an election map and highlight the corresponding vote-share distribution; keep a clear reset action and label whether chart totals represent all districts or the selected subset.", "comparison": "Filtering versus highlighting: filtering removes nonmatching items; highlighting preserves context while changing emphasis.", "pitfall": "Allowing filters to silently change metric denominators, producing misleading comparisons.", "practice": "Storyboard one linked bar-chart-and-map interaction, including empty state and reset behavior.", "selfCheck": "Explain selection feedback, denominator labels, empty states and accessibility.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": {"text": "“visual discovery”", "attribution": "Gupta et al., 2016, title page", "url": "papers/election-visualisation.pdf#page=1"}, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Interactive+discovery+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "9.3", "title": "Visualization critique", "concepts": "Truthfulness, hierarchy, annotation and accessibility", "goal": "Critique from evidence and reader goals.", "example": "Refactor a dense operational dashboard.", "readings": [{"title": "Wilke: Chapter 1, accurate visualisation", "focus": "Exact free online book chapter; included quotation is attributed", "url": "https://clauswilke.com/dataviz/introduction.html", "access": "Free original book"}, {"title": "Fundamentals of Data Visualization", "focus": "Chart types, scales, uncertainty, storytelling", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}, {"title": "Election visualisation paper", "focus": "Data pipeline, hypotheses, encoding and visual discovery", "url": "papers/election-visualisation.pdf", "access": "Bundled PDF"}, {"title": "Movie narrative visualisation paper", "focus": "Interaction and narrative model", "url": "papers/movie-narratives.pdf", "access": "Bundled PDF"}, {"title": "Observable Plot documentation", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://observablehq.com/plot/", "access": "Free reference"}], "studySteps": ["Define the central ideas: Truthfulness, hierarchy, annotation and accessibility.", "Use the UX scenario: Refactor a dense operational dashboard.", "Test your understanding: explain how the idea supports this objective: Critique from evidence and reader goals.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Chart integrity", "meaning": "Chart integrity means faithfully representing quantities and relationships without misleading scales, selective exclusions or deceptive encodings. A truncated bar-chart axis can magnify a small difference, while a missing denominator can disguise changes in rates. An ethical chart should let a reader trace the claim back to the measurements."}, {"term": "Hierarchy", "meaning": "Hierarchy means relative prominence of analytical elements. In this lesson, it helps you examine the question: Critique from evidence nd note a plausible limitation. A useful distinction to keep in mind is: Reporting a result versus telling a story: storytelling imposes a coherent argument while preserving uncertainty."}, {"term": "Reflection", "meaning": "Reflection means examination of strengths, uncertainties and future work. In this lesson, it helps you examine the question: Explain your work clearly with caveats and citations. For example, consider this UX research situation: Prepare a seven-slide walkthrough. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Reporting a result versus telling a story: storytelling imposes a coherent argument while preserving uncertainty."}], "explanation": "A strong final presentation connects decisions rather than showcasing isolated screens. Begin with a narrow question, show the dataset and its limitations, explain why the visual encoding fits the task, demonstrate an insight, and distinguish interpretation from evidence. Cite the works you learned from and close with an honest reflection.", "workedExample": "A six-slide story: problem, sample and data dictionary, cleaning, chart choice, main finding, limitations and implications. Every slide should contain one takeaway rather than one screenshot.", "comparison": "Reporting a result versus telling a story: storytelling imposes a coherent argument while preserving uncertainty.", "pitfall": "Treating a visually striking dashboard as proof of research competence.", "practice": "Prepare a 5–7-slide outline and a 400-word reflection on a data visualisation mini-project.", "selfCheck": "Evidence trail is explicit; no stronger causal claim than the design permits.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos" <script>
'use strict';
const EMBEDDED=JSON.parse(document.getElementById('embedded-content').textContent);
const KEY='designAtlas3Progress';
let bundle=structuredClone(EMBEDDED), state=bundle.progress, route={page:'home',week:1,lesson:'1.1'}, quizSession=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
function storageRead(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function oldState(){try{const prev=JSON.parse(localStorage.getItem('design-atlas-9week-v1')||'null');if(!prev)return null;const base=structuredClone(EMBEDDED.progress);base.completedLessons=prev.completed||{};base.lessonNotes=prev.notes||{};base.assignmentDrafts=prev.drafts||{};base.completedReadings=prev.reading||{};base.assignmentScores=prev.marks||{};base.quizHistory={};for(const [w,result] of Object.entries(prev.quizzes||{})){if(result&&typeof result==='object'&&Number.isFinite(Number(result.pct))){base.quizHistory[w]=[{at:'Legacy import',pct:Number(result.pct),score:Number(result.score)||0,total:Number(result.total)||0}]}}base.updatedAt=new Date().toISOString();return base}catch{return null}}

function draw(){const pages=[['home','◈','Dashboard'],['roadmap','▦','Roadmap'],['library','▤','Library'],['assignments','✎','Writing desk'],['essayguide','▧','Essay guide'],['quizzes','◎','Quizzes'],['data','⇪','Your data']];$('nav').innerHTML=pages.map(p=>`<button class="${route.page===p[0]?'active':''}" onclick="go('${p[0]}')"><span class="ico">${p[1]}</span>${p[2]}</button>`).join('');$('weeknav').innerHTML=bundle.course.weeks.map(w=>`<button class="${route.week===w.id?'active':''}" onclick="go('week',${w.id})">Week ${w.id} · ${esc(w.title)}</button>`).join('');$('view').innerHTML=({home,roadmap,week,lesson,library,assignments,assignment,essayguide,quizzes,quiz,data}[route.page]||home)();}

resumed.</div>`}
function weekTile(w){return `<button class="week-card" onclick="go('week',${w.id})"><span class="week-intro"><span class="tag">WEEK ${w.id}</span><strong style="display:block;margin-top:8px">${esc(w.title)}</strong><small>${esc(w.desc)}</small></span><span class="right"><strong>${completion(w)}/4</strong><small>lessons</small><div class="bar" style="margin-top:9px"><span style="width:${25*completion(w)}%"></span></div></span></button>`}
function roadmap(){return `<div class="eyebrow">Course syllabus</div><h1>9 weeks. 36 lessons.</h1><p class="prose">Each week includes four focused lessons, two writing assignments and a randomised knowledge check. Choose a week to read the complete teaching material.</p><div class="stack section">${bundle.course.weeks.map(weekTile).join('')}</div>`}
function week(){const w=wby(route.week);if(!w)return 'Week not found';return `<div class="eyebrow">Week ${w.id} / 9 · ${esc(w.dates)}</div><h1>${esc(w.title)}</h1><p class="prose">${esc(w.desc)}</p><div class="grid two section"><div class="card stat"><span>Lessons mastered</span><strong>${completion(w)} / 4</strong><div class="bar"><span style="width:${25*completion(w)}%"></span></div></div><div class="card stat assessment-card"><div class="assessment-metrics"><span>Weekly assessment</span><strong>${(state.quizHistory[w.id]||[]).length}</strong><small>Quiz attempts</small></div><div class="assessment-actions"><button class="button secondary" onclick="go('quiz',${w.id})">Start randomised quiz →</button></div></div></div><h2 class="section">Study lessons</h2><div class="stack">${w.lessons.map(l=>`<button class="lesson-card" onclick="go('lesson',${w.id},'${l.id}')"><span><span class="tag">${l.id}</span><span class="name" style="display:block;margin-top:8px">${esc(l.title)}</span><small>${esc(l.goal)}</small></span><span>${state.completedLessons[l.id]?'✓':'→'}</span></button>`).join('')}</div><h2 class="section">Assignment studio</h2><div class="grid two">${w.assignments.map(a=>assignmentTile(a,w.id)).join('')}</div><p class="footer-note">Work through reading, practice and short recall before writing the assignments. Self-check answers are concealed until you request them.</p>`}
function assignmentTile(a,wid){return `<div class="card"><span class="tag">${esc(a.length)}</span><h3 style="margin:12px 0 8px">${esc(a.title)}</h3><p>${esc(a.prompt)}</p><button class="button secondary" onclick="go('assignment',${wid},'${a.id}')">Open writing desk →</button></div>`}
function noteArea(key,existing,placeholder='Write your reasoning here…',height=''){return `<textarea class="note ${height}" data-save="${esc(key)}" placeholder="${esc(placeholder)}">${esc(existing||'')}</textarea><div class="wordcount" id="words-${esc(key)}">${words(existing)} words · autosaved</div>`}
function termCards(l){return l.definitions.map(d=>`<div class="term"><strong>${esc(d.term)}</strong><p>${esc(d.meaning)}</p></div>`).join('')}
function resourceCard(r,lessonid,i){const key=lessonid+':'+i;return `<div class="itemlink"><div><strong>${esc(r.title)}</strong><div class="meta">${esc(r.focus||'')} · ${esc(r.access||'Reference')}</div></div><div class="buttons"><label class="check"><input type="checkbox" data-read="${esc(key)}" ${state.completedReadings[key]?'checked':''}>Read</label><a class="button ghost" target="_blank" rel="noopener noreferrer" href="${esc(r.url)}">Open ↗</a></div></div>`}
function videoCard(v){const url='https://www.youtube.com/watch?v='+encodeURIComponent(v.id);return `<div class="card"><h3>${esc(v.title)}</h3><p class="muted" style="font-size:12px">${esc(v.creator)}</p><iframe class="video" loading="lazy" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}" title="${esc(v.title)}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe><p class="iframe-fallback">If playback is blocked, <a href="${url}" target="_blank" rel="noopener">open on YouTube ↗</a></p></div>`}
function lesson(){const l=lby(route.lesson);if(!l)return 'Lesson not found';const w=wby(route.week);const related=w.lessons.findIndex(x=>x.id===l.id);const next=w.lessons[related+1];return `<div class="eyebrow">WEEK ${w.id} / LESSON ${esc(l.id)} · 35–45 min</div><h1>${esc(l.title)}</h1><p class="prose">${esc(l.goal)}</p><div class="buttons"><label class="check"><input type="checkbox" data-complete="${l.id}" ${state.completedLessons[l.id]?'checked':''}>Mark lesson completed</label><button class="button ghost" onclick="go('week',${w.id})">← Week overview</button>${next?`<button class="button secondary" onclick="go('lesson',${w.id},'${next.id}')">Next lesson →</button>`:`<button class="button secondary" onclick="go('quiz',${w.id})">Weekly quiz →</button>`}</div><nav class="toc" aria-label="Lesson sections"><a href="#concepts">Definitions</a><a href="#understand">Explanation</a><a href="#example">Worked example</a><a href="#practice">Practice</a><a href="#resources">Sources</a><a href="#notes">Notes</a></nav>
<section class="section" id="concepts"><h2>01 / Definitions you should know</h2><div class="grid two">${termCards(l)}</div></section>
<section class="section" id="understand"><h2>02 / Understand the idea</h2><div class="card prose">${esc(l.explanation)}</div><div class="grid two" style="margin-top:14px"><div class="callout"><strong>Key difference</strong><p style="margin:8px 0 0">${esc(l.comparison)}</p></div><div class="callout amber"><strong>Common mistake</strong><p style="margin:8px 0 0">${esc(l.pitfall)}</p></div></div></section>
<section class="section" id="example"><h2>03 / Worked UX example</h2><div class="callout mint">${esc(l.workedExample)}</div>${l.quote?`<blockquote class="card" style="margin:16px 0 0;border-left:3px solid #bda1ff"><p>${esc(l.quote.text)}</p><small>${esc(l.quote.attribution)} · <a href="${esc(l.quote.url)}" target="_blank">View source ↗</a></small></blockquote>`:''}</section>
<section class="section" id="practice"><h2>04 / Stop and apply it</h2><div class="card"><h3>Practice prompt</h3><p>${esc(l.practice)}</p>${noteArea('practice:'+l.id,state.practiceAnswers[l.id],'Explain your answer in your own words. Give a UX example and a limitation.')}<div class="buttons" style="margin-top:12px"><button class="button secondary" onclick="toggleAnswer('answer-${l.id}')">Show / hide model check</button><button class="button ghost" onclick="go('quiz',${w.id})">Test this week's learning →</button></div><div id="answer-${l.id}" class="callout mint" style="display:none;margin-top:14px"><strong>Self-check guidance</strong><p style="margin:7px 0 0">${esc(l.selfCheck)}</p></div></div></section>
<section class="section" id="resources"><h2>05 / Sources and deeper reading</h2><div class="card"><p style="font-size:13px">These links support the topic; they do not imply that the named professor requires a specific book. Paid sources should be obtained via a library or publisher.</p>${l.readings.map((r,i)=>resourceCard(r,l.id,i)).join('')}</div>${l.videos.length?`<h3 style="margin-top:22px">Watch and take notes</h3><div class="video-grid">${l.videos.map(videoCard).join('')}</div>`:`<div class="card soft" style="margin-top:14px"><strong>Video discovery</strong><p style="font-size:13px">No lesson-specific video has been verified for embedding. Use this topic search to explore lectures without assuming an unverified link is a source.</p><a href="${esc(l.further[0].url)}" target="_blank" rel="noopener">Find videos on this topic ↗</a></div>`}</section>
<section class="section" id="notes"><h2>06 / Your study notes</h2><p class="muted">Summarise the concept, identify a real product example, and record questions for revision.</p>${noteArea('notes:'+l.id,state.lessonNotes[l.id],'In my own words…\nAn example from work…\nWhat still confuses me…','long')}</section><p class="footer-note">Original teaching notes with linked sources, not official course text. Quoted source excerpts are brief and attributed.</p>`}
