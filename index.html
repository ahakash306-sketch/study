/* v3.2 layout system: fix component nesting, alignment, and responsive button groups */
:root{--page-width:1040px;--gutter:clamp(16px,3.6vw,52px)}
.shell{grid-template-columns:244px minmax(0,1fr)}
.main{max-width:calc(var(--page-width) + var(--gutter)*2);padding:38px var(--gutter) 84px;min-width:0}
.main>*{min-width:0}
.card,.week-card,.lesson-card,.topic,.callout,.question{min-width:0}
.grid{gap:16px;align-items:stretch}.stack{gap:12px}
.section{margin-top:28px}
.row{min-width:0;gap:14px}
.row>*{min-width:0}
.section-header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:32px 0 16px}
.section-header h2{margin:0}
.section-header .button{flex:0 0 auto}
.card{padding:22px;border-radius:16px}
.card h2{margin:0 0 14px}
.card>*:last-child{margin-bottom:0}
.week-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(82px,112px);align-items:center;gap:22px;padding:19px 22px;min-height:112px}
.week-card>.week-intro{min-width:0;display:block;text-align:left}
.week-card>.week-intro strong{line-height:1.4}
.week-card .right{display:flex;min-width:0;align-items:flex-end;flex-direction:column;gap:5px;text-align:right;justify-content:center}
.week-card .right>strong{font-size:19px;line-height:1.2}
.week-card .right small{margin:0;font-size:12px}
.week-card .right .bar{width:100%;max-width:112px;margin:7px 0 0!important}
.button{position:relative;max-width:100%;white-space:normal;overflow-wrap:anywhere;text-align:center;padding:11px 16px;min-height:45px;line-height:1.35;flex-shrink:0}
.buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.buttons>.button,.buttons>button{flex:0 1 auto}
.card>.button{margin-top:12px}
.card .buttons{margin-top:14px}
.lesson-card{min-height:76px;padding:16px 18px}
.question{padding:20px}
.question .choices{gap:10px}
.rubric{margin:14px 0}
.itemlink{align-items:flex-start;gap:12px}
.itemlink>div:first-child{min-width:0;overflow-wrap:anywhere}
.itemlink .buttons{margin-top:0}
.prose{max-width:820px}
/* prevent nested general .section.row styles from moving the CTA */
.section.row{margin-top:30px}
.section.row>.button{margin:0}
.section.row h2{margin:0}
/* UX essay guide components */
.guide-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 20px}
.guide-tabs button{background:#211d2e;color:#ddd2f6;border:1px solid #514366;padding:10px 13px;border-radius:10px;min-height:44px}
.guide-tabs button.active{background:#45365f;border-color:#bba0ff;color:white}
.guide-step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;border-bottom:1px solid var(--line);padding:15px 0}
.guide-step:last-child{border:0;padding-bottom:0}
.guide-n{display:grid;place-items:center;border-radius:9px;background:#362b4c;color:#e8d7ff;width:32px;height:32px;font-weight:800}
.guide-step h3{margin:0 0 5px}
.guide-step p{margin:0;font-size:14px}
.essay-example{background:#171e25;border:1px solid #385048;border-radius:14px;padding:20px;line-height:1.8}
.essay-example p{margin:0 0 12px}
.essay-example p:last-child{margin-bottom:0}
.annotation{background:#252033;color:#d6c5ff;border-radius:6px;padding:2px 5px;font-size:11px;font-weight:700;white-space:nowrap}
.guide-resource{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.guide-resource:last-child{border:0}
.guide-resource .button{min-width:112px}
.essay-compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.essay-compare>div{padding:16px;border:1px solid var(--line);border-radius:12px;background:#1d202b;min-width:0}
.essay-compare p{margin:7px 0 0;font-size:14px}
@media(max-width:1100px){.shell{grid-template-columns:206px minmax(0,1fr)}.main{padding:30px 26px 76px}.sidebar{padding:16px 10px}.card{padding:19px}}
@media(max-width:760px){
 .shell{display:block}.sidebar{height:auto;position:sticky;top:0;padding:10px 12px 8px;background:#11141bf2;backdrop-filter:blur(18px);border-right:0;border-bottom:1px solid var(--line);z-index:20;gap:5px}
 .brand{padding:0 4px 4px;font-size:19px}
 .side-caption,.week-nav,.side-footer{display:none}
 .nav{display:flex;overflow-x:auto;gap:5px;scrollbar-width:none}.nav button{flex:0 0 auto;width:auto;padding:9px 12px;min-height:44px;font-size:12px;white-space:nowrap}
 .main{padding:24px 16px 75px}
 .grid,.grid.two,.grid.three{grid-template-columns:minmax(0,1fr);gap:12px}
 .card{padding:17px}.section{margin-top:24px}
 .section-header{align-items:stretch;margin:25px 0 14px;gap:11px}
 .section-header h2{width:100%}
 .section-header .button{width:100%;justify-content:center}
 .week-card{grid-template-columns:minmax(0,1fr) 68px;padding:15px;gap:10px;min-height:100px}
 .week-card .right{min-width:0}.week-card .right strong{font-size:17px}
 .week-card .right .bar{width:100%}
 .question .choices{grid-template-columns:1fr}
 .buttons{align-items:stretch}.buttons>.button{flex:1 1 150px}
 .button{min-height:46px}
 .essay-compare{grid-template-columns:1fr}
 .guide-resource{flex-direction:column}.guide-resource .button{width:100%}
 .rubric{grid-template-columns:minmax(0,1fr) 80px}
}
@media(max-width:390px){.main{padding-left:12px;padding-right:12px}.card{padding:15px}.week-card{grid-template-columns:minmax(0,1fr) 60px}.buttons>.button{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* v3.3: isolated assessment card layout, no inline-button overlap */
.assessment-card{display:flex!important;flex-direction:column!important;justify-content:space-between!important;align-items:stretch!important;min-height:235px;gap:20px;overflow:visible}
.assessment-metrics{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}
.assessment-metrics span,.assessment-metrics small{display:block;position:static!important;margin:0!important;line-height:1.4}
.assessment-metrics strong{display:block;position:static!important;font-size:36px;line-height:1.1;margin:3px 0 0!important}
.assessment-actions{display:flex;flex-direction:column;align-items:stretch;width:100%;margin-top:auto;min-width:0;clear:both}
.assessment-actions .button{position:static!important;display:flex!important;width:100%;min-width:0;max-width:100%;min-height:48px;white-space:normal;line-height:1.35;margin:0!important;padding:12px 16px;flex:none;justify-content:center}
.term p{font-size:14px;line-height:1.82;margin:9px 0 0;color:#cbd0dd;max-width:76ch}
.term strong{display:block;font-size:15px;line-height:1.4}
.term{padding:19px 20px}
@media(max-width:760px){.assessment-card{min-height:205px}.assessment-actions .button{width:100%}.term{padding:16px}}

<script id="embedded-content" type="application/json">{"schemaVersion": 2, "course": {"title": "Design Atlas · 9-Week Interaction Design Preparation", "weeks": [{"id": 1, "title": "Foundations of Data & Research", "dates": "Nov 2–8", "desc": "Data types, summary statistics, and framing research questions", "lessons": [{"id": "1.1", "title": "Levels of measurement", "concepts": "Nominal, ordinal, interval and ratio data", "goal": "Recognise measurement scales, appropriate summaries and chart implications.", "example": "Device categories, satisfaction ratings, temperature and task completion time.", "readings": [{"title": "OpenIntro Statistics", "focus": "Introduction to data: variable types and measurement", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Kulkarni and Rajamanickam paper", "focus": "PDF page 2: data points and nominal/ordinal classifications", "url": "papers/learning-analytics.pdf#page=2", "access": "Bundled PDF"}, {"title": "Fundamentals of Data Visualization · Claus O. Wilke", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://clauswilke.com/dataviz/", "access": "Free reference"}], "studySteps": ["Define the central ideas: Nominal, ordinal, interval and ratio data.", "Use the UX scenario: Device categories, satisfaction ratings, temperature and task completion time.", "Test your understanding: explain how the idea supports this objective: Recognise measurement scales, appropriate summaries and chart implications.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Nominal", "meaning": "A nominal variable distinguishes observations by their identity or category; there is no intrinsic greater-than or less-than relationship among its values. The categories should be mutually exclusive for a single-choice field, and any numbers used are identifiers, not quantities. In UX analytics, “mobile”, “desktop” and “tablet” are nominal, even if the database codes them as 1, 2 and 3. Appropriate summaries include counts, proportions and the most frequent category; an average of category codes is meaningless."}, {"term": "Ordinal", "meaning": "An ordinal variable puts categories into an interpretable sequence, but the gaps between adjacent ranks are not established as equal. A five-point ease scale orders “very difficult” through “very easy”, but the perceived jump from 1 to 2 need not match 4 to 5. Frequencies, medians and rank-based comparisons preserve this interpretation. Researchers sometimes average ratings for pragmatic reasons, especially across multi-item scales, but the extra equal-spacing assumption needs justification."}, {"term": "Interval", "meaning": "An interval variable has ordered values with equal units of difference: a five-unit change has the same size anywhere on the scale. Its zero is conventional, not the absence of the measured attribute, so ratios of raw values are not meaningful. Celsius temperature is the classic example: 30°C is 10°C warmer than 20°C but not “50% hotter”. Differences, means and standard deviations can be meaningful; multiplicative statements require a true-zero scale."}, {"term": "Ratio", "meaning": "A ratio variable has equal intervals and a non-arbitrary zero representing none of the measured quantity. That allows both subtraction and multiplication comparisons. If one checkout task takes 20 seconds and another takes 40 seconds, the second duration is twice as long. Count of errors, number of attempts, elapsed time and distance are common UX ratio measures; check how values are collected and whether zero is a real possible observation."}], "explanation": "The mathematical question is not whether a data field contains numbers, but what the numbers mean. A device code of 3 is still nominal. A five-category ease rating is ordinal because “very easy” follows “easy”, but the felt distance may vary. Celsius temperature is interval because the zero is conventional. Duration in seconds is ratio because zero means no elapsed duration. The scale restricts comparisons and influences visual encodings and statistics.", "workedExample": "In a checkout usability test, device=mobile/desktop (nominal), ease=very hard…very easy (ordinal), room temperature in °C (interval), and task completion seconds (ratio). Show device frequencies in a bar chart; retain ordered ease categories; plot durations on a numeric axis.", "comparison": "Ordinal versus interval: order alone does not justify subtracting neighbouring ratings as equal distances. Ratio versus interval: “twice as long” works for seconds, not Celsius degrees.", "pitfall": "Treating numeric category identifiers as measurements; saying a rating of 4 is necessarily twice the experience of 2.", "practice": "Classify device type, severity (low/medium/high), time in seconds, and temperature in °C. For each, state one valid and one invalid operation.", "selfCheck": "Device nominal; severity ordinal; time ratio; Celsius interval. A mean “device code” is invalid; ratio comparisons of time are meaningful.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Levels+of+measurement+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "1.2", "title": "Descriptive statistics", "concepts": "Mean, median, mode, spread and outliers", "goal": "Calculate common summaries and choose robust interpretations.", "example": "Compare checkout times with one unusually slow task.", "readings": [{"title": "OpenIntro Statistics", "focus": "Variables, data types and measurement scales", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Fundamentals of Data Visualization", "focus": "The visualisation process and aesthetics", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}], "studySteps": ["Define the central ideas: Mean, median, mode, spread and outliers.", "Use the UX scenario: Compare checkout times with one unusually slow task.", "Test your understanding: explain how the idea supports this objective: Calculate common summaries and choose robust interpretations.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Mean", "meaning": "The arithmetic mean is the sum of numeric observations divided by the number of observations. It uses every value and estimates a centre of the distribution, but unusual observations can move it substantially. If task times are 18, 20, 22, 24 and 116 seconds, the mean is 40 seconds. Report sample size and examine the distribution before calling it the “typical” user experience."}, {"term": "Median", "meaning": "The median is the middle observation after numerical values are sorted; with an even number of values, it is the average of the two middle numeric values. It resists extreme observations better than the mean. For the checkout times 18, 20, 22, 24 and 116 seconds, the median is 22 seconds. Use it when a long right tail would make the mean less representative, but still investigate unusually slow users."}, {"term": "Mode", "meaning": "The mode is the most frequently observed value or category. It is especially useful for nominal survey answers such as preferred device or payment method, where an arithmetic mean makes no sense. A dataset can have multiple modes, or no useful unique mode if values rarely repeat. Report frequency counts alongside the mode so small differences are visible."}, {"term": "Range", "meaning": "The range measures the total span between the largest and smallest numeric observations: maximum minus minimum. It is simple to interpret in task-time data, but depends only on two observations and can be inflated by one anomalous case. Pair it with the median, interquartile range or standard deviation for a more complete picture of variation."}, {"term": "Standard deviation", "meaning": "Standard deviation quantifies how dispersed numerical observations are around their mean in the original unit of measurement. It is computed from squared deviations, then square-rooted; the sample version divides squared deviations by n − 1 before taking the root. A high SD in checkout time suggests heterogeneous experiences, but outliers and skew can dominate it. Always inspect the distribution rather than reading SD alone."}], "explanation": "A summary is a compressed description, not a substitute for the underlying distribution. A single unusually long task can pull the mean upward, while the median remains more resistant. Always inspect shape, spread and the unit; consider the sample size before treating an average as product performance.", "workedExample": "Checkout times 18, 20, 22, 24 and 116 seconds give mean 40 seconds and median 22 seconds. A dashboard showing only the mean conceals that most participants were much faster and one participant struggled.", "comparison": "Mean versus median: both capture centre, but the median is less affected by an extreme time. Range versus SD: range uses only extremes; SD uses every observation.", "pitfall": "Reporting the mean as “typical” without checking outliers and distribution.", "practice": "Compute mean and median of 12, 14, 15, 19, 80; explain which tells the better user story.", "selfCheck": "Mean 28 seconds and median 15 seconds. The unusual 80-second result makes median useful, but investigate that user's problem.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Descriptive+statistics+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "1.3", "title": "Visual encoding basics", "concepts": "Marks, channels, encodings and chart choice", "goal": "Match variable types to position, length, hue and area.", "example": "Redesign a customer support dashboard.", "readings": [{"title": "Wilke: Chapter 2, visual encoding", "focus": "Exact free online book chapter; included quotation is attributed", "url": "https://clauswilke.com/dataviz/aesthetic-mapping.html", "access": "Free original book"}, {"title": "OpenIntro Statistics", "focus": "Variables, data types and measurement scales", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Fundamentals of Data Visualization", "focus": "The visualisation process and aesthetics", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}], "studySteps": ["Define the central ideas: Marks, channels, encodings and chart choice.", "Use the UX scenario: Redesign a customer support dashboard.", "Test your understanding: explain how the idea supports this objective: Match variable types to position, length, hue and area.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Mark", "meaning": "A mark is a visible geometric element that represents one or more data items, such as a dot for a respondent, a bar for category count or a line connecting observations over time. Marks are the objects a reader sees; they do not acquire meaning until data is mapped to their visual properties. Choosing bars, points or lines should follow the question being asked, not stylistic preference."}, {"term": "Visual channel", "meaning": "A visual channel is a property of a mark that can carry information: x/y position, length, area, hue, lightness, orientation or shape. Different channels support different comparisons. Position along a shared numeric axis usually enables more precise magnitude comparisons than circle area; hue is usually better at distinguishing categories than showing exact quantities."}, {"term": "Encoding", "meaning": "Visual encoding is the rule mapping a variable to a mark or channel. For example, a support dashboard may encode ticket count as bar length and ticket type as distinct categories along the y-axis. A sound encoding lets readers decode comparisons without guessing what colour or size means. Document your encoding decisions so the relationship between data, analytic task and graphic remains inspectable."}, {"term": "Graphical perception", "meaning": "Graphical perception concerns the mental processes used to decode quantitative or categorical information from a graphic. Readers judge position, length, colour and area with different levels of accuracy. A pie chart may communicate composition, but small slice differences are harder to compare than aligned bars. Visualisations should be evaluated through the intended reading task, not only visual appeal."}], "explanation": "Different encodings support different tasks. Position on a common scale makes exact comparison easy; length is powerful for quantities; hue is helpful for nominal groups; area is harder to compare precisely. A design is “good” only relative to its data, audience and question.", "workedExample": "For fraud cases by status, use a bar chart to compare counts. For how a backlog changes over 12 weeks, use a line chart. For relationships between turnaround time and case complexity, a scatterplot is more revealing than a pie chart.", "comparison": "Colour hue for categories versus colour lightness for magnitude: categories need distinction, amounts need an ordered progression.", "pitfall": "Using a pie chart to compare tiny differences in twenty case categories; encoding area instead of length without justification.", "practice": "Map category, amount, date and geographic location to suitable marks or channels. Explain your chosen comparison task.", "selfCheck": "Category→hue or separate bars; amount→position/length; date→position along ordered axis; location→map position if geography matters.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": {"text": "“All data visualizations map data values into quantifiable features”", "attribution": "Claus O. Wilke, Fundamentals of Data Visualization, Chapter 2", "url": "https://clauswilke.com/dataviz/aesthetic-mapping.html"}, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Visual+encoding+basics+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "1.4", "title": "Research question anatomy", "concepts": "Questions, constructs, variables and operational definitions", "goal": "Turn fuzzy product concerns into measurable questions.", "example": "Define “ease of completing a claim” in observable terms.", "readings": [{"title": "OpenIntro Statistics", "focus": "Variables, data types and measurement scales", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Fundamentals of Data Visualization", "focus": "The visualisation process and aesthetics", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}], "studySteps": ["Define the central ideas: Questions, constructs, variables and operational definitions.", "Use the UX scenario: Define “ease of completing a claim” in observable terms.", "Test your understanding: explain how the idea supports this objective: Turn fuzzy product concerns into measurable questions.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Construct", "meaning": "A construct is an idea researchers want to study that cannot necessarily be observed directly, such as perceived trust, cognitive load or usability. It needs a theory of what the idea includes and what it excludes. Asking “is this interface trustworthy?” measures a response to a question, not trust itself in its entirety. Multiple indicators can improve coverage of complex constructs."}, {"term": "Operational definition", "meaning": "An operational definition specifies how an abstract construct is translated into a measurable observation. “Efficiency” might be operationalised as median task completion time in seconds for a clearly defined checkout task. The definition must state task, participants, measurement start/stop rules and exceptions. Other operationalisations could lead to different conclusions, so justify the one you choose."}, {"term": "Research question", "meaning": "A research question specifies the uncertainty a study intends to resolve, ideally naming the people, context, variables and comparison. “Is our app better?” is too broad; “Does a labelled filter reduce median retrieval time for claims officers compared with an icon-only filter?” can guide a concrete study. A research question is not automatically a causal claim: the design must permit the inference."}, {"term": "Variable", "meaning": "A variable is a property that can take different values across people, sessions, cases or time, such as device type, elapsed seconds or perceived difficulty. Its measurement scale determines sensible analysis. Distinguish a variable from its stored code, unit, collection procedure and potential confounds."}], "explanation": "“Make claims easier” is a design aspiration, not a measurable research question. Specify who, what task, what intervention, what metric and under what context. An operational definition translates the idea into an observation, such as task success, time, error rate or a defined post-task rating. No single proxy captures every dimension of usability.", "workedExample": "Question: “Among new claims agents, does adding a guided form reduce omission errors compared with the current form?” Independent variable: form version. Outcome: omission errors per completed claim. Define what counts as an omission.", "comparison": "Construct validity versus measurement convenience: the easiest metric to collect may not capture the construct you care about.", "pitfall": "Claiming that higher screen views prove increased user confidence.", "practice": "Write a testable question about an investigation workflow. Define sample, comparison, metric, and one potential confound.", "selfCheck": "A strong answer defines an observable measure and explains why experience level or case difficulty could affect the outcome.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": {"text": "“a good research design helps you answer the research question”", "attribution": "Drummond chapter 6, page 2", "url": "papers/drummond-research-designs.pdf#page=2"}, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Research+question+anatomy+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}], "assignments": [{"id": "1-a1", "title": "Data audit and chart critique", "prompt": "Classify 12 variables from a dashboard and critique two charts", "length": "600–800 words", "criteria": "Include variable types, chart choice, two misleading features, and justified recommendations.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}, {"id": "1-a2", "title": "Research question memo", "prompt": "Write a research question, hypothesis and operational measures for a product flow", "length": "350–500 words", "criteria": "Show question, sample, metric definitions and a possible confound.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}], "quiz": [{"q": "Device type (mobile, desktop, tablet) is what measurement level?", "options": ["Nominal", "Ordinal", "Interval", "Ratio"], "answer": 0, "why": "Device types are unordered categories."}, {"q": "Ranked feature preferences from first to fifth are…", "options": ["Nominal", "Ordinal", "Interval", "Ratio"], "answer": 1, "why": "The ranks are ordered, but distances between positions are not measurable."}, {"q": "Temperature measured in Celsius is generally…", "options": ["Nominal", "Ordinal", "Interval", "Ratio"], "answer": 2, "why": "Celsius has equal steps but no absolute zero."}, {"q": "Task completion time in seconds is…", "options": ["Nominal", "Ordinal", "Interval", "Ratio"], "answer": 3, "why": "Duration has equal units and a meaningful zero."}, {"q": "Which is most resistant to a single extreme duration?", "options": ["Mean", "Median", "Range", "Maximum"], "answer": 1, "why": "The median is more robust to outliers than the mean."}], "links": ["https://clauswilke.com/dataviz/", "https://www.khanacademy.org/math/statistics-probability"], "quizBank": [{"q": "Device type (mobile, desktop, tablet) is what measurement level?", "options": ["Nominal", "Ordinal", "Interval", "Ratio"], "answer": 0, "why": "Device types are unordered categories."}, {"q": "Ranked feature preferences from first to fifth are…", "options": ["Nominal", "Ordinal", "Interval", "Ratio"], "answer": 1, "why": "The ranks are ordered, but distances between positions are not measurable."}, {"q": "Temperature measured in Celsius is generally…", "options": ["Nominal", "Ordinal", "Interval", "Ratio"], "answer": 2, "why": "Celsius has equal steps but no absolute zero."}, {"q": "Task completion time in seconds is…", "options": ["Nominal", "Ordinal", "Interval", "Ratio"], "answer": 3, "why": "Duration has equal units and a meaningful zero."}, {"q": "Which is most resistant to a single extreme duration?", "options": ["Mean", "Median", "Range", "Maximum"], "answer": 1, "why": "The median is more robust to outliers than the mean."}, {"q": "Which concept best matches: Categories with identities but no inherent order?", "options": ["Nominal", "Ordinal", "Interval", "Ratio"], "answer": 0, "why": "Nominal: Categories with identities but no inherent order"}, {"q": "Which concept best matches: Ordered categories with unequal or unknown spacing?", "options": ["Ordinal", "Nominal", "Interval", "Ratio"], "answer": 0, "why": "Ordinal: Ordered categories with unequal or unknown spacing"}, {"q": "Which concept best matches: Sum of values divided by count?", "options": ["Mean", "Median", "Mode", "Range"], "answer": 0, "why": "Mean: Sum of values divided by count"}, {"q": "Which concept best matches: Middle ordered observation?", "options": ["Median", "Mean", "Mode", "Range"], "answer": 0, "why": "Median: Middle ordered observation"}, {"q": "Which concept best matches: A visible primitive such as a point, line or bar?", "options": ["Mark", "Visual channel", "Encoding", "Graphical perception"], "answer": 0, "why": "Mark: A visible primitive such as a point, line or bar"}, {"q": "Which concept best matches: A property of a mark such as position, length, colour or size?", "options": ["Visual channel", "Mark", "Encoding", "Graphical perception"], "answer": 0, "why": "Visual channel: A property of a mark such as position, length, colour or size"}, {"q": "Which concept best matches: An abstract attribute such as trust, stress or ease?", "options": ["Construct", "Operational definition", "Research question", "Variable"], "answer": 0, "why": "Construct: An abstract attribute such as trust, stress or ease"}, {"q": "Which concept best matches: Rule connecting a construct to observations?", "options": ["Operational definition", "Construct", "Research question", "Variable"], "answer": 0, "why": "Operational definition: Rule connecting a construct to observations"}]}, {"id": 2, "title": "Perception & Information Design", "dates": "Nov 9–15", "desc": "Graphical perception, visual hierarchy and storytelling", "lessons": [{"id": "2.1", "title": "How we read charts", "concepts": "Comparison accuracy, preattentive features and visual attention", "goal": "Explain why positions and lengths are often easier to compare than areas.", "example": "Contrast bar, bubble and treemap charts.", "readings": [{"title": "Fundamentals of Data Visualization", "focus": "Visualisation principles, scales, colour and graphical perception", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}, {"title": "From Data to Viz", "focus": "Chart families and common caveats", "url": "https://www.data-to-viz.com/", "access": "Free online"}], "studySteps": ["Define the central ideas: Comparison accuracy, preattentive features and visual attention.", "Use the UX scenario: Contrast bar, bubble and treemap charts.", "Test your understanding: explain how the idea supports this objective: Explain why positions and lengths are often easier to compare than areas.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Preattentive feature", "meaning": "Preattentive feature means a visual property often detected quickly before focused attention. In this lesson, it helps you examine the question: Explain why positions and lengths are often easier to compare than areas. For example, consider this UX research situation: Contrast bar, bubble and treemap charts. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Preattentive attention versus considered interpretation: noticing a difference is not the same as understanding its cause."}, {"term": "Visual search", "meaning": "Visual search means locating a target among distractors. In this lesson, it helps you examine the question: Explain why positions and lengths are often easier to compare than areas. For example, consider this UX research situation: Contrast bar, bubble and treemap charts. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Preattentive attention versus considered interpretation: noticing a difference is not the same as understanding its cause."}, {"term": "Common scale", "meaning": "Common scale means a shared axis enabling direct position comparison. In this lesson, it helps you examine the question: Explain why positions and lengths are often easier to compare than areas. For example, consider this UX research situation: Contrast bar, bubble and treemap charts. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Preattentive attention versus considered interpretation: noticing a difference is not the same as understanding its cause."}], "explanation": "Visual attention is limited. Contrast, spatial grouping, consistent alignment and restrained highlighting direct attention. But salience is not equivalent to importance; a bright red element can dominate even when it is not the most actionable. In charts, value judgements are often easier along aligned positions than scattered areas.", "workedExample": "Two charts show agency turnaround times. Aligned horizontal bars let analysts compare three agencies immediately. Five oversized coloured circles require slower area judgements and can exaggerate differences.", "comparison": "Preattentive attention versus considered interpretation: noticing a difference is not the same as understanding its cause.", "pitfall": "Using every colour as a high-priority signal, which makes nothing stand out.", "practice": "Compare bars, bubbles and a table for detecting the slowest agency. Explain which question each format best answers.", "selfCheck": "Common-position bars support comparison; a table supports exact lookup; bubbles may serve overview but weaken precision.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=How+we+read+charts+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "2.2", "title": "Scales and colour", "concepts": "Axes, baselines, sequential and diverging palettes", "goal": "Detect distorted axes and select colour encodings based on meaning.", "example": "Audit a stacked dashboard chart.", "readings": [{"title": "Fundamentals of Data Visualization", "focus": "Visualisation principles, scales, colour and graphical perception", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}, {"title": "From Data to Viz", "focus": "Chart families and common caveats", "url": "https://www.data-to-viz.com/", "access": "Free online"}], "studySteps": ["Define the central ideas: Axes, baselines, sequential and diverging palettes.", "Use the UX scenario: Audit a stacked dashboard chart.", "Test your understanding: explain how the idea supports this objective: Detect distorted axes and select colour encodings based on meaning.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Baseline", "meaning": "Baseline means reference from which graphical quantities are measured. In this lesson, it helps you examine the question: Detect distorted axes and select colour encodings based on meaning. For example, consider this UX research situation: Audit a stacked dashboard chart. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Sequential versus diverging: a diverging palette is justified when there is a meaningful centre such as zero variance or target performance."}, {"term": "Sequential palette", "meaning": "Sequential palette means ordered lightness for low-to-high values. In this lesson, it helps you examine the question: Detect distorted axes and select colour encodings based on meaning. For example, consider this UX research situation: Audit a stacked dashboard chart. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Sequential versus diverging: a diverging palette is justified when there is a meaningful centre such as zero variance or target performance."}, {"term": "Diverging palette", "meaning": "Diverging palette means two directions away from a meaningful midpoint. In this lesson, it helps you examine the question: Detect distorted axes and select colour encodings based on meaning. For example, consider this UX research situation: Audit a stacked dashboard chart. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Sequential versus diverging: a diverging palette is justified when there is a meaningful centre such as zero variance or target performance."}, {"term": "Truncated axis", "meaning": "Truncated axis means an axis whose displayed start omits lower values. In this lesson, it helps you examine the question: Detect distorted axes and select colour encodings based on meaning. For example, consider this UX research situation: Audit a stacked dashboard chart. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Sequential versus diverging: a diverging palette is justified when there is a meaningful centre such as zero variance or target performance."}], "explanation": "The same dataset can tell different stories under different scales. Bar lengths imply magnitude from a baseline and typically need a zero origin; a line chart may use a focused vertical interval when trends and absolute level are both clearly labelled. Hue and luminance should match data semantics and remain legible for colour-vision differences.", "workedExample": "A customer satisfaction score moves from 88 to 91. A bar chart cropped to 87 magnifies a small increase; a line chart with a clearly labelled 85–95 range can show its trend without presenting bar length as absolute magnitude.", "comparison": "Sequential versus diverging: a diverging palette is justified when there is a meaningful centre such as zero variance or target performance.", "pitfall": "Using red and green as the only way to distinguish success and failure.", "practice": "Propose a scale and palette for SLA variance: -20 to +20 hours around a zero target. Explain legend, ordering and accessibility.", "selfCheck": "Use an explicitly labelled diverging scale centred at 0; also use text or shape cues, not colour alone.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Scales+and+colour+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "2.3", "title": "Distributions and uncertainty", "concepts": "Histograms, box plots, variability and annotation", "goal": "Show spread, outliers and uncertainty without hiding them.", "example": "Visualise task completion durations.", "readings": [{"title": "Fundamentals of Data Visualization", "focus": "Visualisation principles, scales, colour and graphical perception", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}, {"title": "From Data to Viz", "focus": "Chart families and common caveats", "url": "https://www.data-to-viz.com/", "access": "Free online"}], "studySteps": ["Define the central ideas: Histograms, box plots, variability and annotation.", "Use the UX scenario: Visualise task completion durations.", "Test your understanding: explain how the idea supports this objective: Show spread, outliers and uncertainty without hiding them.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Distribution", "meaning": "Distribution means pattern of frequencies across observed values. In this lesson, it helps you examine the question: Show spread, outliers and uncertainty without hiding them. For example, consider this UX research situation: Visualise task completion durations. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Histogram versus bar chart: histogram bins lie along a numeric continuum; category bars compare separate labels."}, {"term": "Histogram", "meaning": "Histogram means counts of numeric observations in adjacent bins. In this lesson, it helps you examine the question: Show spread, outliers and uncertainty without hiding them. For example, consider this UX research situation: Visualise task completion durations. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Histogram versus bar chart: histogram bins lie along a numeric continuum; category bars compare separate labels."}, {"term": "Box plot", "meaning": "Box plot means summary of median, quartiles and unusually distant observations. In this lesson, it helps you examine the question: Show spread, outliers and uncertainty without hiding them. For example, consider this UX research situation: Visualise task completion durations. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Histogram versus bar chart: histogram bins lie along a numeric continuum; category bars compare separate labels."}, {"term": "Uncertainty", "meaning": "Uncertainty means limits on what a measurement or estimate establishes. In this lesson, it helps you examine the question: Show spread, outliers and uncertainty without hiding them. For example, consider this UX research situation: Visualise task completion durations. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Histogram versus bar chart: histogram bins lie along a numeric continuum; category bars compare separate labels."}], "explanation": "Averages hide shape. Histograms reveal skew, multiple peaks and long tails; box plots help compare several distributions; raw dots can expose sample sizes. Confidence intervals express estimation uncertainty, but should not be mistaken for individual-value ranges.", "workedExample": "Two onboarding variants each average 40 seconds. Variant A clusters around 40; Variant B has half at 10 and half at 70. Equal means conceal radically different user experiences.", "comparison": "Histogram versus bar chart: histogram bins lie along a numeric continuum; category bars compare separate labels.", "pitfall": "Reporting only mean without revealing spread or number of participants.", "practice": "Sketch ten task times showing a long right tail; describe how a median and histogram complement each other.", "selfCheck": "A right-skewed distribution has a long high-value tail; median and distribution shape provide context.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Distributions+and+uncertainty+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "2.4", "title": "Narrative and exploration", "concepts": "Annotations, interaction and progressive disclosure", "goal": "Distinguish guided narrative from open exploration.", "example": "Analyse the 500 Days of Summer visualisation study.", "readings": [{"title": "Fundamentals of Data Visualization", "focus": "Visualisation principles, scales, colour and graphical perception", "url": "https://clauswilke.com/dataviz/", "access": "Free online"}, {"title": "From Data to Viz", "focus": "Chart families and common caveats", "url": "https://www.data-to-viz.com/", "access": "Free online"}, {"title": "Sharma & Rajamanickam: Movie narratives", "focus": "PDF pages 5–7: representations, prototype and interaction", "url": "papers/movie-narratives.pdf#page=5", "access": "Bundled PDF"}], "studySteps": ["Define the central ideas: Annotations, interaction and progressive disclosure.", "Use the UX scenario: Analyse the 500 Days of Summer visualisation study.", "Test your understanding: explain how the idea supports this objective: Distinguish guided narrative from open exploration.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Annotation", "meaning": "Annotation means explanatory text tied to a visual feature. In this lesson, it helps you examine the question: Distinguish guided narrative from open exploration. For example, consider this UX research situation: Analyse the 500 Days of Summer visualisation study. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Narrative versus exploration: one prioritises a deliberate explanatory path, the other supports multiple user questions."}, {"term": "Progressive disclosure", "meaning": "Progressive disclosure means introducing complexity only when useful. In this lesson, it helps you examine the question: Distinguish guided narrative from open exploration. For example, consider this UX research situation: Analyse the 500 Days of Summer visualisation study. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Narrative versus exploration: one prioritises a deliberate explanatory path, the other supports multiple user questions."}, {"term": "Guided narrative", "meaning": "Guided narrative means author-led sequence highlighting findings. In this lesson, it helps you examine the question: Distinguish guided narrative from open exploration. For example, consider this UX research situation: Analyse the 500 Days of Summer visualisation study. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Narrative versus exploration: one prioritises a deliberate explanatory path, the other supports multiple user questions."}, {"term": "Exploratory interaction", "meaning": "Exploratory interaction means user-led inspection of alternative views. In this lesson, it helps you examine the question: Distinguish guided narrative from open exploration. For example, consider this UX research situation: Analyse the 500 Days of Summer visualisation study. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Narrative versus exploration: one prioritises a deliberate explanatory path, the other supports multiple user questions."}], "explanation": "An interactive graphic must decide when to guide and when to let the reader explore. A narrative introduction can teach the data structure before filters and details-on-demand are exposed. Interaction helps if it creates meaningful comparisons, not when it simply decorates a page.", "workedExample": "In the supplied non-linear movie paper, arcs connect scenes in narrative presentation order; the prototype uses an animated introduction before readers explore scene details. Ask what the reader can infer by changing the view.", "comparison": "Narrative versus exploration: one prioritises a deliberate explanatory path, the other supports multiple user questions.", "pitfall": "Adding filters without explaining what they control or how results change.", "practice": "Design a three-step election visualisation story followed by an open exploration mode.", "selfCheck": "A useful sequence frames the question, shows a key comparison, then enables geography or year filtering.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": {"text": "“data visualization can play an important role”", "attribution": "Sharma and Rajamanickam, 2015, page 1", "url": "papers/movie-narratives.pdf#page=1"}, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Narrative+and+exploration+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}], "assignments": [{"id": "2-a1", "title": "Visual redesign studio", "prompt": "Redesign a dense chart and defend each visual encoding", "length": "500–700 words", "criteria": "Show before/after screenshots or sketches and five design decisions.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}, {"id": "2-a2", "title": "Paper reading response", "prompt": "Critique how an interactive movie narrative visualisation turns scenes into data", "length": "600–800 words", "criteria": "Identify data model, interaction model, benefits and limitations.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}], "quiz": [{"q": "Best default for comparing categorical counts?", "options": ["Bar chart", "Pie chart with 20 slices", "3D surface", "Area map"], "answer": 0, "why": "Bars permit direct length comparisons."}, {"q": "A truncated bar-chart baseline can…", "options": ["Exaggerate differences", "Eliminate sampling bias", "Improve validity", "Ensure accessibility"], "answer": 0, "why": "Truncation can make modest differences look large."}, {"q": "A histogram primarily depicts…", "options": ["Distribution of numeric values", "Names of users", "Causal relationships", "Ranked features"], "answer": 0, "why": "Bins show the frequency distribution of a numeric variable."}], "links": ["https://clauswilke.com/dataviz/", "https://www.data-to-viz.com/"], "quizBank": [{"q": "Best default for comparing categorical counts?", "options": ["Bar chart", "Pie chart with 20 slices", "3D surface", "Area map"], "answer": 0, "why": "Bars permit direct length comparisons."}, {"q": "A truncated bar-chart baseline can…", "options": ["Exaggerate differences", "Eliminate sampling bias", "Improve validity", "Ensure accessibility"], "answer": 0, "why": "Truncation can make modest differences look large."}, {"q": "A histogram primarily depicts…", "options": ["Distribution of numeric values", "Names of users", "Causal relationships", "Ranked features"], "answer": 0, "why": "Bins show the frequency distribution of a numeric variable."}, {"q": "Which concept best matches: A visual property often detected quickly before focused attention?", "options": ["Preattentive feature", "Visual search", "Common scale", "Operational definition"], "answer": 0, "why": "Preattentive feature: A visual property often detected quickly before focused attention"}, {"q": "Which concept best matches: Locating a target among distractors?", "options": ["Visual search", "Preattentive feature", "Common scale", "Operational definition"], "answer": 0, "why": "Visual search: Locating a target among distractors"}, {"q": "Which concept best matches: Reference from which graphical quantities are measured?", "options": ["Baseline", "Sequential palette", "Diverging palette", "Truncated axis"], "answer": 0, "why": "Baseline: Reference from which graphical quantities are measured"}, {"q": "Which concept best matches: Ordered lightness for low-to-high values?", "options": ["Sequential palette", "Baseline", "Diverging palette", "Truncated axis"], "answer": 0, "why": "Sequential palette: Ordered lightness for low-to-high values"}, {"q": "Which concept best matches: Pattern of frequencies across observed values?", "options": ["Distribution", "Histogram", "Box plot", "Uncertainty"], "answer": 0, "why": "Distribution: Pattern of frequencies across observed values"}, {"q": "Which concept best matches: Counts of numeric observations in adjacent bins?", "options": ["Histogram", "Distribution", "Box plot", "Uncertainty"], "answer": 0, "why": "Histogram: Counts of numeric observations in adjacent bins"}, {"q": "Which concept best matches: Explanatory text tied to a visual feature?", "options": ["Annotation", "Progressive disclosure", "Guided narrative", "Exploratory interaction"], "answer": 0, "why": "Annotation: Explanatory text tied to a visual feature"}, {"q": "Which concept best matches: Introducing complexity only when useful?", "options": ["Progressive disclosure", "Annotation", "Guided narrative", "Exploratory interaction"], "answer": 0, "why": "Progressive disclosure: Introducing complexity only when useful"}]}, {"id": 3, "title": "Quantitative Research Foundations", "dates": "Nov 16–22", "desc": "Sampling, bias, measurement and study designs", "lessons": [{"id": "3.1", "title": "Sampling and representation", "concepts": "Population, sample, convenience bias and generalisability", "goal": "Explain when a convenience sample can mislead.", "example": "Recruit users for a mobile banking study.", "readings": [{"title": "OpenIntro Statistics", "focus": "Sampling, bias, data and studies", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Drummond Chapter 6", "focus": "Study designs and comparison groups", "url": "papers/drummond-research-designs.pdf", "access": "Bundled PDF"}], "studySteps": ["Define the central ideas: Population, sample, convenience bias and generalisability.", "Use the UX scenario: Recruit users for a mobile banking study.", "Test your understanding: explain how the idea supports this objective: Explain when a convenience sample can mislead.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Population", "meaning": "The population is the full group to which a research conclusion is intended to apply. For a claims dashboard evaluation, it might be all active claims officers at a defined organisation, not everyone who uses a web app. Specify eligibility and context, since generalising from five colleagues to an entire industry is not justified."}, {"term": "Sample", "meaning": "A sample is the subset of a population whose responses or behaviour are actually observed. Sample size matters, but the selection mechanism also matters: 300 volunteers can be less representative than a smaller well-selected group. Describe who participated, how they were recruited and who was excluded."}, {"term": "Sampling frame", "meaning": "A sampling frame is the practical list or source from which eligible participants can be selected. A company directory could serve as a frame for staff research, but it may exclude temporary workers. Coverage gaps mean the frame does not perfectly represent the desired population."}, {"term": "Selection bias", "meaning": "Selection bias occurs when the mechanism determining who enters a dataset or group is related to the outcome being studied. Surveying only highly engaged power users may make a product seem easier to use than it is for new users. Random assignment to conditions does not by itself guarantee the recruited participants represent the wider population."}], "explanation": "Large samples are not automatically representative. Surveying only active users tells us little about people who abandoned onboarding. Recruitment criteria and setting can matter more than sample size when the research question concerns a specialised group.", "workedExample": "A claims portal survey finds 90% satisfaction among 600 successful submitters. Users who failed to submit were never asked, creating a survivorship problem and limiting generalisability.", "comparison": "Random selection versus random assignment: selection concerns who participates; assignment concerns who receives each condition.", "pitfall": "Describing convenience respondents as representative of all users without evidence.", "practice": "Recruit eight participants for a claims form test. Specify inclusion criteria, recruitment channel and two populations not represented.", "selfCheck": "An honest plan identifies whose experience is missing and avoids population-wide conclusions.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Sampling+and+representation+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "3.2", "title": "Hypotheses and variables", "concepts": "Independent, dependent and confounding variables", "goal": "Write testable hypotheses with clear metrics.", "example": "Compare two form designs.", "readings": [{"title": "OpenIntro Statistics", "focus": "Sampling, bias, data and studies", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Drummond Chapter 6", "focus": "Study designs and comparison groups", "url": "papers/drummond-research-designs.pdf", "access": "Bundled PDF"}], "studySteps": ["Define the central ideas: Independent, dependent and confounding variables.", "Use the UX scenario: Compare two form designs.", "Test your understanding: explain how the idea supports this objective: Write testable hypotheses with clear metrics.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Independent variable", "meaning": "An independent variable is the factor whose variation or experimental manipulation is used to explain differences in an outcome. In an A/B test of two search-filter designs, filter type is the independent variable. Observing naturally different values is not the same as experimentally assigning them."}, {"term": "Dependent variable", "meaning": "A dependent variable is the outcome measured in relation to predictors or conditions. In a checkout experiment, time-to-completion or error count might be dependent variables. Specify how they are recorded and whether the metric reflects the research question."}, {"term": "Confound", "meaning": "A confound is a third factor related to both the predictor or condition and the outcome, creating an alternative explanation. If expert users get design A and novices get design B, expertise may explain completion-time differences. Random assignment, matching or statistical adjustment may reduce confounding, but none automatically fixes every bias."}, {"term": "Hypothesis", "meaning": "A hypothesis is a precise, testable expectation about a pattern or difference, derived from theory or observation. For example, “visible filter labels reduce median task time compared with icons alone” predicts a directional result. State the population, outcome and comparison; distinguish this research hypothesis from the statistical null hypothesis."}], "explanation": "A good study separates the intervention from its outcome and asks what other factor could explain the result. In nonexperimental work, calling a variable “independent” doesn't establish causality. Write hypotheses that are falsifiable and state outcome measurement precisely.", "workedExample": "Hypothesis: guided field validation decreases missing attachments. Version type predicts omission count; case complexity and employee tenure might affect both interface selection and errors.", "comparison": "Predictor versus cause: finding an association does not prove intervention effect.", "pitfall": "Concluding a new UI caused faster completion when the new group also handled easier cases.", "practice": "Identify IV, DV and two confounds for comparing a guided vs unassisted investigation form.", "selfCheck": "IV form type; DV omission errors or duration; confounds could include case complexity and agent experience.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Hypotheses+and+variables+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "3.3", "title": "Measurement and quality", "concepts": "Reliability, validity and construct definition", "goal": "Distinguish a repeatable metric from one that measures the right construct.", "example": "Evaluate “engagement” via session time.", "readings": [{"title": "OpenIntro Statistics", "focus": "Sampling, bias, data and studies", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Drummond Chapter 6", "focus": "Study designs and comparison groups", "url": "papers/drummond-research-designs.pdf", "access": "Bundled PDF"}], "studySteps": ["Define the central ideas: Reliability, validity and construct definition.", "Use the UX scenario: Evaluate “engagement” via session time.", "Test your understanding: explain how the idea supports this objective: Distinguish a repeatable metric from one that measures the right construct.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Reliability", "meaning": "Reliability is the consistency of a measurement under comparable conditions. An instrument may produce similar scores on repeated administrations while still measuring the wrong thing. For usability coding, clear definitions and agreement between independent coders can improve reliability."}, {"term": "Construct validity", "meaning": "Construct validity concerns whether a chosen measure or manipulation adequately represents the intended concept. A one-item satisfaction question may capture overall sentiment but not learnability or efficiency. Argue from theory, evidence and multiple indicators rather than treating the metric label as proof."}, {"term": "Internal validity", "meaning": "Internal validity concerns whether the study design supports a credible conclusion that the tested factor caused the observed outcome, rather than a confound or alternative event. Random assignment and controls can help in experiments. A simple before-after comparison is vulnerable to practice effects and external changes."}, {"term": "External validity", "meaning": "External validity concerns whether findings generalise beyond the observed sample, tasks and setting. A laboratory result on a desktop prototype may not transfer to mobile users in a noisy field environment. Describe the population and circumstances for which the claim is warranted."}], "explanation": "Reliable does not mean valid: a stopwatch can consistently measure task duration but may not capture confidence. Distinguish measurement quality from causal inference and generalisability. Definitions and coding protocols reduce ambiguity and improve repeatability.", "workedExample": "Two observers count “form errors”; one counts only mandatory field omissions, the other counts every correction. Their disagreement is a reliability problem. Neither count alone fully measures trust in the form.", "comparison": "Reliability versus validity: consistent results can consistently measure the wrong thing.", "pitfall": "Claiming a short survey is valid only because responses agree with one another.", "practice": "Create operational definitions for “error”, “confidence” and “success”. Explain how to check quality.", "selfCheck": "Specify clear counting rules, triangulate measures where possible and identify sources of disagreement.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Measurement+and+quality+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "3.4", "title": "Design families", "concepts": "Descriptive, observational, experimental and quasi-experimental", "goal": "Choose a suitable design for a question and its constraints.", "example": "Use the supplied Drummond chapter.", "readings": [{"title": "OpenIntro Statistics", "focus": "Sampling, bias, data and studies", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Drummond Chapter 6", "focus": "Study designs and comparison groups", "url": "papers/drummond-research-designs.pdf", "access": "Bundled PDF"}, {"title": "Drummond: Chapter 6", "focus": "PDF pages 1–4, 13–18: study types, comparison groups and bias", "url": "papers/drummond-research-designs.pdf#page=1", "access": "Bundled PDF"}], "studySteps": ["Define the central ideas: Descriptive, observational, experimental and quasi-experimental.", "Use the UX scenario: Use the supplied Drummond chapter.", "Test your understanding: explain how the idea supports this objective: Choose a suitable design for a question and its constraints.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Descriptive study", "meaning": "Descriptive study means describes how variables appear without intervention. In this lesson, it helps you examine the question: Choose a suitable design for a question and its constraints. For example, consider this UX research situation: Use the supplied Drummond chapter. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Experiment versus quasi-experiment: random assignment is the key distinguishing feature, not whether numbers are collected."}, {"term": "Observational study", "meaning": "Observational study means measures exposures and outcomes without assigning interventions. In this lesson, it helps you examine the question: Choose a suitable design for a question and its constraints. For example, consider this UX research situation: Use the supplied Drummond chapter. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Experiment versus quasi-experiment: random assignment is the key distinguishing feature, not whether numbers are collected."}, {"term": "Experiment", "meaning": "Experiment means manipulates an intervention with controlled comparison and random assignment. In this lesson, it helps you examine the question: Choose a suitable design for a question and its constraints. For example, consider this UX research situation: Use the supplied Drummond chapter. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Experiment versus quasi-experiment: random assignment is the key distinguishing feature, not whether numbers are collected."}, {"term": "Quasi-experiment", "meaning": "Quasi-experiment means introduces an intervention without full random assignment. In this lesson, it helps you examine the question: Choose a suitable design for a question and its constraints. For example, consider this UX research situation: Use the supplied Drummond chapter. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Experiment versus quasi-experiment: random assignment is the key distinguishing feature, not whether numbers are collected."}], "explanation": "The research design governs what conclusion can be justified. Description estimates states and patterns; correlation investigates association; experiments are stronger for causal claims because assignment and controls reduce alternate explanations. A quasi-experiment is valuable when randomisation isn't feasible but needs explicit treatment of group differences.", "workedExample": "A company examines existing support logs (observational); pilots a new interface in one branch and compares it with another (quasi-experimental); randomly assigns comparable users to interfaces (experimental).", "comparison": "Experiment versus quasi-experiment: random assignment is the key distinguishing feature, not whether numbers are collected.", "pitfall": "Calling every A/B comparison a randomised experiment without checking allocation.", "practice": "Choose a suitable design to assess an already launched UI change across two branches.", "selfCheck": "A quasi-experimental approach may be possible, with baseline comparisons and threats to validity documented.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": {"text": "“Quasi-experimental research does not have randomization of participants to groups.”", "attribution": "Drummond chapter 6, page 2", "url": "papers/drummond-research-designs.pdf#page=2"}, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Design+families+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}], "assignments": [{"id": "3-a1", "title": "Research proposal v1", "prompt": "Plan a quantitative study to compare two checkout designs", "length": "700–900 words", "criteria": "Question, variables, sample, procedure, measures, bias and limitations.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}, {"id": "3-a2", "title": "Methods comparison", "prompt": "Compare experimental, quasi-experimental and descriptive approaches", "length": "450–650 words", "criteria": "Give one realistic UX case for each; discuss causal inference.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}], "quiz": [{"q": "A study sample is…", "options": ["Everyone eligible", "People actually observed", "A dependent variable", "The null hypothesis"], "answer": 1, "why": "The sample is the subset measured."}, {"q": "A confounder is…", "options": ["An uncontrolled factor affecting outcomes", "The chart title", "Always the independent variable", "A sampling frame"], "answer": 0, "why": "Confounders can create alternative explanations."}, {"q": "Which best describes a descriptive study?", "options": ["It manipulates a treatment", "It necessarily proves cause", "It observes without an intervention", "It always uses random assignment"], "answer": 2, "why": "Descriptive work characterises variables rather than manipulating an intervention."}], "links": ["https://www.openintro.org/book/os/", "https://www.khanacademy.org/math/statistics-probability"], "quizBank": [{"q": "A study sample is…", "options": ["Everyone eligible", "People actually observed", "A dependent variable", "The null hypothesis"], "answer": 1, "why": "The sample is the subset measured."}, {"q": "A confounder is…", "options": ["An uncontrolled factor affecting outcomes", "The chart title", "Always the independent variable", "A sampling frame"], "answer": 0, "why": "Confounders can create alternative explanations."}, {"q": "Which best describes a descriptive study?", "options": ["It manipulates a treatment", "It necessarily proves cause", "It observes without an intervention", "It always uses random assignment"], "answer": 2, "why": "Descriptive work characterises variables rather than manipulating an intervention."}, {"q": "Which concept best matches: Entire group a study wants to understand?", "options": ["Population", "Sample", "Sampling frame", "Selection bias"], "answer": 0, "why": "Population: Entire group a study wants to understand"}, {"q": "Which concept best matches: Subset actually observed?", "options": ["Sample", "Population", "Sampling frame", "Selection bias"], "answer": 0, "why": "Sample: Subset actually observed"}, {"q": "Which concept best matches: Factor deliberately changed or used as predictor?", "options": ["Independent variable", "Dependent variable", "Confound", "Hypothesis"], "answer": 0, "why": "Independent variable: Factor deliberately changed or used as predictor"}, {"q": "Which concept best matches: Measured outcome of interest?", "options": ["Dependent variable", "Independent variable", "Confound", "Hypothesis"], "answer": 0, "why": "Dependent variable: Measured outcome of interest"}, {"q": "Which concept best matches: Consistency of a measurement across appropriate repetitions?", "options": ["Reliability", "Construct validity", "Internal validity", "External validity"], "answer": 0, "why": "Reliability: Consistency of a measurement across appropriate repetitions"}, {"q": "Which concept best matches: Whether a measure reflects the intended concept?", "options": ["Construct validity", "Reliability", "Internal validity", "External validity"], "answer": 0, "why": "Construct validity: Whether a measure reflects the intended concept"}, {"q": "Which concept best matches: Describes how variables appear without intervention?", "options": ["Descriptive study", "Observational study", "Experiment", "Quasi-experiment"], "answer": 0, "why": "Descriptive study: Describes how variables appear without intervention"}, {"q": "Which concept best matches: Measures exposures and outcomes without assigning interventions?", "options": ["Observational study", "Descriptive study", "Experiment", "Quasi-experiment"], "answer": 0, "why": "Observational study: Measures exposures and outcomes without assigning interventions"}]}, {"id": 4, "title": "Experiments & Statistical Reasoning", "dates": "Nov 23–29", "desc": "Designing credible comparisons and interpreting uncertainty", "lessons": [{"id": "4.1", "title": "Experimental logic", "concepts": "Random assignment, control and intervention", "goal": "Explain why random assignment helps isolate an effect.", "example": "Plan an A/B study of navigation.", "readings": [{"title": "OpenIntro Statistics", "focus": "Inference, confidence intervals, sampling", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Yale ENGL 300, Lecture 8", "focus": "Structuralism and semiotics", "url": "https://oyc.yale.edu/english/engl-300/lecture-8", "access": "Free online"}], "studySteps": ["Define the central ideas: Random assignment, control and intervention.", "Use the UX scenario: Plan an A/B study of navigation.", "Test your understanding: explain how the idea supports this objective: Explain why random assignment helps isolate an effect.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Random assignment", "meaning": "Random assignment uses a chance mechanism to allocate recruited participants to experimental conditions, helping balance known and unknown confounds across groups. It differs from random sampling, which concerns how people are selected from a population. Assignment improves causal comparisons, but does not automatically make a sample representative."}, {"term": "Con
