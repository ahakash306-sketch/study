<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Design Atlas · 9-week preparation</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ecedf2;background:#0b0c10;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}a{color:#b8a4ff}a:hover{text-decoration:underline}.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.sidebar{background:#111217;border-right:1px solid #282932;padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}.brand{font-size:21px;font-weight:800;letter-spacing:-.8px;padding:8px 12px}.brand span{color:#b9a1ff}.sidecap{font-size:10px;color:#777985;font-weight:800;letter-spacing:1.8px;padding:12px 12px 4px}.navbtn{width:100%;border:0;background:transparent;color:#a4a5af;text-align:left;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px}.navbtn:hover,.navbtn.active{background:#25222e;color:#f4efff}.navbtn.active{box-shadow:inset 3px 0 #af92ff}.ico{font-size:18px;width:23px;text-align:center}.sidebar .bottom{margin-top:auto;padding:15px 12px;background:#1b1b23;border-radius:14px;color:#9f9fae;font-size:12px;line-height:1.6}.main{min-width:0;padding:34px clamp(22px,5vw,76px) 80px;max-width:1600px;width:100%;margin:auto}.eyebrow{font-size:11px;font-weight:800;color:#b7a3ff;letter-spacing:2px;text-transform:uppercase}.heading{font-size:clamp(29px,3.5vw,48px);letter-spacing:-1.8px;line-height:1.1;margin:14px 0}.muted{color:#9a9ba8}.lede{font-size:15px;color:#a5a5b2;max-width:750px;line-height:1.8}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:27px 0}.panel{background:#15161c;border:1px solid #2a2b33;border-radius:16px;padding:22px}.metric small{display:block;color:#92939d;font-size:12px;margin-bottom:12px}.metric strong{font-size:30px;letter-spacing:-1px}.metric .hint{color:#8c8d99;font-size:11px;margin-top:8px}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.section-title{font-size:20px;letter-spacing:-.5px;margin:0 0 20px}.weeklist{display:grid;gap:10px}.weekrow,.lessonrow{display:flex;justify-content:space-between;align-items:center;gap:15px;width:100%;background:#1b1b23;border:1px solid #2a2b34;text-align:left;color:inherit;border-radius:12px;padding:15px 17px;transition:.15s}.weekrow:hover,.lessonrow:hover{border-color:#7866a3;background:#211e2b}.weekrow small,.lessonrow small{display:block;color:#91919f;margin-top:6px}.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:6px 9px;border-radius:8px;background:#262333;color:#c8b8ff;white-space:nowrap}.tag.done{background:#173c33;color:#7ee5bb}.bar{height:7px;border-radius:30px;background:#292a33;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#8b73e9,#c2a4ff);border-radius:inherit}.button{background:#ab8bf7;color:#130e21;border:1px solid #ab8bf7;border-radius:10px;font-weight:750;padding:11px 15px}.button:hover{background:#c1aaff}.button.secondary{background:#24232e;border-color:#373443;color:#eeeaf7}.button.ghost{background:transparent;border-color:#373443;color:#b7b2c4}.button:disabled{opacity:.4;cursor:not-allowed}.button.sm{font-size:12px;padding:8px 10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.card-title{font-weight:760;font-size:16px;margin:0 0 8px}.breadcrumb{display:flex;gap:10px;color:#8e8e9d;font-size:12px;margin-bottom:24px}.breadcrumb a{color:#b9a7f5;text-decoration:none}.split{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:22px;align-items:start}.smallcap{font-size:11px;color:#b5a1f4;letter-spacing:1.4px;font-weight:800;text-transform:uppercase}.prose{line-height:1.85;color:#c1c1ce;font-size:14px}.prose strong{color:#f4f3f6}.blocknote{padding:16px;border:1px solid #373045;background:#231d2d;border-radius:12px;color:#ddd1fb;line-height:1.7}.topic{margin:20px 0 0}.topic h3{font-size:16px}.topic p{color:#b8b8c5;line-height:1.85}.divider{border:0;border-top:1px solid #2c2c37;margin:25px 0}.lesson-card{padding:20px;border:1px solid #34303d;border-radius:13px;margin-top:15px}.lesson-card h3{margin-top:0}.questions{display:grid;gap:17px}.question{padding:20px;border:1px solid #34343e;border-radius:13px;background:#1b1b23}.question p{margin:0 0 15px;line-height:1.6}.choice{display:block;margin:8px 0;padding:12px;background:#252630;border-radius:9px;border:1px solid transparent;cursor:pointer;color:#d9dae5}.choice:has(input:checked){border-color:#a98df4;background:#30283e}.choice input{accent-color:#ab8bf7;margin-right:10px}.choice.correct{border-color:#407d63}.choice.incorrect{border-color:#af5661}.feedback{font-size:12px;line-height:1.6;margin-top:10px;color:#c5c0d1}.textarea{display:block;background:#101116;color:#ececf0;border:1px solid #41414e;border-radius:12px;padding:16px;resize:vertical;min-height:280px;width:100%;line-height:1.8;outline:none}.textarea:focus{border-color:#ae91f9}.essaymeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:10px;color:#a4a3b0;font-size:12px}.rubric{padding:15px;background:#20202a;border-radius:12px;margin-top:20px;color:#bdbcc8;font-size:13px;line-height:1.8}.module-pill{display:inline-block;border:1px solid #393441;border-radius:9px;padding:7px 10px;font-size:11px;color:#c1b0ee;margin:5px 6px 0 0}.resources{display:grid;gap:12px}.resource{display:flex;justify-content:space-between;gap:12px;color:#cdbdff;text-decoration:none;background:#20202a;padding:13px;border-radius:10px;overflow-wrap:anywhere}.resource:hover{background:#302a42}.search{padding:13px 16px;border-radius:11px;background:#181920;color:#f3f2f8;border:1px solid #363640;width:100%;margin:12px 0 23px}.modal-note{font-size:12px;color:#9d9daa;line-height:1.7}.check{display:flex;gap:10px;align-items:center;color:#dad9e0}.check input{accent-color:#a98df4;width:17px;height:17px}.toast{position:fixed;bottom:24px;right:25px;background:#302a45;border:1px solid #66568d;color:#fff;padding:13px 18px;border-radius:11px;box-shadow:0 10px 40px #0008;z-index:10}.foot{font-size:12px;color:#747582;margin-top:45px}.typeviz{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}.typeviz div{padding:14px 9px;text-align:center;border-radius:9px;background:#282137;color:#e3d5ff}.typeviz strong{display:block}.typeviz small{display:block;color:#a9a0bb;font-size:10px;margin-top:4px}@media(max-width:1100px){.grid2,.split{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:740px){.app{display:block}.sidebar{height:auto;position:static;padding:10px 15px;display:block}.brand{display:inline-block}.sidebar .sidecap,.sidebar .bottom{display:none}.sidebar nav{display:flex;gap:3px;overflow:auto}.navbtn{font-size:12px;white-space:nowrap;padding:8px}.navbtn .ico{display:none}.main{padding:25px 17px 70px}.metrics{gap:9px}.panel{padding:16px}.typeviz{grid-template-columns:repeat(2,1fr)}}

.reading-card{padding:13px 15px;margin-top:10px;border:1px solid #343541;border-radius:12px;background:#171920}.reading-card strong{display:block;font-size:13px}.reading-card small{display:block;color:#a9a8b9;line-height:1.5;margin:5px 0}.reading-card a{font-size:12px}.scoreline{display:grid;grid-template-columns:1fr 78px;gap:12px;align-items:center;margin:11px 0}.scoreline input{width:100%;min-width:0;border:1px solid #414052;background:#14151b;color:#f3f1ff;border-radius:9px;padding:10px}.mark-result{border:1px solid #62508b;background:#231b34;padding:16px;border-radius:12px;margin-top:12px}.statpill{background:#24202e;border:1px solid #4c3c66;color:#d3baff;border-radius:8px;padding:6px 10px;font-size:12px}.guide{border-left:3px solid #aa8bff;padding:12px 15px;background:#201d29;border-radius:0 12px 12px 0;margin:16px 0}.guide ol{line-height:1.8;margin-bottom:0}.marksgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.marksgrid div{padding:12px;background:#1c1c24;border-radius:10px}.marksgrid strong{display:block;font-size:19px}.marksgrid small{color:#aaa7b7}a[download]{text-decoration:none}

:root{color-scheme:dark}
html{scroll-padding-top:20px}
button,a,input,textarea{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d1bcff;outline-offset:3px}
textarea,input{max-width:100%}
@media(max-width:1024px){.sidebar{width:auto}.main{padding-left:24px;padding-right:24px}}
@media(max-width:740px){
  .sidebar{position:sticky;top:0;z-index:30;border-bottom:1px solid #34313d;background:#111217ed;backdrop-filter:blur(16px)}
  .sidebar nav{scrollbar-width:thin;padding-bottom:5px}
  .navbtn{min-height:42px;flex-shrink:0}
  .main{padding:23px 15px 85px}
  .heading{font-size:clamp(28px,8vw,40px);letter-spacing:-1px}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .metrics .metric strong{font-size:24px}
  .grid2,.split{display:grid;grid-template-columns:minmax(0,1fr)}
  .weekrow,.lessonrow{padding:14px 12px;align-items:flex-start}
  .panel{padding:15px}
  .reading-card{overflow-wrap:anywhere}
  .question{padding:14px}
  .choice{min-height:44px}
  .textarea{font-size:16px}
  .actions .button{flex:1 1 150px;min-height:44px}
  .toast{left:14px;right:14px;bottom:15px}
}
@media(max-width:390px){.metrics{grid-template-columns:1fr!important}.tag{white-space:normal}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
.github-input{display:block;width:100%;padding:12px;border-radius:10px;background:#101116;color:#f3f2f8;border:1px solid #45404f;min-height:44px;margin:6px 0 14px}
.github-status{font-size:12px;color:#bbb3c9;line-height:1.7}
.sync-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:540px){.sync-grid{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script>const CURRICULUM=[{"id":1,"title":"Foundations of Data & Research","dates":"Nov 2–8","desc":"Data types, summary statistics, and framing research questions","lessons":[{"id":"1.1","title":"Levels of measurement","concepts":"Nominal, ordinal, interval and ratio data","goal":"Recognise measurement scales, appropriate summaries and chart implications.","example":"Device categories, satisfaction ratings, temperature and task completion time.","readings":[{"title":"OpenIntro Statistics","focus":"Introduction to data: variable types and measurement","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Kulkarni and Rajamanickam paper","focus":"PDF page 2: data points and nominal/ordinal classifications","url":"papers/learning-analytics.pdf#page=2","access":"Bundled PDF"}],"studySteps":["Define the central ideas: Nominal, ordinal, interval and ratio data.","Use the UX scenario: Device categories, satisfaction ratings, temperature and task completion time.","Test your understanding: explain how the idea supports this objective: Recognise measurement scales, appropriate summaries and chart implications.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"1.2","title":"Descriptive statistics","concepts":"Mean, median, mode, spread and outliers","goal":"Calculate common summaries and choose robust interpretations.","example":"Compare checkout times with one unusually slow task.","readings":[{"title":"OpenIntro Statistics","focus":"Variables, data types and measurement scales","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Fundamentals of Data Visualization","focus":"The visualisation process and aesthetics","url":"https://clauswilke.com/dataviz/","access":"Free online"}],"studySteps":["Define the central ideas: Mean, median, mode, spread and outliers.","Use the UX scenario: Compare checkout times with one unusually slow task.","Test your understanding: explain how the idea supports this objective: Calculate common summaries and choose robust interpretations.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"1.3","title":"Visual encoding basics","concepts":"Marks, channels, encodings and chart choice","goal":"Match variable types to position, length, hue and area.","example":"Redesign a customer support dashboard.","readings":[{"title":"OpenIntro Statistics","focus":"Variables, data types and measurement scales","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Fundamentals of Data Visualization","focus":"The visualisation process and aesthetics","url":"https://clauswilke.com/dataviz/","access":"Free online"}],"studySteps":["Define the central ideas: Marks, channels, encodings and chart choice.","Use the UX scenario: Redesign a customer support dashboard.","Test your understanding: explain how the idea supports this objective: Match variable types to position, length, hue and area.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"1.4","title":"Research question anatomy","concepts":"Questions, constructs, variables and operational definitions","goal":"Turn fuzzy product concerns into measurable questions.","example":"Define “ease of completing a claim” in observable terms.","readings":[{"title":"OpenIntro Statistics","focus":"Variables, data types and measurement scales","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Fundamentals of Data Visualization","focus":"The visualisation process and aesthetics","url":"https://clauswilke.com/dataviz/","access":"Free online"}],"studySteps":["Define the central ideas: Questions, constructs, variables and operational definitions.","Use the UX scenario: Define “ease of completing a claim” in observable terms.","Test your understanding: explain how the idea supports this objective: Turn fuzzy product concerns into measurable questions.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]}],"assignments":[{"id":"1-a1","title":"Data audit and chart critique","prompt":"Classify 12 variables from a dashboard and critique two charts","length":"600–800 words","criteria":"Include variable types, chart choice, two misleading features, and justified recommendations.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]},{"id":"1-a2","title":"Research question memo","prompt":"Write a research question, hypothesis and operational measures for a product flow","length":"350–500 words","criteria":"Show question, sample, metric definitions and a possible confound.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]}],"quiz":[{"q":"Device type (mobile, desktop, tablet) is what measurement level?","options":["Nominal","Ordinal","Interval","Ratio"],"answer":0,"why":"Device types are unordered categories."},{"q":"Ranked feature preferences from first to fifth are…","options":["Nominal","Ordinal","Interval","Ratio"],"answer":1,"why":"The ranks are ordered, but distances between positions are not measurable."},{"q":"Temperature measured in Celsius is generally…","options":["Nominal","Ordinal","Interval","Ratio"],"answer":2,"why":"Celsius has equal steps but no absolute zero."},{"q":"Task completion time in seconds is…","options":["Nominal","Ordinal","Interval","Ratio"],"answer":3,"why":"Duration has equal units and a meaningful zero."},{"q":"Which is most resistant to a single extreme duration?","options":["Mean","Median","Range","Maximum"],"answer":1,"why":"The median is more robust to outliers than the mean."}],"links":["https://clauswilke.com/dataviz/","https://www.khanacademy.org/math/statistics-probability"]},{"id":2,"title":"Perception & Information Design","dates":"Nov 9–15","desc":"Graphical perception, visual hierarchy and storytelling","lessons":[{"id":"2.1","title":"How we read charts","concepts":"Comparison accuracy, preattentive features and visual attention","goal":"Explain why positions and lengths are often easier to compare than areas.","example":"Contrast bar, bubble and treemap charts.","readings":[{"title":"Fundamentals of Data Visualization","focus":"Visualisation principles, scales, colour and graphical perception","url":"https://clauswilke.com/dataviz/","access":"Free online"},{"title":"From Data to Viz","focus":"Chart families and common caveats","url":"https://www.data-to-viz.com/","access":"Free online"}],"studySteps":["Define the central ideas: Comparison accuracy, preattentive features and visual attention.","Use the UX scenario: Contrast bar, bubble and treemap charts.","Test your understanding: explain how the idea supports this objective: Explain why positions and lengths are often easier to compare than areas.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"2.2","title":"Scales and colour","concepts":"Axes, baselines, sequential and diverging palettes","goal":"Detect distorted axes and select colour encodings based on meaning.","example":"Audit a stacked dashboard chart.","readings":[{"title":"Fundamentals of Data Visualization","focus":"Visualisation principles, scales, colour and graphical perception","url":"https://clauswilke.com/dataviz/","access":"Free online"},{"title":"From Data to Viz","focus":"Chart families and common caveats","url":"https://www.data-to-viz.com/","access":"Free online"}],"studySteps":["Define the central ideas: Axes, baselines, sequential and diverging palettes.","Use the UX scenario: Audit a stacked dashboard chart.","Test your understanding: explain how the idea supports this objective: Detect distorted axes and select colour encodings based on meaning.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"2.3","title":"Distributions and uncertainty","concepts":"Histograms, box plots, variability and annotation","goal":"Show spread, outliers and uncertainty without hiding them.","example":"Visualise task completion durations.","readings":[{"title":"Fundamentals of Data Visualization","focus":"Visualisation principles, scales, colour and graphical perception","url":"https://clauswilke.com/dataviz/","access":"Free online"},{"title":"From Data to Viz","focus":"Chart families and common caveats","url":"https://www.data-to-viz.com/","access":"Free online"}],"studySteps":["Define the central ideas: Histograms, box plots, variability and annotation.","Use the UX scenario: Visualise task completion durations.","Test your understanding: explain how the idea supports this objective: Show spread, outliers and uncertainty without hiding them.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"2.4","title":"Narrative and exploration","concepts":"Annotations, interaction and progressive disclosure","goal":"Distinguish guided narrative from open exploration.","example":"Analyse the 500 Days of Summer visualisation study.","readings":[{"title":"Fundamentals of Data Visualization","focus":"Visualisation principles, scales, colour and graphical perception","url":"https://clauswilke.com/dataviz/","access":"Free online"},{"title":"From Data to Viz","focus":"Chart families and common caveats","url":"https://www.data-to-viz.com/","access":"Free online"},{"title":"Sharma & Rajamanickam: Movie narratives","focus":"PDF pages 5–7: representations, prototype and interaction","url":"papers/movie-narratives.pdf#page=5","access":"Bundled PDF"}],"studySteps":["Define the central ideas: Annotations, interaction and progressive disclosure.","Use the UX scenario: Analyse the 500 Days of Summer visualisation study.","Test your understanding: explain how the idea supports this objective: Distinguish guided narrative from open exploration.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]}],"assignments":[{"id":"2-a1","title":"Visual redesign studio","prompt":"Redesign a dense chart and defend each visual encoding","length":"500–700 words","criteria":"Show before/after screenshots or sketches and five design decisions.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]},{"id":"2-a2","title":"Paper reading response","prompt":"Critique how an interactive movie narrative visualisation turns scenes into data","length":"600–800 words","criteria":"Identify data model, interaction model, benefits and limitations.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]}],"quiz":[{"q":"Best default for comparing categorical counts?","options":["Bar chart","Pie chart with 20 slices","3D surface","Area map"],"answer":0,"why":"Bars permit direct length comparisons."},{"q":"A truncated bar-chart baseline can…","options":["Exaggerate differences","Eliminate sampling bias","Improve validity","Ensure accessibility"],"answer":0,"why":"Truncation can make modest differences look large."},{"q":"A histogram primarily depicts…","options":["Distribution of numeric values","Names of users","Causal relationships","Ranked features"],"answer":0,"why":"Bins show the frequency distribution of a numeric variable."}],"links":["https://clauswilke.com/dataviz/","https://www.data-to-viz.com/"]},{"id":3,"title":"Quantitative Research Foundations","dates":"Nov 16–22","desc":"Sampling, bias, measurement and study designs","lessons":[{"id":"3.1","title":"Sampling and representation","concepts":"Population, sample, convenience bias and generalisability","goal":"Explain when a convenience sample can mislead.","example":"Recruit users for a mobile banking study.","readings":[{"title":"OpenIntro Statistics","focus":"Sampling, bias, data and studies","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Drummond Chapter 6","focus":"Study designs and comparison groups","url":"papers/drummond-research-designs.pdf","access":"Bundled PDF"}],"studySteps":["Define the central ideas: Population, sample, convenience bias and generalisability.","Use the UX scenario: Recruit users for a mobile banking study.","Test your understanding: explain how the idea supports this objective: Explain when a convenience sample can mislead.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"3.2","title":"Hypotheses and variables","concepts":"Independent, dependent and confounding variables","goal":"Write testable hypotheses with clear metrics.","example":"Compare two form designs.","readings":[{"title":"OpenIntro Statistics","focus":"Sampling, bias, data and studies","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Drummond Chapter 6","focus":"Study designs and comparison groups","url":"papers/drummond-research-designs.pdf","access":"Bundled PDF"}],"studySteps":["Define the central ideas: Independent, dependent and confounding variables.","Use the UX scenario: Compare two form designs.","Test your understanding: explain how the idea supports this objective: Write testable hypotheses with clear metrics.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"3.3","title":"Measurement and quality","concepts":"Reliability, validity and construct definition","goal":"Distinguish a repeatable metric from one that measures the right construct.","example":"Evaluate “engagement” via session time.","readings":[{"title":"OpenIntro Statistics","focus":"Sampling, bias, data and studies","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Drummond Chapter 6","focus":"Study designs and comparison groups","url":"papers/drummond-research-designs.pdf","access":"Bundled PDF"}],"studySteps":["Define the central ideas: Reliability, validity and construct definition.","Use the UX scenario: Evaluate “engagement” via session time.","Test your understanding: explain how the idea supports this objective: Distinguish a repeatable metric from one that measures the right construct.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"3.4","title":"Design families","concepts":"Descriptive, observational, experimental and quasi-experimental","goal":"Choose a suitable design for a question and its constraints.","example":"Use the supplied Drummond chapter.","readings":[{"title":"OpenIntro Statistics","focus":"Sampling, bias, data and studies","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Drummond Chapter 6","focus":"Study designs and comparison groups","url":"papers/drummond-research-designs.pdf","access":"Bundled PDF"},{"title":"Drummond: Chapter 6","focus":"PDF pages 1–4, 13–18: study types, comparison groups and bias","url":"papers/drummond-research-designs.pdf#page=1","access":"Bundled PDF"}],"studySteps":["Define the central ideas: Descriptive, observational, experimental and quasi-experimental.","Use the UX scenario: Use the supplied Drummond chapter.","Test your understanding: explain how the idea supports this objective: Choose a suitable design for a question and its constraints.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]}],"assignments":[{"id":"3-a1","title":"Research proposal v1","prompt":"Plan a quantitative study to compare two checkout designs","length":"700–900 words","criteria":"Question, variables, sample, procedure, measures, bias and limitations.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]},{"id":"3-a2","title":"Methods comparison","prompt":"Compare experimental, quasi-experimental and descriptive approaches","length":"450–650 words","criteria":"Give one realistic UX case for each; discuss causal inference.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]}],"quiz":[{"q":"A study sample is…","options":["Everyone eligible","People actually observed","A dependent variable","The null hypothesis"],"answer":1,"why":"The sample is the subset measured."},{"q":"A confounder is…","options":["An uncontrolled factor affecting outcomes","The chart title","Always the independent variable","A sampling frame"],"answer":0,"why":"Confounders can create alternative explanations."},{"q":"Which best describes a descriptive study?","options":["It manipulates a treatment","It necessarily proves cause","It observes without an intervention","It always uses random assignment"],"answer":2,"why":"Descriptive work characterises variables rather than manipulating an intervention."}],"links":["https://www.openintro.org/book/os/","https://www.khanacademy.org/math/statistics-probability"]},{"id":4,"title":"Experiments & Statistical Reasoning","dates":"Nov 23–29","desc":"Designing credible comparisons and interpreting uncertainty","lessons":[{"id":"4.1","title":"Experimental logic","concepts":"Random assignment, control and intervention","goal":"Explain why random assignment helps isolate an effect.","example":"Plan an A/B study of navigation.","readings":[{"title":"OpenIntro Statistics","focus":"Inference, confidence intervals, sampling","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Yale ENGL 300, Lecture 8","focus":"Structuralism and semiotics","url":"https://oyc.yale.edu/english/engl-300/lecture-8","access":"Free online"}],"studySteps":["Define the central ideas: Random assignment, control and intervention.","Use the UX scenario: Plan an A/B study of navigation.","Test your understanding: explain how the idea supports this objective: Explain why random assignment helps isolate an effect.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"4.2","title":"Quasi-experiments","concepts":"Nonrandom comparison groups and interrupted time series","goal":"Spot threats when real-world assignment is constrained.","example":"Compare a feature rollout across teams.","readings":[{"title":"OpenIntro Statistics","focus":"Inference, confidence intervals, sampling","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Yale ENGL 300, Lecture 8","focus":"Structuralism and semiotics","url":"https://oyc.yale.edu/english/engl-300/lecture-8","access":"Free online"}],"studySteps":["Define the central ideas: Nonrandom comparison groups and interrupted time series.","Use the UX scenario: Compare a feature rollout across teams.","Test your understanding: explain how the idea supports this objective: Spot threats when real-world assignment is constrained.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"4.3","title":"Sampling uncertainty","concepts":"Confidence intervals, standard error and interpretation","goal":"Explain uncertainty without claiming a probability about a fixed parameter.","example":"Interpret a conversion-rate interval.","readings":[{"title":"OpenIntro Statistics","focus":"Inference, confidence intervals, sampling","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Yale ENGL 300, Lecture 8","focus":"Structuralism and semiotics","url":"https://oyc.yale.edu/english/engl-300/lecture-8","access":"Free online"}],"studySteps":["Define the central ideas: Confidence intervals, standard error and interpretation.","Use the UX scenario: Interpret a conversion-rate interval.","Test your understanding: explain how the idea supports this objective: Explain uncertainty without claiming a probability about a fixed parameter.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"4.4","title":"Structuralism primer","concepts":"Saussure, signifier/signified and systems of difference","goal":"Analyse how interface categories get their meaning.","example":"Labels: approved, pending and rejected.","readings":[{"title":"OpenIntro Statistics","focus":"Inference, confidence intervals, sampling","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Yale ENGL 300, Lecture 8","focus":"Structuralism and semiotics","url":"https://oyc.yale.edu/english/engl-300/lecture-8","access":"Free online"}],"studySteps":["Define the central ideas: Saussure, signifier/signified and systems of difference.","Use the UX scenario: Labels: approved, pending and rejected.","Test your understanding: explain how the idea supports this objective: Analyse how interface categories get their meaning.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]}],"assignments":[{"id":"4-a1","title":"Experiment protocol","prompt":"Design a controlled usability experiment with bias controls","length":"800–1,000 words","criteria":"Include recruitment, randomisation, tasks, operational measures and ethics.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]},{"id":"4-a2","title":"Semiotic interface analysis","prompt":"Analyse labels, icons and category relationships through structuralism","length":"450–650 words","criteria":"Describe a sign system and its assumed rules.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]}],"quiz":[{"q":"Random assignment primarily helps…","options":["Balance confounding factors between groups","Ensure representative sampling","Guarantee significant results","Eliminate measurement error"],"answer":0,"why":"It reduces systematic baseline differences in expectation."},{"q":"A quasi-experiment typically lacks…","options":["A research question","Random assignment","Outcome measurement","A comparison possibility"],"answer":1,"why":"Quasi-experimental research has an intervention without full random assignment."},{"q":"Structuralism emphasises…","options":["Meaning from relations within systems","Only individual intuition","Unlimited fixed universal meanings","Only cognitive biases"],"answer":0,"why":"Signs acquire meaning through relations and differences."}],"links":["https://www.openintro.org/book/os/","https://oyc.yale.edu/english/engl-300/lecture-8"]},{"id":5,"title":"Testing, Correlation & Deconstruction","dates":"Nov 30–Dec 6","desc":"Statistical inference and multiple meanings in interfaces","lessons":[{"id":"5.1","title":"Hypothesis testing","concepts":"Null hypothesis, p-values and decision errors","goal":"Interpret p-values without calling them probabilities the null is true.","example":"Evaluate an A/B result.","readings":[{"title":"Khan Academy Statistics","focus":"Hypothesis testing, p-values, correlation and regression","url":"https://www.khanacademy.org/math/statistics-probability","access":"Free online"},{"title":"Yale ENGL 300","focus":"Theory and post-structuralism","url":"https://oyc.yale.edu/english/engl-300","access":"Free online"}],"studySteps":["Define the central ideas: Null hypothesis, p-values and decision errors.","Use the UX scenario: Evaluate an A/B result.","Test your understanding: explain how the idea supports this objective: Interpret p-values without calling them probabilities the null is true.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"5.2","title":"Group comparisons","concepts":"t-tests and ANOVA at a conceptual level","goal":"Choose a comparison approach given number of groups and assumptions.","example":"Compare task times across two or three UIs.","readings":[{"title":"Khan Academy Statistics","focus":"Hypothesis testing, p-values, correlation and regression","url":"https://www.khanacademy.org/math/statistics-probability","access":"Free online"},{"title":"Yale ENGL 300","focus":"Theory and post-structuralism","url":"https://oyc.yale.edu/english/engl-300","access":"Free online"}],"studySteps":["Define the central ideas: t-tests and ANOVA at a conceptual level.","Use the UX scenario: Compare task times across two or three UIs.","Test your understanding: explain how the idea supports this objective: Choose a comparison approach given number of groups and assumptions.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"5.3","title":"Association","concepts":"Correlation, scatterplots and regression basics","goal":"Distinguish association, prediction and causation.","example":"Compare steps taken and time on task.","readings":[{"title":"Khan Academy Statistics","focus":"Hypothesis testing, p-values, correlation and regression","url":"https://www.khanacademy.org/math/statistics-probability","access":"Free online"},{"title":"Yale ENGL 300","focus":"Theory and post-structuralism","url":"https://oyc.yale.edu/english/engl-300","access":"Free online"}],"studySteps":["Define the central ideas: Correlation, scatterplots and regression basics.","Use the UX scenario: Compare steps taken and time on task.","Test your understanding: arity and citations",10]]}],"quiz":[{"q":"A p-value is…","options":["Probability the null is true","Probability of data at least as extreme, under the null model","Effect size","Chance the design is ethical"],"answer":1,"why":"It is calculated assuming the null model, not a probability assigned to the hypothesis."},{"q":"Correlation alone demonstrates…","options":["Causation","Association","Randomisation","Experimental control"],"answer":1,"why":"Association does not establish causality."},{"q":"Post-structuralism highlights…","options":["Meaning as contextual and contestable","Absolute fixed interpretation","Only sample size","The absence of language"],"answer":0,"why":"Interpretation varies with context and social practices."}],"links":["https://www.khanacademy.org/math/statistics-probability","https://oyc.yale.edu/english/engl-300"]},{"id":6,"title":"Power, Discourse & Technology","dates":"Dec 7–13","desc":"Critical analysis of technological products and institutions","lessons":[{"id":"6.1","title":"Foucault and knowledge","concepts":"Power/knowledge, classifications and institutions","goal":"Explain how classification can shape behaviour and opportunity.","example":"Examine a recruitment ranking system.","readings":[{"title":"Stanford Encyclopedia: Foucault","focus":"Power, knowledge and discipline","url":"https://plato.stanford.edu/entries/foucault/","access":"Free online"},{"title":"Design Justice","focus":"Critical and ethical questions about technology","url":"https://designjustice.mitpress.mit.edu/","access":"Free online"},{"title":"Winner: Do Artifacts Have Politics?","focus":"Technology and political arrangements","url":"https://classes.cs.uchicago.edu/archive/2020/winter/20370-1/readings/Winner.pdf","access":"Free online"}],"studySteps":["Define the central ideas: Power/knowledge, classifications and institutions.","Use the UX scenario: Examine a recruitment ranking system.","Test your understanding: explain how the idea supports this objective: Explain e"}],"studySteps":["Define the central ideas: How words and categories legitimise some practices.","Use the UX scenario: Eligibility and risk scores.","Test your understanding: explain how the idea supports this objective: Ask who defines success and normality in a platform.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"6.4","title":"Politics of artefacts","concepts":"Winner, design decisions and distribution of power","goal":"Analyse who benefits, who is excluded and who governs technology.","example":"Identity checks and automated moderation.","readings":[{"title":"Stanford Encyclopedia: Foucault","focus":"Power, knowledge and discipline","url":"https://plato.stanford.edu/entries/foucault/","access":"Free online"},{"title":"Design Justice","focus":"Critical and ethical questions about technology","url":"https://designjustice.mitpress.mit.edu/","access":"Free online"},{"title":"Winner: Do Artifacts Have Politics?","focus":"Technology and political arrangements","url":"https://classes.cs.uchicago.edu/archive/2020/winter/20370-1/readings/Winner.pdf","access":"Free online"}],"studySteps":["Define the central ideas: Winner, design decisions and distribution of power.","Use the UX scenario: Identity checks and automated moderation.","Test your understanding: explain how the idea supports this objective: Analyse who benefits, who is excluded and who governs technology.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]}],"assignments":[{"id":"6-a1","title":"Critical technology essay","prompt":"Analyse one enterprise system using Foucault and Winner","length":"900–1,200 words","criteria":"Thesis, two theoretical concepts, concrete interface evidence, counterargument, conclusion.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]},{"id":"6-a2","title":"Academic reading response","prompt":"Evaluate the arguments and limitations of a critical design reading","length":"400–600 words","criteria":"Summarise the claim fairly, present evidence, then critique.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]}],"quiz":[{"q":"Power/knowledge asks us to examine…","options":["How categories and expertise shape what counts as truth","Only colour palettes","Only response times","Only screen sizes"],"answer":0,"why":"Knowledge-making practices and power reinforce one another."},{"q":"Panopticism is relevant to…","options":["Visibility and self-regulation","Only colour blindness","File compression","Chart bin width"],"answer":0,"why":"The possibility of being observed can alter conduct."},{"q":"Do Artifacts Have Politics? invites us to ask…","options":["How design embeds social power","How to optimise icon corners","Whether mean equals median","Whether a prototype compiles"],"answer":0,"why":"Technical arrangements may have political consequences."}],"links":["https://plato.stanford.edu/entries/foucault/","https://designjustice.mitpress.mit.edu/"]},{"id":7,"title":"Human Factors & Evaluation","dates":"Dec 14–20","desc":"Cognition, workload and usability evidence","lessons":[{"id":"7.1","title":"Perception and attention","concepts":"Selective attention, visual search and salience","goal":"Reduce attentional competition in complex interfaces.","example":"Inspect an alert-heavy case management UI.","readings":[{"title":"Nielsen Norman Group","focus":"Ten usability heuristics","url":"https://www.nngroup.com/articles/ten-usability-heuristics/","access":"Free online"},{"title":"NASA TLX","focus":"Task workload dimensions","url":"https://humansystems.arc.nasa.gov/groups/tlx/","access":"Free online"},{"title":"Designing with the Mind in Mind","focus":"Jeff Johnson, relevant chapters on attention and memory (book reference)","url":"","access":"Book reference; obtain through library/bookstore"}],"studySteps":["Define the central ideas: Selective attention, visual search and salience.","Use the UX scenario: Inspect an alert-heavy case management UI.","Test your understanding: explain how the idea supports this objective: Reduce attentional competition in complex interfaces.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"7.2","title":"Memory and mental models","concepts":"Working memory, chunking and recognition","goal":"Explain how external cues support users.","example":"Redesign multi-step onboarding.","readings":[{"title":"Nielsen Norman Group","focus":"Ten usability heuristics","url":"https://www.nngroup.com/articles/ten-usability-heuristics/","access":"Free online"},{"title":"NASA TLX","focus":"Task workload dimensions","url":"https://humansystems.arc.nasa.gov/groups/tlx/","access":"Free online"},{"title":"Designing with the Mind in Mind","focus":"Jeff Johnson, relevant chapters on attention and memory (book reference)","url":"","access":"Book reference; obtain through library/bookstore"}],"studySteps":["Define the central ideas: Working memory, chunking and recognition.","Use the UX scenario: Redesign multi-step onboarding.","Test your understanding: explain how the idea supports this objective: Explain how external cues support users.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"7.3","title":"Workload and error","concepts":"NASA-TLX, slips, mistakes and task demands","goal":"Identify human error risks without blaming users.","example":"High-stakes approval screens.","readings":[{"title":"Nielsen Norman Group","focus":"Ten usability heuristics","url":"https://www.nngroup.com/articles/ten-usability-heuristics/","access":"Free online"},{"title":"NASA TLX","focus":"Task workload dimensions","url":"https://humansystems.arc.nasa.gov/groups/tlx/","access":"Free online"},{"title":"Designing with the Mind in Mind","focus":"Jeff Johnson, relevant chapters on attention and memory (book reference)","url":"","access":"Book reference; obtain through library/bookstore"}],"studySteps":["Define the central ideas: NASA-TLX, slips, mistakes and task demands.","Use the UX scenario: High-stakes approval screens.","Test your understanding: explain how the idea supports this objective: Identify human error risks without blaming users.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]},{"id":"7.4","title":"Evaluation metrics","concepts":"Success, time, errors and qualitative context","goal":"Choose metrics that match research questions.","example":"Plan a short comparative usability test.","readings":[{"title":"Nielsen Norman Group","focus":"Ten usability heuristics","url":"https://www.nngroup.com/articles/ten-usability-heuristics/","access":"Free online"},{"title":"NASA TLX","focus":"Task workload dimensions","url":"https://humansystems.arc.nasa.gov/groups/tlx/","access":"Free online"},{"title":"Designing with the Mind in Mind","focus":"Jeff Johnson, relevant chapters on attention and memory (book reference)","url":"","access":"Book reference; obtain through library/bookstore"}],"studySteps":["Define the central ideas: Success, time, errors and qualitative context.","Use the UX scenario: Plan a short comparative usability test.","Test your understanding: explain how the idea supports this objective: Choose metrics that match research questions.","Write a short evidence-based explanation, cite the reading, and note at least one limitation."]}],"assignments":[{"id":"7-a1","title":"Human factors audit","prompt":"Audit a complex workflow for attention and error risk","length":"700–900 words","criteria":"Use at least three cognitive principles and prioritise mitigations.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]},{"id":"7-a2","title":"Usability protocol","prompt":"Create a test script, measures and post-task prompts","length":"450–650 words","criteria":"Provide realistic tasks, success criteria and a consent note.","rubric":[["Problem definition and thesis",20],["Conceptual or methodological accuracy",25],["Use of evidence and examples",25],["Critical reflection and limitations",20],["Structure, clarity and citations",10]]}],"quiz":[{"q":"Recognition rather than recall often…","options":["Increases memory demand","Reduces memory demand","Proves perfect usability","Removes need for testing"],"answer":1,"why":"Visible cues can reduce reliance on memory."},{"q":"A slip differs from a mistake because…","options":["The goal may be correct but execution goes wrong","It is always intentional","It only occurs in children","It is a statistical test"],"answer":0,"why":"Slips often concern execution; mistakes often concern planning or understanding."},{"q":"Task success rate measures…","options":["Completion of defined tasks","Average revenue","Visual contrast","Mean age"],"answer":0,"why":"It measures the proportion meeting task-specific success criteria."}],"links":["https://www.nngroup.com/articles/ten-usability-heuristics/","https://humansystems.arc.nasa.gov/groups/tlx/"]},{"id":8,"title":"Integrated Mini Research Project","dates":"Dec 21–27","desc":"Bring research, visualisation and theory together","lessons":[{"id":"8.1","title":"Problem framing","concepts":"Context, constraints and a narrow testable question","goal":"Choose a realistic enterprise UX problem.","example":"Use an investigation or analytics workflow.","readings":[{"title":"OpenIntro Statistics","focus":"Sampling, analysis and uncertainty","url":"https://www.openintro.org/book/os/","access":"Free online"},{"title":"Fundamentals of Data Visualizatio const KEY='design-atlas-9week-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.completed??={};state.quizzes??={};state.drafts??={};state.assignments??={};state.notes??={};state.marks??={};state.reading??={};let view='dashboard',weekIdx=0,lessonIdx=0,assignmentIdx=0,query='';
const $=x=>document.querySelector(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),total=()=>CURRICULUM.reduce((n,w)=>n+w.lessons.length,0),count=()=>Object.values(state.completed).filter(Boolean).length,pct=()=>Math.round(100*count()/total()),wordCount=s=>s.trim()?s.trim().split(/\s+/).length:0,weekProgress=i=>CURRICULUM[i].lessons.filter(l=>state.completed[l.id]).length;
function icon(n){return {dashboard:'◫',roadmap:'▦',assignments:'✎',resources:'◈',settings:'⚙'}[n]||'◦'}
function shell(content){$('#root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">design<span>atlas.</span></div><div class="sidecap">YOUR WORKSPACE</div><nav>${[['dashboard','Dashboard'],['roadmap','9-week roadmap'],['assignments','Writing studio'],['resources','Reading library'],['settings','Your data']].map(([k,t])=>`<button class="navbtn ${view===k||(view==='week'||view==='lesson'||view==='quiz')&&k==='roadmap'?'active':''}" onclick="navigate('${k}')"><span class="ico">${icon(k)}</span>${t}</button>`).join('')}</nav><div class="bottom">IDC IIT Bombay · ePGD IxD<br>Independent nine-week preparation plan.<br><br>Progress saved on this browser.</div></aside><main class="main">${content}<p class="foot">Independent preparatory learning workspace. Not an official IDC IIT Bombay course platform or university assessment.</p></main></div>`}
function navigate(v,i=0,j=0){view=v;weekIdx=i;lessonIdx=j;window.scrollTo({top:0,behavior:'instant'});render()}
function header(top,title,desc){return `<div class="eyebrow">${top}</div><h1 class="heading">${title}</h1><p class="lede">${desc}</p>`}
function dashboard(){let list=CURRICULUM.map((w,i)=>`<button class="weekrow" onclick="navigate('week',${i})"><div><b style="font-size:14px">${String(i+1).padStart(2,'0')} · ${esc(w.title)}</b><small>${esc(w.dates)} · ${weekProgress(i)}/4 lessons</small></div><span class="tag ${weekProgress(i)===4?'done':''}">${weekProgress(i)===4?'Complete':'Open →'}</span></button>`).join('');return header('Your learning home','Build the thinking behind the design.','A focused 9-week self-study journey: 36 lessons, 9 quizzes, 18 essays and practical assignments. Learn, practise, test yourself, and keep every draft together.')+`<div class="metrics"><div class="panel metric"><small>Learning progress</small><strong>${pct()}%</strong><div class="bar" style="margin-top:12px"><span style="width:${pct()}%"></span></div></div><div class="panel metric"><small>Lessons completed</small><strong>${count()} <span class="muted">/ 36</span></strong><div class="hint">Across nine weeks</div></div><div class="panel metric"><small>Quizzes submitted</small><strong>${Object.keys(state.quizzes).length} <span class="muted">/ 9</span></strong><div class="hint">Instant explanations</div></div><div class="panel metric"><small>Assignments marked complete</small><strong>${Object.values(state.assignments).filter(Boolean).length} <span class="muted">/ 18</span></strong><div class="hint">Drafts autosaved</div></div></div><div class="grid2"><section class="panel"><h2 class="section-title">Your weekly roadmap</h2><div class="weeklist">${list}</div></section><section style="display:grid;gap:17px;align-content:start"><div class="panel"><div class="smallcap">Start here</div><h2>Week 1 · Foundations</h2><p class="prose">Begin with levels of measurement, then move to descriptive statistics, visual encoding, and research questions.</p><button class="button" onclick="navigate('lesson',0,0)">Start lesson 1 →</button></div><div class="panel"><h2 class="section-title">How to study</h2><p class="prose">Read a lesson → complete the guided exercise → mark it finished → take the weekly quiz → submit two practice assignments. Essays are self-reviewed with criteria, not AI graded.</p></div><div class="panel"><h2 class="section-title">Weekly rhythm</h2><p class="prose">Mon: reading · Tue: research · Wed: data · Thu: paper review · Fri: rest · Sat: practice · Sun: essay & review.</p><span class="tag">~8 hours / week</span></div></section></div>`}
function roadmap(){return header('Your syllabus','Nine weeks. One focused goal.','The complete pre-course preparation sequence, scheduled from 2 November 2026 through 8 January 2027.')+`<div class="weeklist">${CURRICULUM.map((w,i)=>`<button class="weekrow" onclick="navigate('week',${i})"><div><div class="smallcap">Week ${i+1} · ${esc(w.dates)}</div><h3 style="margin:8px 0">${esc(w.title)}</h3><div class="muted" style="font-size:13px">${esc(w.desc)}</div><div class="bar" style="margin-top:14px;max-width:330px"><span style="width:${weekProgress(i)*25}%"></span></div></div><span class="tag">${weekProgress(i)}/4 →</span></button>`).join('')}</div>`}
function week(){let w=CURRICULUM[weekIdx];return `<div class="breadcrumb"><a href="#" onclick="navigate('roadmap');return false">Roadmap</a><span>/</span>Week ${weekIdx+1}</div>`+header(`Week ${weekIdx+1} · ${w.dates}`,esc(w.title),esc(w.desc))+`<div class="metrics" style="grid-template-columns:repeat(3,1fr)"><div class="panel metric"><small>Lessons</small><strong>${weekProgress(weekIdx)}/4</strong></div><div class="panel metric"><small>Quiz</small><strong>${state.quizzes[w.id]?'Done':'Open'}</strong></div><div class="panel metric"><small>Assignments</small><strong>${w.assignments.filter(a=>state.assignments[a.id]).length}/2</strong></div></div><div class="split"><div><div class="panel"><h2 class="section-title">Lessons</h2><div class="weeklist">${w.lessons.map((l,j)=>`<button class="lessonrow" onclick="navigate('lesson',${weekIdx},${j})"><div><div class="smallcap">Lesson ${l.id}</div><b>${esc(l.title)}</b><small>${esc(l.concepts)}</small></div><span class="tag ${state.completed[l.id]?'done':''}">${state.completed[l.id]?'✓ Done':'Study →'}</span></button>`).join('')}</div><div class="actions"><button class="button" onclick="navigate('quiz',${weekIdx})">Take week ${weekIdx+1} quiz →</button></div></div><div class="panel" style="margin-top:18px"><h2 class="section-title">Assignments & essays</h2>${w.assignments.map((a,j)=>`<button class="lessonrow" style="margin-top:10px" onclick="navigate('write',${weekIdx},${j})"><div><b>${esc(a.title)}</b><small>${esc(a.length)} · ${state.assignments[a.id]?'Marked complete':'Draft workspace'}</small></div><span>↗</span></button>`).join('')}</div></div><div><div class="panel"><h2 class="section-title">Reading for this week</h2><div class="resources">${w.links.map(u=>`<a href="${esc(u)}" class="resource" target="_blank" rel="noopener noreferrer">${esc(new URL(u).hostname)} <span>↗</span></a>`).join('')}</div><p class="modal-note">Read selectively. These are recommended learning references, not confirmed prescribed textbooks.</p></div><div class="panel" style="margin-top:17px"><h2 class="section-title">Evaluation progress</h2><p class="prose">Quiz: 30% · Two manually marked assignments: 70%</p><div class="mark-result"><strong>${weekGrade(w)===null?'Pending marks':weekGrade(w)+'/100'}</strong><p class="modal-note">A local practice score, not an official grade.</p></div><hr class="divider"><h2 class="section-title">Weekly learning outcome</h2><p class="prose">${esc(w.desc)}</p><div class="bar"><span style="width:${weekProgress(weekIdx)*25}%"></span></div></div></div></div>`}
function readingCards(l){return `<div class="panel" style="margin-top:17px"><h2 class="section-title">Required reading map</h2><p class="modal-note">Choose the listed chapter or focus area. Book references without a link require your own copy or library access. PDF page numbers refer to the provided files.</p>${(l.readings||[]).map((r,i)=>{let id=l.id+'-r'+i;return `<div class="reading-card"><strong>${esc(r.title)}</strong><small>${esc(r.focus)} · ${esc(r.access)}</small>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open source ↗</a>`:'<span class="modal-note">No open-access copy bundled</span>'}<label class="check" style="margin-top:9px"><input type="checkbox" ${state.reading[id]?'checked':''} onchange="state.reading['${id}']=this.checked;save()"> Mark as read</label></div>`}).join('')}</div>`}
function studyGuide(l){return `<div class="guide"><strong>Guided study sequence</strong><ol>${(l.studySteps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`}
const RUBRIC_LABELS=['Problem definition and thesis','Conceptual or methodological accuracy','Use of evidence and examples','Critical reflection and limitations','Structure, clarity and citations'];
function rubricWidget(a){let marks=state.marks[a.id]||{};return `<div class="panel" style="margin-top:17px"><h2 class="section-title">Evaluator marks · 100 points</h2><p class="modal-note">Self-assessment or manually entered feedback from a tutor/evaluator. This website cannot automatically judge essay quality. Values are provisional until an evaluator reviews your work.</p>${a.rubric.map(([name,max],i)=>`<label class="scoreline"><span style="font-size:12px">${esc(name)} <small style="color:#a9a4b4">/ ${max}</small></span><input type="number" min="0" max="${max}" step="1" aria-label="${esc(name)} marks" value="${marks[i]??''}" oninput="updateMark('${a.id}',${i},this.value,${max})"></label>`).join('')}<div class="mark-result" id="marksOutput">${marksResult(a)}</div><label style="font-size:12px;display:block;margin-top:13px">Evaluator notes / feedback<textarea class="textarea" style="min-height:105px;margin-top:7px" oninput="state.marks['${a.id}']??={};state.marks['${a.id}'].feedback=this.value;save()">${esc(marks.feedback||'')}</textarea></label></div>`}
function marksResult(a){let m=state.marks[a.id]||{},filled=a.rubric.every((r,i)=>m[i]!==undefined&&m[i]!=='');let total=a.rubric.reduce((n,r,i)=>n+(Number(m[i])||0),0);return filled?`<strong>${total}/100 · ${total>=85?'Excellent':total>=70?'Strong':total>=55?'Developing':'Revise and resubmit'}</strong><p class="modal-note">Assessment recorded manually; not an official IIT Bombay grade.</p>`:'<strong>Awaiting evaluation</strong><p class="modal-note">Enter all five category marks to calculate the score.</p>'}
function updateMark(id,i,v,max){state.marks[id]??={};state.marks[id][i]=v===''?'':Math.min(max,Math.max(0,Number(v)));save();let a=CURRICULUM.flatMap(w=>w.assignments).find(a=>a.id===id);document.getElementById('marksOutput').innerHTML=marksResult(a)}
function weekGrade(w){let quizzes=state.quizzes[w.id],ams=w.assignments.map(a=>{let m=state.marks[a.id]||{};return a.rubric.every((r,i)=>m[i]!==undefined&&m[i]!=='')?a.rubric.reduce((n,r,i)=>n+Number(m[i]),0):null});if(!quizzes||ams.some(x=>x===null))return null;return Math.round((quizzes.score/w.quiz.length)*30+((ams[0]+ams[1])/2)*.7)}
function lesson(){let w=CURRICULUM[weekIdx],l=w.lessons[lessonIdx],first=weekIdx===0&&lessonIdx===0;let specific=first?`<div class="typeviz">${[['Nominal','Categories'],['Ordinal','Ranked'],['Interval','Equal steps'],['Ratio','True zero']].map(x=>`<div><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div><div class="lesson-card"><h3>Nominal: identity without order</h3><p class="prose">Device type (mobile, tablet, desktop) groups users without a natural ranking. You may count category frequencies, but averaging encoded category numbers is meaningless.</p></div><div class="lesson-card"><h3>Ordinal: order without equal gaps</h3><p class="prose">A five-point satisfaction response has an order. The gap between “neutral” and “satisfied” need not equal that between “satisfied” and “very satisfied”. Frequencies and medians are natural summaries. Means of Likert-type responses are sometimes used with explicit assumptions.</p></div><div class="lesson-card"><h3>Interval: equal differences without absolute zero</h3><p class="prose">Celsius temperatures have equal steps. The difference between 10°C and 20°C equals the difference between 20°C and 30°C, but 20°C is not twice the absolute temperature of 10°C.</p></div><div class="lesson-card"><h3>Ratio: equal differences with a true zero</h3><p class="prose">Elapsed task time, click counts and distances have a meaningful zero. A task lasting 40 seconds takes twice as long as one lasting 20 seconds.</p></div><div class="blocknote"><strong>Design implication:</strong> Before selecting a chart or statistical method, identify what the variable represents and which comparisons are defensible.</div>`:'';
return `<div class="breadcrumb"><a href="#" onclick="navigate('week',${weekIdx});return false">Week ${weekIdx+1}</a><span>/</span>Lesson ${l.id}</div>`+header(`Lesson ${l.id} · Week ${weekIdx+1}`,esc(l.title),esc(l.concepts))+`<div class="split"><article><div class="panel"><div class="smallcap">Learning objective</div><p class="prose"><strong>${esc(l.goal)}</strong></p><hr class="divider"><h2 class="section-title">Understand the concept</h2><p class="prose">${esc(l.concepts)}. First define each idea in your own words, then identify how it changes the interpretation or design of a product. Avoid memorising a term without identifying the evidence behind it.</p>${specific}${studyGuide(l)}<div class="lesson-card"><div class="smallcap">Applied UX example</div><p class="prose">${esc(l.example)}</p><h3>Work through these questions</h3><ol class="prose"><li>What problem or analytical question is this concept addressing?</li><li>Which assumptions or measurements are needed?</li><li>What design decision would change because of it?</li><li>What could go wrong if the idea were applied carelessly?</li></ol></div><h3>Practice notes</h3><textarea class="textarea" id="lessonnotes" placeholder="Write your explanation, worked example and questions here. Notes save automatically.">${esc(state.notes[l.id]||'')}</textarea><div class="essaymeta"><span id="notestatus">Autosaved locally</span><span id="notecount">${wordCount(state.notes[l.id]||'')} words</span></div><div class="actions"><label class="check"><input type="checkbox" ${state.completed[l.id]?'checked':''} onchange="toggleLesson('${l.id}',this.checked)"> Mark this lesson completed</label></div><div class="actions"><button class="button secondary" onclick="navigate('week',${weekIdx})">← Weekly overview</button><button class="button" onclick="${lessonIdx<3?`navigate('lesson',${weekIdx},${lessonIdx+1})`:`navigate('quiz',${weekIdx})`}">${lessonIdx<3?'Next lesson':'Take weekly quiz'} →</button></div></div></article><aside>${readingCards(l)}<div class="panel"><div class="smallcap">Additional links</div><p class="prose">Use these curated links to study the foundations more deeply.</p>${w.links.map(u=>`<a class="resource" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(new URL(u).hostname)} ↗</a>`).join('')}<p class="modal-note">This is a concise, original study guide and practice scaffold. Use linked sources for full explanations and worked demonstrations.</p></div><div class="panel" style="margin-top:17px"><div class="smallcap">Reflection prompt</div><p class="prose">Which assumption in this lesson would be easiest to overlook in your current design practice?</p></div></aside></div>`}
function toggleLesson(id,v){state.completed[id]=v;save();toast(v?'Lesson marked complete':'Lesson marked incomplete')}
function quiz(){const w=CURRICULUM[weekIdx],prev=state.quizzes[w.id];let selected=prev?.answers||{};return `<div class="breadcrumb"><a href="#" onclick="navigate('week',${weekIdx});return false">Week ${weekIdx+1}</a><span>/</span>Quiz</div>`+header(`Knowledge check · Week ${weekIdx+1}`,esc(w.title),'Answer every question, submit to see your score and reasoning, then retry as often as you need.')+`<div class="split"><div class="panel"><form id="quizForm"><div class="questions">${w.quiz.map((q,i)=>`<div class="question"><div class="smallcap">Question ${i+1} of ${w.quiz.length}</div><p><strong>${esc(q.q)}</strong></p>${q.options.map((opt,j)=>`<label class="choice ${prev?(j===q.answer?'correct':selected[i]===j?'incorrect':''):''}"><input type="radio" name="q${i}" value="${j}" ${selected[i]===j?'checked':''} required> ${esc(opt)}</label>`).join('')}${prev?`<div class="feedback">${selected[i]===q.answer?'✓ Correct. ':'Answer: '+esc(q.options[q.answer])+'. '}${esc(q.why)}</div>`:''}</div>`).join('')}</div><div class="actions"><button class="button" type="submit">Check answers</button><button type="button" class="button ghost" onclick="resetQuiz(${weekIdx})">Reset quiz</button></div></form>${prev?`<div class="blocknote" style="margin-top:18px"><strong>Last result: ${prev.score}/${w.quiz.length}</strong><br>Review the explanations above and retry whenever useful.</div>`:''}</div><aside class="panel"><h2 class="section-title">Quiz guidance</h2><p class="prose">These are self-study practice questions, not university exam questions. Read the explanation even when you answer correctly.</p><button class="button secondary" onclick="navigate('week',${weekIdx})">Return to week</button></aside></div>`}
function resetQuiz(i){delete state.quizzes[i+1];save();navigate('quiz',i)}
function assignmentCards(filter=''){return CURRICULUM.flatMap((w,i)=>w.assignments.map((a,j)=>({a,i,j,w}))).filter(o=>(o.a.title+' '+o.a.prompt+' '+o.w.title).toLowerCase().includes(filter.toLowerCase())).map(o=>`<button class="lessonrow" onclick="navigate('write',${o.i},${o.j})"><div><div class="smallcap">Week ${o.i+1} · ${esc(o.w.title)}</div><h3 style="margin:8px 0;font-size:15px">${esc(o.a.title)}</h3><small>${esc(o.a.length)} · ${wordCount(state.drafts[o.a.id]||'')} words drafted</small></div><span class="tag ${state.assignments[o.a.id]?'done':''}">${state.assignments[o.a.id]?'✓ Complete':'Write →'}</span></button>`).join('')}
function assignments(){return header('Writing studio','Your essays & assignments.','Eighteen essays and assignments with autosaved drafts, transparent 100-point rubrics, evaluator mark entry and export options.')+`<input class="search" id="searchAssignments" placeholder="Search assignments or topics…" value="${esc(query)}"><div id="assignmentList" class="weeklist">${assignmentCards(query)}</div>`}
function write(){const w=CURRICULUM[weekIdx],a=w.assignments[lessonIdx],draft=state.drafts[a.id]||'';return `<div class="breadcrumb"><a href="#" onclick="navigate('assignments');return false">Writing studio</a><span>/</span>Week ${weekIdx+1}</div>`+header('Academic writing workspace',esc(a.title),esc(a.prompt))+`<div class="split"><div class="panel"><div class="smallcap">Your response</div><p class="modal-note">Suggested length: ${esc(a.length)}. Write a defensible argument, use appropriate citations for external claims, and explain your limitations.</p><textarea id="draft" class="textarea" style="min-height:510px" placeholder="Title\n\nIntroduction: Define the problem and thesis.\n\nBody: Present evidence, concepts, argument and examples.\n\nDiscussion: Consider limitations and counterarguments.\n\nConclusion: Summarise what follows from the evidence.\n\nReferences: Add your sources.">${esc(draft)}</textarea><div class="essaymeta"><span id="draftstatus">Saved in this browser</span><span id="draftcount">${wordCount(draft)} words · suggested ${esc(a.length)}</span></div><div class="actions"><button class="button secondary" onclick="exportDraft('${a.id}')">Download .txt</button><button class="button ghost" onclick="copyDraft('${a.id}')">Copy draft</button></div><hr class="divider"><label class="check"><input type="checkbox" ${state.assignments[a.id]?'checked':''} onchange="state.assignments['${a.id}']=this.checked;save();toast('Assignment status saved')"> Mark as completed after reviewing</label></div><aside>${rubricWidget(a)}<div class="panel"><h2 class="section-title">Self-assessment rubric</h2><p class="prose">${esc(a.criteria)}</p><div class="rubric"><strong>Review before submission</strong><ul><li>Clear question and central claim</li><li>Correct concept or research method</li><li>Specific design evidence or example</li><li>Limitations and alternative explanations</li><li>Readable structure and referenced sources</li></ul></div></div><div class="panel" style="margin-top:17px"><h2 class="section-title">Writing advice</h2><p class="prose">A concise thesis, precise evidence, and a considered limitation are more valuable than adding length. Do not invent citations or present illustrative data as collected evidence.</p></div></aside></div>`}
function resources(){return header('Course library','Every lesson, mapped to materials.','36 lesson-by-lesson reading maps, four bundled research PDFs and free textbook references. Sources labelled as books may require library access.')+`<div class="panel"><h2 class="section-title">Your uploaded research papers</h2><div class="resources">${[['Non-linear film narrative visualisation','papers/movie-narratives.pdf'],['Election data visual discovery','papers/election-visualisation.pdf'],['Learning analytics in resource constrained schools','papers/learning-analytics.pdf'],['Drummond research design textbook chapter','papers/drummond-research-designs.pdf']].map(x=>`<a class="resource" href="${x[1]}" target="_blank">${esc(x[0])} <span>Open PDF ↗</span></a>`).join('')}</div></div><div class="panel" style="margin-top:18px"><h2 class="section-title">Lesson reading directory</h2>${CURRICULUM.map((w,i)=>`<h3>Week ${i+1}: ${esc(w.title)}</h3>${w.lessons.map((l,j)=>`<button class="lessonrow" onclick="navigate('lesson',${i},${j})"><div><strong>${esc(l.id)} ${esc(l.title)}</strong><small>${l.readings.length} sources: ${esc(l.readings.map(r=>r.title).join(' · '))}</small></div><span>Read →</span></button>`).join('')}`).join('')}</div>`} 
function settings(){return header('Your workspace','Data and backup.','Your notes, essay drafts and learning progress live in your browser using local storage. Export them regularly, especially before clearing browser data.')+`<div class="panel" style="max-width:750px"><h2 class="section-title">Export your work</h2><p class="prose">Save a JSON backup containing lesson checkmarks, quiz scores, writing drafts and practice notes. You can import this backup on another computer or browser.</p><div class="actions"><button class="button" onclick="backup()">Download backup (.json)</button><label class="button secondary" for="restore" style="cursor:pointer">Import backup</label><input type="file" id="restore" accept="application/json" hidden onchange="restoreBackup(event)"></div>${githubPanel()}<hr class="divider"><p class="prose"><strong>Privacy:</strong> This website runs locally with no account or server. Nothing is uploaded automatically. Browser storage is device-specific and may be cleared.</p><button class="button ghost" onclick="if(confirm('Permanently erase your locally saved study progress and drafts?')){localStorage.removeItem(KEY);location.reload()}">Clear local data</button></div>`}

function githubPanel(){
  const cfg=JSON.parse(localStorage.getItem('atlas-gh-config')||'{}');
  return `<hr class="divider"><h2 class="section-title">Private GitHub progress sync</h2>
  <p class="prose">Optional. Keep your app on GitHub Pages and store personal notes separately in a <strong>private</strong> repository.
  GitHub Pages hosting alone cannot write files. This feature uses GitHub's authenticated Contents API when you press Sync.
  Your token is held only for this tab session and is never written to the repository or localStorage.</p>
  <label class="modal-note" for="ghowner">Repository owner / username</label>
  <input id="ghowner" class="github-input" autocomplete="off" value="${esc(cfg.owner||'')}" placeholder="your-github-username">
  <label class="modal-note" for="ghrepo">Private repository name</label>
  <input id="ghrepo" class="github-input" autocomplete="off" value="${esc(cfg.repo||'')}" placeholder="design-atlas-private-data">
  <label class="modal-note" for="ghpath">Progress file path</label>
  <input id="ghpath" class="github-input" autocomplete="off" value="${esc(cfg.path||'progress.json')}" placeholder="progress.json">
  <label class="modal-note" for="ghtoken">Fine-grained GitHub token (Contents: Read and write, scoped to the private data repo)</label>
  <input type="password" id="ghtoken" class="github-input" autocomplete="off" spellcheck="false" placeholder="Enter each new browser session">
  <div class="sync-grid">
    <button class="button" onclick="githubSync('push')">↑ Save progress to GitHub</button>
    <button class="button secondary" onclick="githubSync('pull')">↓ Restore progress from GitHub</button>
  </div>
  <p id="ghstatus" class="github-status" role="status" aria-live="polite">Not connected. Save a local JSON backup before your first sync.</p>
  <div class="blocknote"><strong>Important:</strong> Restoring replaces this browser's study data after confirmation.
  If two devices edit the same notes, save one device before restoring the other; changes are not merged automatically.
  Do not use a token on public/shared computers. Repository JSON does not belong in the public Pages site.</div>`;
}
function ghStatus(msg){const el=document.getElementById('ghstatus');if(el)el.textContent=msg}
function base64utf8(s){const bytes=new TextEncoder().encode(s);let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);return btoa(binary)}
function decodebase64utf8(s){let raw=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0)))}
async function githubSync(action){
 const owner=document.getElementById('ghowner').value.trim(),repo=document.getElementById('ghrepo').value.trim(),path=document.getElementById('ghpath').value.trim(),token=document.getElementById('ghtoken').value.trim();
 if(!/^[a-z\d](?:[a-z\d-]{0,38})$/i.test(owner)||!/^[\w.-]+$/.test(repo)||!path||path.includes('..')||path.startsWith('/')||!token){ghStatus('Check owner, repository, file path and token.');return}
 localStorage.setItem('atlas-gh-config',JSON.stringify({owner,repo,path}));
 const url='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
 const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};
 ghStatus('Contacting GitHub…');
 try {
  const read=await fetch(url,{headers,cache:'no-store'});
  if(!read.ok&&read.status!==404)throw Error('GitHub returned '+read.status+'. Check repository access and token permissions.');
  const existing=read.ok?await read.json():null;
  if(action==='pull'){
   if(!existing||!existing.content)throw Error('No progress.json found in the private repository.');
   const payload=JSON.parse(decodebase64utf8(existing.content));
   if(!payload.state||typeof payload.state!=='object'||!payload.state.drafts||!payload.state.completed)throw Error('GitHub file is not a valid Design Atlas backup.');
   if(!confirm('Replace this browser\'s notes, essays, grades, and progress with the GitHub version? Export a backup first if unsure.')){ghStatus('Restore cancelled.');return}
   state=payload.state;state.completed??={};state.quizzes??={};state.drafts??={};state.assignments??={};state.notes??={};state.marks??={};state.reading??={};save();navigate('dashboard');toast('Restored from private GitHub repository');return;
  }
  if(!confirm("Save this browser's current study progress to your private GitHub repository? This replaces its previous progress.json version.")){ghStatus('Save cancelled.');return}
  const payload={version:1,exported:new Date().toISOString(),state};
  const body={message:'Update Design Atlas study progress',content:base64utf8(JSON.stringify(payload,null,2))};
  if(existing?.sha)body.sha=existing.sha;
  const result=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!result.ok)throw Error('Save failed ('+result.status+'). '+(result.status===409?'File changed elsewhere; restore or resolve the conflict before retrying.':'Check token permissions.'));
  ghStatus('Saved to private GitHub repository at '+new Date().toLocaleString()+'.');
 }catch(e){ghStatus(e.message||'GitHub sync failed.');}
}

function toast(t){let old=$('.toast');if(old)old.remove();let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),2700)}
function exportText(name,body){let url=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportDraft(id){let a=CURRICULUM.flatMap(w=>w.assignments).find(a=>a.id===id);exportText(id+'-'+a.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.txt',`${a.title}\n\n${state.drafts[id]||''}`)}
function copyDraft(id){navigator.clipboard?.writeText(state.drafts[id]||'').then(()=>toast('Draft copied')).catch(()=>toast('Clipboard unavailable'))}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),state},null,2)],{type:'application/json'}));a.href=u;a.download='design-atlas-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function restoreBackup(e){let file=e.target.files[0];if(!file)return;file.text().then(t=>{try{let data=JSON.parse(t),v=data.state;if(!v||typeof v!=='object'||!v.drafts||!v.completed)throw Error();if(!confirm('Replace current local study data with this backup?'))return;state=v;save();navigate('dashboard');toast('Backup restored')}catch{toast('Invalid backup file')}})}
function render(){let fn={dashboard,roadmap,week,lesson,quiz,assignments,write,resources,settings}[view];shell(fn());if(view==='lesson'){$('#lessonnotes').addEventListener('input',e=>{let id=CURRICULUM[weekIdx].lessons[lessonIdx].id;state.notes[id]=e.target.value;save();$('#notecount').textContent=wordCount(e.target.value)+' words'})}if(view==='write'){$('#draft').addEventListener('input',e=>{let id=CURRICULUM[weekIdx].assignments[lessonIdx].id;state.drafts[id]=e.target.value;save();$('#draftcount').textContent=wordCount(e.target.value)+' words · suggested '+CURRICULUM[weekIdx].assignments[lessonIdx].length})}if(view==='assignments'){$('#searchAssignments').addEventListener('input',e=>{query=e.target.value;$('#assignmentList').innerHTML=assignmentCards(query)})}if(view==='quiz'){$('#quizForm').addEventListener('submit',e=>{e.preventDefault();let w=CURRICULUM[weekIdx],answers={},score=0;for(let i=0;i<w.quiz.length;i++){let el=e.target.querySelector(`input[name=q${i}]:checked`);if(!el){toast('Answer every question');return}answers[i]=Number(el.value);if(answers[i]===w.quiz[i].answer)score++}state.quizzes[w.id]={answers,score,date:new Date().toISOString()};save();render();toast(`Score: ${score}/${w.quiz.length}`)})}}
render();
</script></body></html>
