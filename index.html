function library(){const list=bundle.course.references;return `<div class="eyebrow">Books, papers, videos</div><h1>Study library</h1><p class="prose">Start with the free sources, then go deeper. The four research PDFs you provided are included in the ZIP. Required reading links also appear inside each specific lesson.</p><div class="grid two section">${list.map(r=>`<div class="card"><span class="tag">${esc(r.category)}</span><h3 style="margin:13px 0">${esc(r.title)}</h3><a href="${esc(r.url)}" target="_blank" rel="noopener">Open source ↗</a></div>`).join('')}</div><h2 class="section">Your bundled research papers</h2><div class="card">${[['Movie narratives · Sharma & Rajamanickam','papers/movie-narratives.pdf'],['Election data · Gupta, Sampat, Sharma & Rajamanickam','papers/election-visualisation.pdf'],['Learning analytics · Kulkarni & Rajamanickam','papers/learning-analytics.pdf'],['Research design · Drummond chapter 6','papers/drummond-research-designs.pdf']].map(([name,url])=>`<div class="itemlink"><strong>${esc(name)}</strong><a class="button ghost" href="${url}" target="_blank">Open PDF ↗</a></div>`).join('')}</div><div class="callout amber section"><strong>About quotations</strong><p>The learning explanations on this site are original paraphrases. Only short, attributed quotations are included from your uploaded PDFs. For copyrighted books, the site links to legitimate access points rather than reproducing large passages.</p></div>`}

function essayguide(){
const tab=window.essayTab||'structure';
const tabs=[['structure','Structure'],['paragraphs','Argument'],['samples','Samples'],['review','Revision'],['sources','Reading examples']];
const steps=[
 ['Frame an arguable question','Turn a broad subject into a claim you could support or challenge. Example: How might mandatory workflow fields affect efficiency and agency for field investigators?'],
 ['Write a defensible thesis','State a clear position plus a qualification. Do not write only that usability is important.'],
 ['Define important terms','Introduce concepts from your reading and distinguish closely related ideas before applying them.'],
 ['Build evidence-led paragraphs','Use a claim, a specific example or cited finding, an explanation of how it supports the claim, and a connection to your thesis.'],
 ['Consider another explanation','Discuss selection bias, business constraints, accessibility, privacy, unintended outcomes or competing interpretations.'],
 ['Conclude proportionately','Answer the question, describe implications, and acknowledge what the available evidence cannot establish.']
];
const sources=[
 ['Interaction Design Foundation','How to write the beginning of a UX case study','https://assets.interaction-design.org/literature/article/how-to-write-the-beginning-of-your-ux-case-study','A practical model for setting out the problem, approach and role. Portfolio-oriented, not a substitute for an academic essay.'],
 ['Interaction Design Foundation','How to write the middle / process of a case study','https://assets.interaction-design.org/literature/article/how-to-write-the-middle-or-process-part-of-your-case-study','Read how design actions and decisions are supported by reasons and evidence.'],
 ['Nielsen Norman Group','UX Writing Study Guide','https://www.nngroup.com/articles/ux-writing-study-guide/','Useful principles for clarity and readability; this is interface writing, not academic essay instruction.'],
 ['Open-access research paper','Election Data Visualisation: Gupta et al. (2016)','papers/election-visualisation.pdf','Study the introduction, research process, methods, design choices, results and limitations. Academic research article example.'],
 ['Open-access research paper','Learning Analytics in Resource-Constrained Schools','papers/learning-analytics.pdf','Study how contextual inquiry and observed constraints lead to a defensible system proposal.'],
 ['Open-access research paper','Non-linear Movie Narratives: Sharma & Rajamanickam','papers/movie-narratives.pdf','Study the argument from literature review to implementation, with visual explanation.'],
 ['Research writing resource','Purdue OWL: Argumentative Essays','https://owl.purdue.edu/owl/general_writing/academic_writing/essay_writing/argumentative_essays.html','Claim-evidence-reasoning, counterarguments, and academic essay conventions.'],
 ['Citation resource','Purdue OWL: APA Formatting and Style Guide','https://owl.purdue.edu/owl/research_and_citation/apa_style/apa_style_introduction.html','Crediting sources, in-text citations, and references. Follow your course citation guidelines when provided.']
];
const content={
structure:`<div class="card"><h2>The academic UX essay</h2><p class="prose">Unlike a portfolio case study, an academic essay makes a <strong>defensible argument</strong> about a design question. It explains concepts, weighs evidence, acknowledges competing perspectives and reaches a proportionate conclusion. A case study instead documents a particular problem, decisions, interventions and outcomes. They overlap in evidence-led reasoning, but their purposes differ.</p><div class="guide-step"><div class="guide-n">1</div><div><h3>Introduction · 10–15%</h3><p>Set the context, define the problem and write one thesis sentence indicating your position.</p></div></div><div class="guide-step"><div class="guide-n">2</div><div><h3>Concepts and evidence · 20–25%</h3><p>Explain relevant theory and introduce empirical sources, including any methodological limitations.</p></div></div><div class="guide-step"><div class="guide-n">3</div><div><h3>Analysis and counterargument · 45–55%</h3><p>Apply the concepts to a concrete interaction, compare alternatives and evaluate competing explanations.</p></div></div><div class="guide-step"><div class="guide-n">4</div><div><h3>Conclusion and references · 10–15%</h3><p>Answer the question, identify implications and cite all non-original claims. These percentages are a planning aid, not a faculty marking scheme.</p></div></div></div><div class="grid two section"><div class="callout"><strong>Research report</strong><p>Question → method → sample → measures → results → interpretation → limitations.</p></div><div class="callout mint"><strong>Portfolio case study</strong><p>Problem → role → constraints → evidence → design decisions → testing → outcomes.</p></div></div>`,
paragraphs:`<div class="card"><h2>Six moves that strengthen an essay</h2><div class="stack">${steps.map((x,i)=>`<div class="guide-step"><div class="guide-n">${i+1}</div><div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div></div>`).join('')}</div></div><section class="section"><h2>Build a stronger paragraph</h2><div class="essay-compare"><div><span class="tag">WEAK</span><p>“Dashboards are important in UX. They show lots of data and help users do their work quickly. Therefore the dashboard should be simple.”</p><p class="tiny">This asserts a benefit without specifying who, what data, the task or any evidence.</p></div><div><span class="tag mint">STRONGER</span><p>“For investigation managers, a case dashboard serves a monitoring task rather than an exploratory task. If overdue cases are visually indistinguishable from cases on schedule, the interface may increase the effort required to identify urgent work. This is a design hypothesis, not a measured result: testing should compare detection time and errors under alternative visual encodings.”</p><p class="tiny">This defines the user and task, argues a mechanism, and separates inference from evidence.</p></div></div></section><div class="callout amber section"><strong>Writing formula</strong><p style="margin:7px 0 0">Claim → evidence or concrete observation → reasoning → alternative explanation → implication. Not every paragraph needs all five, but substantive claims should never float without support.</p></div>`,
samples:`<div class="card"><h2>Three original annotated writing samples</h2><p>These are illustrative paragraphs written specifically for your preparation, not quotations from published papers or claims about actual studies.</p><div class="section"><span class="tag">SAMPLE 1 · THEORETICAL ESSAY</span><h3>Can a workflow interface exercise power?</h3><div class="essay-example"><p><span class="annotation">THESIS</span> A required-field investigation workflow may appear to be a neutral method of improving data quality, yet its structure also determines which forms of evidence are treated as legitimate. <span class="annotation">CONCEPT</span> Drawing on Foucault's account of disciplinary mechanisms, we can analyse the interface as a system that records and standardises conduct, not merely a sequence of screens. <span class="annotation">APPLICATION</span> For instance, requiring a location photograph before progressing may discourage incomplete submissions, but it can also make exceptions difficult to document when photographing a location is unsafe or inappropriate. <span class="annotation">QUALIFICATION</span> This does not mean mandatory fields are inherently oppressive; they may be necessary for compliance or auditability. Rather, the design question is whether governance can coexist with contextual judgement. <span class="annotation">IMPLICATION</span> A stronger interface would make exceptions explicit and reviewable instead of treating all departures from the standard path as errors.</p></div><p class="tiny">How to improve it for an assessed essay: cite Foucault accurately, identify specific observed workflows, provide evidence about actual users, and distinguish the theory from your application.</p></div><div class="section"><span class="tag">SAMPLE 2 · QUANTITATIVE RESEARCH MEMO</span><h3>Testing a case-assignment redesign</h3><div class="essay-example"><p><span class="annotation">QUESTION</span> Does showing a case's age and deadline in the assignment list improve supervisors' ability to prioritise overdue investigations? <span class="annotation">METHOD</span> A within-participant comparison could ask each supervisor to complete equivalent prioritisation tasks using a current and redesigned interface, with the order counterbalanced. <span class="annotation">MEASURES</span> Completion time and prioritisation accuracy provide complementary ratio-based measures, while a post-task ease rating offers ordinal feedback. <span class="annotation">LIMITATION</span> Reusing participants introduces learning and carryover effects, while an internal sample may limit generalisability. <span class="annotation">INTERPRETATION</span> Faster average performance alone would not establish a better design if error rates increased. Results should report uncertainty and consider practical rather than only statistical significance.</p></div></div><div class="section"><span class="tag">SAMPLE 3 · DATA VISUALISATION CRITIQUE</span><h3>Why chart choice is a reasoning decision</h3><div class="essay-example"><p><span class="annotation">CLAIM</span> A stacked bar chart can summarise the composition of completed investigations by agency, but it makes comparisons between internal categories difficult when those categories lack a common baseline. <span class="annotation">ALTERNATIVE</span> If the audience's primary question concerns which agency has the largest overdue backlog, a sorted bar chart of overdue counts may be more legible. <span class="annotation">TRADE-OFF</span> The redesign loses the overall composition of status categories, so that information may need a secondary view. <span class="annotation">TEST</span> A useful evaluation would ask managers to identify the agency with the largest overdue backlog and compare response accuracy and time across both encodings.</p></div></div></div>`,
review:`<div class="grid two"><div class="card"><h2>Before you submit</h2><div class="stack">${['My question is clear and answerable','My introduction makes an arguable thesis','I defined unfamiliar or contested concepts','Every substantial claim has evidence or is labelled as inference','I explain the link between evidence and conclusion','I address at least one credible alternative view','I state limits of my evidence and method','I distinguish correlation from causation','My citations support the actual claim made','My conclusion answers the original question'].map((x,i)=>`<label class="check"><input type="checkbox" data-guidecheck="${i}" ${state.bookmarks?.['essay-check-'+i]?'checked':''}>${esc(x)}</label>`).join('')}</div></div><div class="card"><h2>Use the evaluator rubric</h2><p>The site's existing 100-point assessment has five dimensions. Try self-review first and record the reasoning, then ask a mentor for an independent mark when possible.</p><div class="guide-step"><div class="guide-n">20</div><div><h3>Thesis</h3><p>A precise question, position, scope and relevance.</p></div></div><div class="guide-step"><div class="guide-n">25</div><div><h3>Concepts / method</h3><p>Correct terminology and justified research or analytical method.</p></div></div><div class="guide-step"><div class="guide-n">25</div><div><h3>Evidence</h3><p>Grounded examples, appropriate sources and sound reasoning.</p></div></div><div class="guide-step"><div class="guide-n">20</div><div><h3>Reflection</h3><p>Counterarguments, limitations, trade-offs and uncertainty.</p></div></div><div class="guide-step"><div class="guide-n">10</div><div><h3>Communication</h3><p>Structure, language and citations.</p></div></div></div></div>`,
sources:`<div class="card"><h2>Essays, case studies and research papers worth reading</h2><p>These resources serve different purposes. Use research papers as models for scholarly argument, and case-study guides for clear storytelling. They are not all academic essays.</p>${sources.map(x=>`<div class="guide-resource"><div><span class="tag">${esc(x[0])}</span><h3 style="margin:9px 0 4px">${esc(x[1])}</h3><p style="font-size:13px;margin:0">${esc(x[3])}</p></div><a class="button ghost" href="${esc(x[2])}" target="_blank" rel="noopener noreferrer">Read source ↗</a></div>`).join('')}</div>`
};
return `<div class="eyebrow">Academic writing / 9-week preparation</div><h1>Write arguments, not just descriptions.</h1><p class="prose">A practical guide to composing stronger UX essays, methods reports and design critiques. Includes original annotated samples, an editable outline, independent reading and a revision checklist.</p><div class="guide-tabs">${tabs.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="setEssayTab('${x[0]}')">${x[1]}</button>`).join('')}</div>${content[tab]}<section class="section card"><h2>Your essay outline notebook</h2><p class="tiny">Use this for your next assignment. Your notes are autosaved and included in the exported content.json.</p>${noteArea('notes:essay-outline',state.lessonNotes['essay-outline'],'Question:\nThesis:\nConcepts and definitions:\nEvidence / readings:\nCounterargument:\nConclusion:\nSources:','long')}<div class="buttons"><button class="button secondary" onclick="go('assignments')">Go to writing assignments →</button></div></section>`;
}
function setEssayTab(tab){window.essayTab=tab;draw()}

function assignments(){return `<div class="eyebrow">Independent academic practice</div><h1>Writing studio</h1><div class="callout mint"><strong>New: writing stronger UX essays</strong><p style="margin:7px 0 11px">Learn the academic essay structure, evidence-led paragraphs, research-method critiques, and the difference from a portfolio case study. Includes original samples and published reading references.</p><button class="button secondary" onclick="go('essayguide')">Open essay writing guide →</button></div><p class="prose">Eighteen assignments designed to practise evidence-led arguments, research memos, essays, chart critiques and reflective writing. Your drafts autosave and your marks can be entered with a transparent 100-point rubric.</p><div class="grid two section">${bundle.course.weeks.flatMap(w=>w.assignments.map(a=>assignmentTile(a,w.id))).join('')}</div>`}
function assignment(){const w=wby(route.week);const a=w?.assignments.find(x=>x.id===route.lesson);if(!a)return 'Assignment not found';const current=state.assignmentScores[a.id]||{};let total=a.rubric.reduce((s,[label,max],i)=>s+(Number(current[i])||0),0);return `<div class="eyebrow">Week ${w.id} / Assignment ${esc(a.id)}</div><h1>${esc(a.title)}</h1><div class="buttons"><span class="pill">Target: ${esc(a.length)}</span><button class="button ghost" onclick="go('week',${w.id})">← Week overview</button></div><div style="margin:16px 0 0"><button class="button ghost" onclick="go('essayguide')">Writing guide and sample essays ↗</button></div><section class="section card"><h2>Your brief</h2><p>${esc(a.prompt)}</p><div class="callout"><strong>Submission checklist</strong><p style="margin:5px 0 0">${esc(a.criteria)}. Cite your source readings, distinguish observations from interpretations and identify limitations.</p></div></section><section class="section"><h2>Write your response</h2>${noteArea('essay:'+a.id,state.assignmentDrafts[a.id],'Write your essay or research memo here…\n\nIntroduction\nEvidence and analysis\nCounterargument or limitations\nConclusion\nReferences','long')}</section><section class="section card"><div class="row"><h2 style="margin-bottom:0">Evaluator rubric</h2><span class="pill">${total} / 100</span></div><p style="font-size:13px">Enter marks manually after reviewing your work, or use scores provided by a tutor. The site does not pretend to automatically grade essay quality.</p>${a.rubric.map(([label,max],i)=>`<label class="rubric"><span>${esc(label)} <small>(max ${max})</small></span><input type="number" inputmode="numeric" min="0" max="${max}" step="1" data-score="${a.id}:${i}" value="${esc(current[i]??'')}"></label>`).join('')}<div class="muted-line"></div><h3>Evaluator feedback</h3>${noteArea('feedback:'+a.id,current.feedback,'What was strong? What needs evidence or revision?')}<button class="button ghost" onclick="exportDraft('${a.id}')" style="margin-top:13px">Download this assignment as .txt ↓</button></section>`}
function quiz(){const w=wby(route.week);return `<div class="eyebrow">Week ${w.id} / Knowledge check</div><h1>${esc(w.title)}</h1><div class="card"><h2>Ready to test your understanding?</h2><p>An eight-question quiz will be selected randomly from ${w.quizBank.length} questions. Answer order changes on every attempt. Results and explanations appear after submission.</p><button class="button" onclick="startQuiz(${w.id})">Begin randomised quiz →</button></div>`}
function quizzes(){return `<div class="eyebrow">Retrieval and application</div><h1>Knowledge checks</h1><p class="prose">Each week has a question bank covering its core concepts. Each attempt selects up to eight questions and shuffles the answer options. You get explanations after submitting, not while choosing.</p><div class="grid two section">${bundle.course.weeks.map(w=>`<div class="card"><span class="tag">WEEK ${w.id} · ${w.quizBank.length} items in bank</span><h3 style="margin-top:12px">${esc(w.title)}</h3><p>${(state.quizHistory[w.id]||[]).length} attempts · Best ${Math.max(0,...(state.quizHistory[w.id]||[]).map(q=>q.pct))}%</p><button class="button secondary" onclick="go('quiz',${w.id})">Start random quiz →</button></div>`).join('')}</div>`}
function shuffle(arr){const x=[...arr];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function startQuiz(wid){const bank=wby(wid).quizBank;quizSession={week:wid,questions:shuffle(bank).slice(0,Math.min(8,bank.length)).map(q=>{let options=q.options.map((label,i)=>({label,correct:i===q.answer}));return {...q,options:shuffle(options)}}),answers:{},submitted:false};renderQuiz()}
function renderQuiz(){let s=quizSession;let w=wby(s.week);$('view').innerHTML=`<div class="eyebrow">Week ${w.id} / Randomised quiz</div><h1>${esc(w.title)}</h1><div class="row"><span class="pill">${s.questions.length} questions · new mix each time</span><button class="button ghost" onclick="go('quizzes')">← All quizzes</button></div><div class="section">${s.questions.map((q,i)=>`<div class="question"><small>QUESTION ${i+1}</small><h3>${esc(q.q)}</h3><div class="choices">${q.options.map((o,j)=>{const selected=s.answers[i]===j;const cls=s.submitted?(o.correct?'good':selected?'bad':''):(selected?'selected':'');return `<button class="choice ${cls}" ${s.submitted?'disabled':''} onclick="choose(${i},${j})">${String.fromCharCode(65+j)} · ${esc(o.label)}</button>`}).join('')}</div>${s.submitted?`<p class="feedback">${q.options[s.answers[i]]?.correct?'✓ Correct':'✕ Not quite'}. ${esc(q.why)}</p>`:''}</div>`).join('')}</div>${s.submitted?`<div class="card"><div class="score-big">${s.questions.filter((q,i)=>q.options[s.answers[i]]?.correct).length}/${s.questions.length}</div><p>Attempt saved. Review the explanations, then try another randomised selection.</p><div class="buttons"><button class="button" onclick="startQuiz(${w.id})">New random attempt ↻</button><button class="button secondary" onclick="go('week',${w.id})">Back to lessons →</button></div></div>`:`<div class="buttons"><button class="button" onclick="submitQuiz()" ${Object.keys(s.answers).length!==s.questions.length?'disabled':''}>Submit and score my answers</button><button class="button ghost" onclick="startQuiz(${w.id})">Reshuffle questions</button></div>`}`}
function choose(i,j){if(!quizSession.submitted){quizSession.answers[i]=j;renderQuiz()}}
function submitQuiz(){const s=quizSession;if(Object.keys(s.answers).length!==s.questions.length)return;const score=s.questions.filter((q,i)=>q.options[s.answers[i]]?.correct).length;const pct=Math.round(100*score/s.questions.length);(state.quizHistory[s.week]??=[]).push({at:new Date().toISOString(),score,total:s.questions.length,pct});persist();s.submitted=true;renderQuiz();notify('Saved quiz attempt: '+pct+'%')}
function data(){let total=JSON.stringify(state).length;return `<div class="eyebrow">Storage, backups and GitHub</div><h1>Your data, portable.</h1><p class="prose">Everything you write is kept in browser local storage. Export a single <code>content.json</code> containing the complete course and your personal notes, reading progress, essays, quiz history and scores. Replace the old file in the GitHub repo to publish that snapshot.</p><div class="grid two section"><div class="card"><h2>Export full content.json</h2><p>One file containing both learning content and your saved study work. Current browser record: about ${(total/1024).toFixed(1)} KB.</p><button class="button" onclick="exportContent()">Download content.json ↓</button></div><div class="card"><h2>Import content.json</h2><p>Restore a previously exported file. Importing replaces all data currently in this browser after a confirmation.</p><label class="button secondary" for="import-file">Choose content.json ↑</label><input class="file" id="import-file" type="file" accept=".json,application/json" onchange="importContent(event)"></div></div><section class="section card"><h2>How to update your GitHub Pages repo</h2><p><strong>Step 1:</strong> Download content.json here.</p><p><strong>Step 2:</strong> In your GitHub repository, open the existing <code>content.json</code>, choose <em>Upload files</em> to replace it, and commit the change (or replace via Git).</p><p><strong>Step 3:</strong> Refresh the live site on your other device. The site reads the repo’s content.json when hosted on HTTP(S), and uses whichever copy has the more recent <code>updatedAt</code> value.</p><div class="callout amber"><strong>Privacy and sync limitation</strong><p>On a public Pages repository, content.json is public, including exported essays and notes. Use a private Pages repo only if your plan supports private access and you understand Pages visibility; otherwise avoid committing personal notes to public source. This workflow requires a manual GitHub commit. Local HTML mode uses the built-in course and imported browser data, since browsers commonly block fetching local JSON files.</p></div></section><section class="section card"><h2>Save your work reliably</h2><p>Browser autosave works independently of GitHub. Closing the tab or restarting does not ordinarily remove localStorage. Clearing site data, private browsing, and different origins can lose it. Export periodically. If two devices edit independently, the file replaces one snapshot rather than merging two sets of changes.</p><div class="buttons"><button class="button ghost" onclick="downloadJSON(state,'progress-only-backup.json')">Download progress-only backup</button><button class="button danger" onclick="resetProgress()">Clear this browser's progress</button></div></section>`}
function downloadJSON(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportContent(){downloadJSON({...bundle,progress:state},'content.json');notify('content.json exported')}
function exportDraft(id){const txt=state.assignmentDrafts[id]||'';const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='assignment-'+id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importContent(ev){const file=ev.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.schemaVersion!==2||!Array.isArray(obj.course?.weeks)||obj.course.weeks.length!==9||!obj.progress||typeof obj.progress!=='object')throw Error('Not a valid Design Atlas content.json');if(!confirm('Replace the current course and all local progress with this file? Export a backup first if you need the existing notes.'))return;bundle=obj;state=obj.progress;persist();go('home');notify('Imported content.json successfully')}catch(e){alert('Import failed: '+e.message)}ev.target.value=''}
function resetProgress(){if(!confirm('Delete all browser notes, essays, scores and progress? Export a backup first.'))return;state=structuredClone(EMBEDDED.progress);localStorage.removeItem(KEY);go('home');notify('Local progress cleared')}
// Use event delegation so rerenders never lose autosave handling.
document.addEventListener('input',e=>{let el=e.target;const key=el.dataset.save;if(key){const [kind,id]=key.split(':');if(kind==='notes')state.lessonNotes[id]=el.value;else if(kind==='practice')state.practiceAnswers[id]=el.value;else if(kind==='essay')state.assignmentDrafts[id]=el.value;else if(kind==='feedback'){(state.assignmentScores[id]??={}).feedback=el.value}persist();const counter=$('words-'+key);if(counter)counter.textContent=words(el.value)+' words · autosaved';}const code=el.dataset.score;if(code){const [id,ix]=code.split(':');const a=bundle.course.weeks.flatMap(w=>w.assignments).find(a=>a.id===id);const limit=a?.rubric[Number(ix)]?.[1]||0;const val=el.value===''?'':Math.max(0,Math.min(limit,Number(el.value)||0));(state.assignmentScores[id]??={})[ix]=val;persist();const focused=document.activeElement;const s=focused?.selectionStart;const ePos=focused?.selectionEnd;draw();const replacement=document.querySelector(`[data-score="${code}"]`);replacement?.focus();try{replacement?.setSelectionRange(s,ePos)}catch{}}});
document.addEventListener('change',e=>{if(e.target.dataset.guidecheck!==undefined){state.bookmarks=state.bookmarks||{};state.bookmarks['essay-check-'+e.target.dataset.guidecheck]=e.target.checked;persist()}if(e.target.dataset.complete){state.completedLessons[e.target.dataset.complete]=e.target.checked;persist();notify('Lesson progress saved')}if(e.target.dataset.read){state.completedReadings[e.target.dataset.read]=e.target.checked;persist();notify('Reading progress saved')}});
window.addEventListener('hashchange',()=>{const parts=location.hash.slice(1).split('/');if(parts[0]&&parts[0]!==route.page){route.page=parts[0];route.week=Number(parts[1])||1;route.lesson=parts[2]||'1.1';draw()}});
try{let parts=location.hash.slice(1).split('/');if(parts[0]){route.page=parts[0];route.week=Number(parts[1])||1;route.lesson=parts[2]||'1.1'}}catch{}
boot();
