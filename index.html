trol group", "meaning": "A control or comparison group provides a reference outcome against which to evaluate an intervention. It may use the existing design, an alternative design or no treatment, depending on the research question. The comparison must be sufficiently similar in circumstances to support interpretation."}, {"term": "Treatment", "meaning": "Treatment means manipulated interface or procedure. In this lesson, it helps you examine the question: Explain why random assignment helps isolate an effect. For example, consider this UX research situation: Plan an A/B study of navigation. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Random sampling versus random assignment: the first affects representativeness; the second supports causal inference within the study."}, {"term": "Blinding", "meaning": "Blinding means keeping relevant group information hidden where feasible to reduce bias. In this lesson, it helps you examine the question: Explain why random assignment helps isolate an effect. For example, consider this UX research situation: Plan an A/B study of navigation. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Random sampling versus random assignment: the first affects representativeness; the second supports causal inference within the study."}], "explanation": "In an experiment, deliberately vary one relevant factor and hold other conditions sufficiently comparable. Random assignment reduces systematic group differences on average; it does not guarantee perfectly balanced small samples. Keep a clear task, standardised instructions and preregistered outcome definitions.", "workedExample": "Randomly show 40 recruits either old or new claim form; compare omission rates after the same task. If the new form receives more experienced recruits, allocation may have failed or sampling is small.", "comparison": "Random sampling versus random assignment: the first affects representativeness; the second supports causal inference within the study.", "pitfall": "Changing button language, layout and case difficulty together and attributing effects to only the button.", "practice": "Design a randomised comparison with clear assignment, outcome, control and an ethical stopping rule.", "selfCheck": "Good protocol holds task conditions comparable and records deviations.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Experimental+logic+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "4.2", "title": "Quasi-experiments", "concepts": "Nonrandom comparison groups and interrupted time series", "goal": "Spot threats when real-world assignment is constrained.", "example": "Compare a feature rollout across teams.", "readings": [{"title": "OpenIntro Statistics", "focus": "Inference, confidence intervals, sampling", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Yale ENGL 300, Lecture 8", "focus": "Structuralism and semiotics", "url": "https://oyc.yale.edu/english/engl-300/lecture-8", "access": "Free online"}], "studySteps": ["Define the central ideas: Nonrandom comparison groups and interrupted time series.", "Use the UX scenario: Compare a feature rollout across teams.", "Test your understanding: explain how the idea supports this objective: Spot threats when real-world assignment is constrained.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Nonequivalent control group", "meaning": "Nonequivalent control group means comparison group selected without random allocation. In this lesson, it helps you examine the question: Spot threats when real-world assignment is constrained. For example, consider this UX research situation: Compare a feature rollout across teams. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Quasi-experiment versus simple before/after: multiple pre- and post-points and credible comparison groups strengthen inference."}, {"term": "Interrupted time series", "meaning": "Interrupted time series means repeated observations before and after an intervention. In this lesson, it helps you examine the question: Spot threats when real-world assignment is constrained. For example, consider this UX research situation: Compare a feature rollout across teams. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Quasi-experiment versus simple before/after: multiple pre- and post-points and credible comparison groups strengthen inference."}, {"term": "Secular trend", "meaning": "Secular trend means background change occurring over time. In this lesson, it helps you examine the question: Spot threats when real-world assignment is constrained. For example, consider this UX research situation: Compare a feature rollout across teams. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Quasi-experiment versus simple before/after: multiple pre- and post-points and credible comparison groups strengthen inference."}, {"term": "Maturation", "meaning": "Maturation means changes that occur independent of intervention. In this lesson, it helps you examine the question: Spot threats when real-world assignment is constrained. For example, consider this UX research situation: Compare a feature rollout across teams. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Quasi-experiment versus simple before/after: multiple pre- and post-points and credible comparison groups strengthen inference."}], "explanation": "When randomisation is impossible, collect enough information to examine other explanations. Time-series studies can detect abrupt level or slope changes, but a product launch may coincide with seasonality, new staffing or policy changes. Compare baselines and plan sensitivity checks.", "workedExample": "An organisation deploys a dashboard to Region A in June and leaves Region B unchanged. If Region A already had lower turnaround time, a post-launch difference is not sufficient evidence of impact.", "comparison": "Quasi-experiment versus simple before/after: multiple pre- and post-points and credible comparison groups strengthen inference.", "pitfall": "Ignoring policy changes or varying case volumes that coincide with rollout.", "practice": "Sketch a time-series analysis of SLA breaches around a dashboard launch, naming two rival explanations.", "selfCheck": "Include enough pre- and post-periods and note volume mix, staffing and concurrent process changes.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Quasi-experiments+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "4.3", "title": "Sampling uncertainty", "concepts": "Confidence intervals, standard error and interpretation", "goal": "Explain uncertainty without claiming a probability about a fixed parameter.", "example": "Interpret a conversion-rate interval.", "readings": [{"title": "OpenIntro Statistics", "focus": "Inference, confidence intervals, sampling", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Yale ENGL 300, Lecture 8", "focus": "Structuralism and semiotics", "url": "https://oyc.yale.edu/english/engl-300/lecture-8", "access": "Free online"}], "studySteps": ["Define the central ideas: Confidence intervals, standard error and interpretation.", "Use the UX scenario: Interpret a conversion-rate interval.", "Test your understanding: explain how the idea supports this objective: Explain uncertainty without claiming a probability about a fixed parameter.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Sampling distribution", "meaning": "Sampling distribution means distribution of a statistic across hypothetical repeated samples. In this lesson, it helps you examine the question: Explain uncertainty without claiming a probability about a fixed parameter. For example, consider this UX research situation: Interpret a conversion-rate interval. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Standard deviation versus standard error: SD describes individual variability; SE describes precision of an estimated statistic."}, {"term": "Standard error", "meaning": "Standard error means estimated variability of a statistic across samples. In this lesson, it helps you examine the question: Explain uncertainty without claiming a probability about a fixed parameter. For example, consider this UX research situation: Interpret a conversion-rate interval. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Standard deviation versus standard error: SD describes individual variability; SE describes precision of an estimated statistic."}, {"term": "Confidence interval", "meaning": "A confidence interval is produced by a method that, over many hypothetical repeated samples under its assumptions, captures the fixed population parameter at a stated rate (often 95%). It describes uncertainty in estimation, not a 95% probability that this one realised interval contains the parameter. Width depends on variation, sample size and method."}, {"term": "Margin of error", "meaning": "Margin of error means approximate uncertainty extent under specified assumptions. In this lesson, it helps you examine the question: Explain uncertainty without claiming a probability about a fixed parameter. For example, consider this UX research situation: Interpret a conversion-rate interval. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Standard deviation versus standard error: SD describes individual variability; SE describes precision of an estimated statistic."}], "explanation": "An estimate is not exact. A 95% confidence interval means that the procedure would cover the fixed population parameter in about 95% of repeated studies under its assumptions; it is not a 95% probability assigned to this particular fixed parameter in the frequentist framework. Larger representative samples often narrow intervals, though design and variability matter.", "workedExample": "A sample estimates 72% of users completed onboarding, with a 95% interval of 65–79%. That suggests uncertainty in the population completion rate, not that 72% is guaranteed.", "comparison": "Standard deviation versus standard error: SD describes individual variability; SE describes precision of an estimated statistic.", "pitfall": "Reading a confidence interval as the range containing 95% of individual users.", "practice": "Explain what 65–79% means without saying there is a 95% chance the fixed parameter lies inside.", "selfCheck": "Repeated-study coverage is the intended interpretation under assumptions.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [{"title": "Confidence Intervals, Clearly Explained", "creator": "StatQuest with Josh Starmer", "id": "TqOeMYtOc1w"}], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Sampling+uncertainty+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "4.4", "title": "Structuralism primer", "concepts": "Saussure, signifier/signified and systems of difference", "goal": "Analyse how interface categories get their meaning.", "example": "Labels: approved, pending and rejected.", "readings": [{"title": "OpenIntro Statistics", "focus": "Inference, confidence intervals, sampling", "url": "https://www.openintro.org/book/os/", "access": "Free online"}, {"title": "Yale ENGL 300, Lecture 8", "focus": "Structuralism and semiotics", "url": "https://oyc.yale.edu/english/engl-300/lecture-8", "access": "Free online"}, {"title": "Yale Open Courses: Introduction to Theory of Literature", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://oyc.yale.edu/english/engl-300", "access": "Free reference"}, {"title": "Stanford Encyclopedia of Philosophy: Michel Foucault", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://plato.stanford.edu/entries/foucault/", "access": "Free reference"}], "studySteps": ["Define the central ideas: Saussure, signifier/signified and systems of difference.", "Use the UX scenario: Labels: approved, pending and rejected.", "Test your understanding: explain how the idea supports this objective: Analyse how interface categories get their meaning.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Signifier", "meaning": "Signifier means perceptible form of a sign. In this lesson, it helps you examine the question: Analyse how interface categories get their meaning. For example, consider this UX research situation: Labels: approved, pending and rejected. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Signifier versus signified: the graphic is the signifier; the understood concept is the signified."}, {"term": "Signified", "meaning": "Signified means concept associated with a sign. In this lesson, it helps you examine the question: Analyse how interface categories get their meaning. For example, consider this UX research situation: Labels: approved, pending and rejected. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Signifier versus signified: the graphic is the signifier; the understood concept is the signified."}, {"term": "Sign", "meaning": "Sign means relationship of form and concept in a sign system. In this lesson, it helps you examine the question: Analyse how interface categories get their meaning. For example, consider this UX research situation: Labels: approved, pending and rejected. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Signifier versus signified: the graphic is the signifier; the understood concept is the signified."}, {"term": "Structuralism", "meaning": "Structuralism studies meaning as arising from relations within systems of differences, rather than from isolated things with self-contained meanings. Interface labels, icon conventions and navigation categories acquire meaning through their contrasts and cultural conventions. A structuralist UX reading asks which oppositions or classification rules make an interface understandable."}], "explanation": "A UI icon has no entirely self-sufficient meaning. Users understand it through prior conventions, surrounding labels and differences from other controls. Structuralism asks what system of contrasts makes a label or symbol intelligible. Saussure's account concerns relations within a shared language system, not simply pictorial resemblance.", "workedExample": "A trash icon means “delete” partly because interface conventions contrast it with “archive”, “hide” or “move”. In a healthcare interface, the same icon may require text to avoid ambiguity.", "comparison": "Signifier versus signified: the graphic is the signifier; the understood concept is the signified.", "pitfall": "Assuming every user interprets a pictogram identically regardless of context.", "practice": "Analyse the terms “verified”, “rejected” and “pending” as a classification system in field investigations.", "selfCheck": "Explain how each term gains meaning through its relation to the other statuses.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Structuralism+primer+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}], "assignments": [{"id": "4-a1", "title": "Experiment protocol", "prompt": "Design a controlled usability experiment with bias controls", "length": "800–1,000 words", "criteria": "Include recruitment, randomisation, tasks, operational measures and ethics.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}, {"id": "4-a2", "title": "Semiotic interface analysis", "prompt": "Analyse labels, icons and category relationships through structuralism", "length": "450–650 words", "criteria": "Describe a sign system and its assumed rules.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}], "quiz": [{"q": "Random assignment primarily helps…", "options": ["Balance confounding factors between groups", "Ensure representative sampling", "Guarantee significant results", "Eliminate measurement error"], "answer": 0, "why": "It reduces systematic baseline differences in expectation."}, {"q": "A quasi-experiment typically lacks…", "options": ["A research question", "Random assignment", "Outcome measurement", "A comparison possibility"], "answer": 1, "why": "Quasi-experimental research has an intervention without full random assignment."}, {"q": "Structuralism emphasises…", "options": ["Meaning from relations within systems", "Only individual intuition", "Unlimited fixed universal meanings", "Only cognitive biases"], "answer": 0, "why": "Signs acquire meaning through relations and differences."}], "links": ["https://www.openintro.org/book/os/", "https://oyc.yale.edu/english/engl-300/lecture-8"], "quizBank": [{"q": "Random assignment primarily helps…", "options": ["Balance confounding factors between groups", "Ensure representative sampling", "Guarantee significant results", "Eliminate measurement error"], "answer": 0, "why": "It reduces systematic baseline differences in expectation."}, {"q": "A quasi-experiment typically lacks…", "options": ["A research question", "Random assignment", "Outcome measurement", "A comparison possibility"], "answer": 1, "why": "Quasi-experimental research has an intervention without full random assignment."}, {"q": "Structuralism emphasises…", "options": ["Meaning from relations within systems", "Only individual intuition", "Unlimited fixed universal meanings", "Only cognitive biases"], "answer": 0, "why": "Signs acquire meaning through relations and differences."}, {"q": "Which concept best matches: Allocating enrolled participants to conditions by chance?", "options": ["Random assignment", "Control group", "Treatment", "Blinding"], "answer": 0, "why": "Random assignment: Allocating enrolled participants to conditions by chance"}, {"q": "Which concept best matches: Reference condition against which intervention is compared?", "options": ["Control group", "Random assignment", "Treatment", "Blinding"], "answer": 0, "why": "Control group: Reference condition against which intervention is compared"}, {"q": "Which concept best matches: Comparison group selected without random allocation?", "options": ["Nonequivalent control group", "Interrupted time series", "Secular trend", "Maturation"], "answer": 0, "why": "Nonequivalent control group: Comparison group selected without random allocation"}, {"q": "Which concept best matches: Repeated observations before and after an intervention?", "options": ["Interrupted time series", "Nonequivalent control group", "Secular trend", "Maturation"], "answer": 0, "why": "Interrupted time series: Repeated observations before and after an intervention"}, {"q": "Which concept best matches: Distribution of a statistic across hypothetical repeated samples?", "options": ["Sampling distribution", "Standard error", "Confidence interval", "Margin of error"], "answer": 0, "why": "Sampling distribution: Distribution of a statistic across hypothetical repeated samples"}, {"q": "Which concept best matches: Estimated variability of a statistic across samples?", "options": ["Standard error", "Sampling distribution", "Confidence interval", "Margin of error"], "answer": 0, "why": "Standard error: Estimated variability of a statistic across samples"}, {"q": "Which concept best matches: Perceptible form of a sign?", "options": ["Signifier", "Signified", "Sign", "Structuralism"], "answer": 0, "why": "Signifier: Perceptible form of a sign"}, {"q": "Which concept best matches: Concept associated with a sign?", "options": ["Signified", "Signifier", "Sign", "Structuralism"], "answer": 0, "why": "Signified: Concept associated with a sign"}]}, {"id": 5, "title": "Testing, Correlation & Deconstruction", "dates": "Nov 30–Dec 6", "desc": "Statistical inference and multiple meanings in interfaces", "lessons": [{"id": "5.1", "title": "Hypothesis testing", "concepts": "Null hypothesis, p-values and decision errors", "goal": "Interpret p-values without calling them probabilities the null is true.", "example": "Evaluate an A/B result.", "readings": [{"title": "Khan Academy Statistics", "focus": "Hypothesis testing, p-values, correlation and regression", "url": "https://www.khanacademy.org/math/statistics-probability", "access": "Free online"}, {"title": "Yale ENGL 300", "focus": "Theory and post-structuralism", "url": "https://oyc.yale.edu/english/engl-300", "access": "Free online"}, {"title": "OpenIntro Statistics", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://www.openintro.org/book/os/", "access": "Free reference"}], "studySteps": ["Define the central ideas: Null hypothesis, p-values and decision errors.", "Use the UX scenario: Evaluate an A/B result.", "Test your understanding: explain how the idea supports this objective: Interpret p-values without calling them probabilities the null is true.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Null hypothesis", "meaning": "Null hypothesis means statistical model often representing no specified effect. In this lesson, it helps you examine the question: Interpret p-values without calling them probabilities the null is true. For example, consider this UX research situation: Evaluate an A/B result. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Statistical versus practical significance: statistical evidence and product value answer different questions."}, {"term": "p-value", "meaning": "A p-value is the probability, assuming the null model and its assumptions are true, of obtaining results at least as incompatible with that model as the observed results. It is not the probability the null hypothesis is true, nor the probability that a result is practically important. Interpret it alongside effect size, interval estimates, study design and selection of tests."}, {"term": "Type I error", "meaning": "Type I error means rejecting a true null hypothesis. In this lesson, it helps you examine the question: Interpret p-values without calling them probabilities the null is true. For example, consider this UX research situation: Evaluate an A/B result. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Statistical versus practical significance: statistical evidence and product value answer different questions."}, {"term": "Type II error", "meaning": "Type II error means failing to reject a false null hypothesis. In this lesson, it helps you examine the question: Interpret p-values without calling them probabilities the null is true. For example, consider this UX research situation: Evaluate an A/B result. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Statistical versus practical significance: statistical evidence and product value answer different questions."}], "explanation": "Statistical significance evaluates compatibility of data with a model, not the importance of the design change. A small p-value is neither the probability the null is true nor the probability a feature is useful. Interpret alongside effect sizes, sample design, practical consequences and uncertainty.", "workedExample": "A new flow saves a mean 0.4 seconds with p=0.01 in a huge sample. The evidence against no difference may be strong, but the practical benefit may be negligible.", "comparison": "Statistical versus practical significance: statistical evidence and product value answer different questions.", "pitfall": "Writing “p=0.03 means a 97% probability our redesign works.”", "practice": "Explain why a tiny but statistically significant speed improvement may not justify implementation costs.", "selfCheck": "p-values don't measure practical impact; assess magnitude and confidence intervals.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [{"title": "Hypothesis Testing and The Null Hypothesis", "creator": "StatQuest with Josh Starmer", "id": "0oc49DyA3hU"}, {"title": "p-values: What they are and how to interpret them", "creator": "StatQuest with Josh Starmer", "id": "vemZtEM63GY"}], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Hypothesis+testing+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "5.2", "title": "Group comparisons", "concepts": "t-tests and ANOVA at a conceptual level", "goal": "Choose a comparison approach given number of groups and assumptions.", "example": "Compare task times across two or three UIs.", "readings": [{"title": "Khan Academy Statistics", "focus": "Hypothesis testing, p-values, correlation and regression", "url": "https://www.khanacademy.org/math/statistics-probability", "access": "Free online"}, {"title": "Yale ENGL 300", "focus": "Theory and post-structuralism", "url": "https://oyc.yale.edu/english/engl-300", "access": "Free online"}, {"title": "OpenIntro Statistics", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://www.openintro.org/book/os/", "access": "Free reference"}], "studySteps": ["Define the central ideas: t-tests and ANOVA at a conceptual level.", "Use the UX scenario: Compare task times across two or three UIs.", "Test your understanding: explain how the idea supports this objective: Choose a comparison approach given number of groups and assumptions.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "t-test", "meaning": "t-test means test of a difference between two means under specified assumptions. In this lesson, it helps you examine the question: Choose a comparison approach given number of groups and assumptions. For example, consider this UX research situation: Compare task times across two or three UIs. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Independent versus paired comparison: the pairing structure changes the analysis and interpretation."}, {"term": "ANOVA", "meaning": "ANOVA means framework for comparing mean variation across multiple groups. In this lesson, it helps you examine the question: Choose a comparison approach given number of groups and assumptions. For example, consider this UX research situation: Compare task times across two or three UIs. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Independent versus paired comparison: the pairing structure changes the analysis and interpretation."}, {"term": "Effect size", "meaning": "Effect size means magnitude of a relationship or difference. In this lesson, it helps you examine the question: Choose a comparison approach given number of groups and assumptions. For example, consider this UX research situation: Compare task times across two or three UIs. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Independent versus paired comparison: the pairing structure changes the analysis and interpretation."}, {"term": "Multiple comparisons", "meaning": "Multiple comparisons means several tests increasing false-positive risk unless addressed. In this lesson, it helps you examine the question: Choose a comparison approach given number of groups and assumptions. For example, consider this UX research situation: Compare task times across two or three UIs. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Independent versus paired comparison: the pairing structure changes the analysis and interpretation."}], "explanation": "Choose a comparison based on the study question and design. Two independent groups may use a two-sample t-test; matched before/after values need paired analysis. Multiple groups motivate ANOVA, but assumptions and planned contrasts still matter. Statistical tests never repair invalid measurement or biased recruitment.", "workedExample": "Compare mean checkout time for old versus redesigned interface with a suitable two-group test. If testing three onboarding patterns, an ANOVA framework may be useful, followed by justified comparisons.", "comparison": "Independent versus paired comparison: the pairing structure changes the analysis and interpretation.", "pitfall": "Using multiple unadjusted t-tests for every pair and ignoring inflated false-positive risk.", "practice": "Choose an analysis for 20 users who each try both prototypes, then for 20 users randomly split between two prototypes.", "selfCheck": "Paired outcomes for the first; independent-group approach for the second, given their respective assumptions.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Group+comparisons+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "5.3", "title": "Association", "concepts": "Correlation, scatterplots and regression basics", "goal": "Distinguish association, prediction and causation.", "example": "Compare steps taken and time on task.", "readings": [{"title": "Khan Academy Statistics", "focus": "Hypothesis testing, p-values, correlation and regression", "url": "https://www.khanacademy.org/math/statistics-probability", "access": "Free online"}, {"title": "Yale ENGL 300", "focus": "Theory and post-structuralism", "url": "https://oyc.yale.edu/english/engl-300", "access": "Free online"}, {"title": "OpenIntro Statistics", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://www.openintro.org/book/os/", "access": "Free reference"}], "studySteps": ["Define the central ideas: Correlation, scatterplots and regression basics.", "Use the UX scenario: Compare steps taken and time on task.", "Test your understanding: explain how the idea supports this objective: Distinguish association, prediction and causation.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Correlation", "meaning": "Correlation describes the degree and direction of association between variables. Two metrics may move together because one influences the other, because both share a third cause, or by chance. In UX analytics, longer sessions may correlate with higher engagement or with friction; context determines interpretation. Correlation by itself does not establish causation."}, {"term": "Pearson r", "meaning": "Pearson r means standardised measure of linear association. In this lesson, it helps you examine the question: Distinguish association, prediction and causation. For example, consider this UX research situation: Compare steps taken and time on task. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Correlation versus regression: correlation is symmetric association; regression assigns predictors and an outcome for modelling or prediction."}, {"term": "Regression", "meaning": "Regression models how an outcome is associated with one or more predictors under specified assumptions. A linear model can estimate how completion time changes with case complexity while adjusting for experience. Coefficients depend on coding, units and model specification, and observational coefficients are not automatically causal."}, {"term": "Residual", "meaning": "Residual means difference between observed and model-predicted value. In this lesson, it helps you examine the question: Distinguish association, prediction and causation. For example, consider this UX research situation: Compare steps taken and time on task. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Correlation versus regression: correlation is symmetric association; regression assigns predictors and an outcome for modelling or prediction."}], "explanation": "Two metrics may move together without one causing the other. Scatterplots show shape, clusters, extreme observations and possible nonlinearity that a single correlation number hides. Regression can adjust for measured factors but cannot automatically eliminate confounding or establish causation.", "workedExample": "Longer investigation cases may have more attachments. Correlation could reflect case complexity, not that uploading more documents causes slowness. Plot each case before calculating coefficients.", "comparison": "Correlation versus regression: correlation is symmetric association; regression assigns predictors and an outcome for modelling or prediction.", "pitfall": "Assuming r=0 means no relationship of any kind; it only indicates no linear association for Pearson r.", "practice": "Describe what an upward-sloping but widely scattered plot suggests and what it does not prove.", "selfCheck": "A positive relationship with noise; no causal conclusion without stronger design.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [{"title": "Correlation, Clearly Explained", "creator": "StatQuest with Josh Starmer", "id": "xZ_z8KWkhXE"}], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Association+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "5.4", "title": "Post-structuralism", "concepts": "Derrida, deconstruction and contextual meaning", "goal": "Find assumptions and excluded interpretations in a UX flow.", "example": "Question what “verified” means to users.", "readings": [{"title": "Khan Academy Statistics", "focus": "Hypothesis testing, p-values, correlation and regression", "url": "https://www.khanacademy.org/math/statistics-probability", "access": "Free online"}, {"title": "Yale ENGL 300", "focus": "Theory and post-structuralism", "url": "https://oyc.yale.edu/english/engl-300", "access": "Free online"}, {"title": "Stanford Encyclopedia of Philosophy: Michel Foucault", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://plato.stanford.edu/entries/foucault/", "access": "Free reference"}], "studySteps": ["Define the central ideas: Derrida, deconstruction and contextual meaning.", "Use the UX scenario: Question what “verified” means to users.", "Test your understanding: explain how the idea supports this objective: Find assumptions and excluded interpretations in a UX flow.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Post-structuralism", "meaning": "Post-structuralism questions whether those systems of meaning remain fixed, universal or internally consistent. An interface category such as “verified” may mean something different to an operator, a customer and an auditor. The approach examines how context, history, power and interpretation destabilise seemingly natural categories."}, {"term": "Deconstruction", "meaning": "Deconstruction is a close reading approach associated with Derrida that examines tensions, assumptions and hierarchies within concepts or texts. In a design critique, examine what a binary such as “trusted/untrusted” excludes, how one side depends on the other, and how the interface reinforces the distinction. It is not simply destroying a design or stating that nothing has meaning."}, {"term": "Binary opposition", "meaning": "Binary opposition means pair whose terms are defined through contrast. In this lesson, it helps you examine the question: Find assumptions and excluded interpretations in a UX flow. For example, consider this UX research situation: Question what “verified” means to users. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Structuralism versus post-structuralism: map the system of categories, then question their instability, exclusions and effects."}, {"term": "Contextual meaning", "meaning": "Contextual meaning means interpretation shaped by use, history and power. In this lesson, it helps you examine the question: Find assumptions and excluded interpretations in a UX flow. For example, consider this UX research situation: Question what “verified” means to users. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Structuralism versus post-structuralism: map the system of categories, then question their instability, exclusions and effects."}], "explanation": "If structuralism asks how a system produces meaning, post-structuralist approaches ask how stable that system really is and whose viewpoints it excludes. Deconstruction is not merely destroying an argument; it studies contradictions and dependencies within apparently natural oppositions.", "workedExample": "A product divides customers into “trusted” and “risky”. Examine what evidence defines each group, where ambiguous cases fit, and whether the labels change user treatment.", "comparison": "Structuralism versus post-structuralism: map the system of categories, then question their instability, exclusions and effects.", "pitfall": "Calling deconstruction a preference for disorder or the belief that all interpretations are equally persuasive.", "practice": "Write 250 words questioning the distinction “active” versus “inactive” users.", "selfCheck": "Identify thresholds, edge cases, excluded experiences and consequences of classification.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Post-structuralism+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}], "assignments": [{"id": "5-a1", "title": "Statistics interpretation memo", "prompt": "Interpret a fabricated A/B report responsibly", "length": "500–700 words", "criteria": "Discuss effect size, uncertainty, limitations and actionable next steps.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}, {"id": "5-a2", "title": "Deconstruct an interface", "prompt": "Explain competing meanings and implicit binaries in a product", "length": "650–850 words", "criteria": "Discuss context, assumptions and alternative interpretations.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}], "quiz": [{"q": "A p-value is…", "options": ["Probability the null is true", "Probability of data at least as extreme, under the null model", "Effect size", "Chance the design is ethical"], "answer": 1, "why": "It is calculated assuming the null model, not a probability assigned to the hypothesis."}, {"q": "Correlation alone demonstrates…", "options": ["Causation", "Association", "Randomisation", "Experimental control"], "answer": 1, "why": "Association does not establish causality."}, {"q": "Post-structuralism highlights…", "options": ["Meaning as contextual and contestable", "Absolute fixed interpretation", "Only sample size", "The absence of language"], "answer": 0, "why": "Interpretation varies with context and social practices."}], "links": ["https://www.khanacademy.org/math/statistics-probability", "https://oyc.yale.edu/english/engl-300"], "quizBank": [{"q": "A p-value is…", "options": ["Probability the null is true", "Probability of data at least as extreme, under the null model", "Effect size", "Chance the design is ethical"], "answer": 1, "why": "It is calculated assuming the null model, not a probability assigned to the hypothesis."}, {"q": "Correlation alone demonstrates…", "options": ["Causation", "Association", "Randomisation", "Experimental control"], "answer": 1, "why": "Association does not establish causality."}, {"q": "Post-structuralism highlights…", "options": ["Meaning as contextual and contestable", "Absolute fixed interpretation", "Only sample size", "The absence of language"], "answer": 0, "why": "Interpretation varies with context and social practices."}, {"q": "Which concept best matches: Statistical model often representing no specified effect?", "options": ["Null hypothesis", "p-value", "Type I error", "Type II error"], "answer": 0, "why": "Null hypothesis: Statistical model often representing no specified effect"}, {"q": "Which concept best matches: Probability, assuming a specified null model, of observing data at least as incompatible as the result?", "options": ["p-value", "Null hypothesis", "Type I error", "Type II error"], "answer": 0, "why": "p-value: Probability, assuming a specified null model, of observing data at least as incompatible as the result"}, {"q": "Which concept best matches: Test of a difference between two means under specified assumptions?", "options": ["t-test", "ANOVA", "Effect size", "Multiple comparisons"], "answer": 0, "why": "t-test: Test of a difference between two means under specified assumptions"}, {"q": "Which concept best matches: Framework for comparing mean variation across multiple groups?", "options": ["ANOVA", "t-test", "Effect size", "Multiple comparisons"], "answer": 0, "why": "ANOVA: Framework for comparing mean variation across multiple groups"}, {"q": "Which concept best matches: Direction and strength of association between variables?", "options": ["Correlation", "Pearson r", "Regression", "Residual"], "answer": 0, "why": "Correlation: Direction and strength of association between variables"}, {"q": "Which concept best matches: Standardised measure of linear association?", "options": ["Pearson r", "Correlation", "Regression", "Residual"], "answer": 0, "why": "Pearson r: Standardised measure of linear association"}, {"q": "Which concept best matches: Family of approaches questioning fixed meanings and stable interpretive systems?", "options": ["Post-structuralism", "Deconstruction", "Binary opposition", "Contextual meaning"], "answer": 0, "why": "Post-structuralism: Family of approaches questioning fixed meanings and stable interpretive systems"}, {"q": "Which concept best matches: Close reading exposing tensions and assumptions in binary distinctions?", "options": ["Deconstruction", "Post-structuralism", "Binary opposition", "Contextual meaning"], "answer": 0, "why": "Deconstruction: Close reading exposing tensions and assumptions in binary distinctions"}]}, {"id": 6, "title": "Power, Discourse & Technology", "dates": "Dec 7–13", "desc": "Critical analysis of technological products and institutions", "lessons": [{"id": "6.1", "title": "Foucault and knowledge", "concepts": "Power/knowledge, classifications and institutions", "goal": "Explain how classification can shape behaviour and opportunity.", "example": "Examine a recruitment ranking system.", "readings": [{"title": "Stanford Encyclopedia: Foucault", "focus": "Power, knowledge and discipline", "url": "https://plato.stanford.edu/entries/foucault/", "access": "Free online"}, {"title": "Design Justice", "focus": "Critical and ethical questions about technology", "url": "https://designjustice.mitpress.mit.edu/", "access": "Free online"}, {"title": "Winner: Do Artifacts Have Politics?", "focus": "Technology and political arrangements", "url": "https://classes.cs.uchicago.edu/archive/2020/winter/20370-1/readings/Winner.pdf", "access": "Free online"}, {"title": "Yale Open Courses: Introduction to Theory of Literature", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://oyc.yale.edu/english/engl-300", "access": "Free reference"}], "studySteps": ["Define the central ideas: Power/knowledge, classifications and institutions.", "Use the UX scenario: Examine a recruitment ranking system.", "Test your understanding: explain how the idea supports this objective: Explain how classification can shape behaviour and opportunity.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Power/knowledge", "meaning": "Power/knowledge, in Foucault’s work, names the intertwined relationship between systems of expertise and practices of governing or classifying people. An algorithmic “risk score” can make a person legible to an institution while shaping how officers treat them. A critical UX analysis asks who defines the score, who can contest it and what conduct it encourages."}, {"term": "Classification", "meaning": "Classification means method of naming and sorting observed reality. In this lesson, it helps you examine the question: Explain how classification can shape behaviour and opportunity. For example, consider this UX research situation: Examine a recruitment ranking system. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Measurement as description versus measurement as intervention: the act of measuring and rewarding changes behaviour."}, {"term": "Institution", "meaning": "Institution means organised setting establishing rules and legitimate expertise. In this lesson, it helps you examine the question: Explain how classification can shape behaviour and opportunity. For example, consider this UX research situation: Examine a recruitment ranking system. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Measurement as description versus measurement as intervention: the act of measuring and rewarding changes behaviour."}, {"term": "Normalisation", "meaning": "Normalisation means producing standards against which behaviour is compared. In this lesson, it helps you examine the question: Explain how classification can shape behaviour and opportunity. For example, consider this UX research situation: Examine a recruitment ranking system. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Measurement as description versus measurement as intervention: the act of measuring and rewarding changes behaviour."}], "explanation": "Dashboards do more than mirror activity. By deciding what can be measured and compared, they make some behaviours legible and others invisible. A managerial dashboard creates standards, incentives and sometimes pressure. Analyse what counts as valid evidence, who can alter categories and who can challenge a conclusion.", "workedExample": "A field agent dashboard labels 90-minute visits “low productivity”. But travel distance, case complexity and safety constraints may be absent. The measure becomes part of governing conduct.", "comparison": "Measurement as description versus measurement as intervention: the act of measuring and rewarding changes behaviour.", "pitfall": "Claiming data is neutral because it is numeric.", "practice": "Critique a productivity metric by identifying its producer, audience, omitted context and behavioural consequences.", "selfCheck": "Include who defines the target and who is disadvantaged by the measure.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Foucault+and+knowledge+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "6.2", "title": "Discipline and surveillance", "concepts": "Panopticism, visibility and self-regulation", "goal": "Analyse the effects of always-on tracking.", "example": "Workplace productivity dashboards.", "readings": [{"title": "Stanford Encyclopedia: Foucault", "focus": "Power, knowledge and discipline", "url": "https://plato.stanford.edu/entries/foucault/", "access": "Free online"}, {"title": "Design Justice", "focus": "Critical and ethical questions about technology", "url": "https://designjustice.mitpress.mit.edu/", "access": "Free online"}, {"title": "Winner: Do Artifacts Have Politics?", "focus": "Technology and political arrangements", "url": "https://classes.cs.uchicago.edu/archive/2020/winter/20370-1/readings/Winner.pdf", "access": "Free online"}, {"title": "Yale Open Courses: Introduction to Theory of Literature", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://oyc.yale.edu/english/engl-300", "access": "Free reference"}], "studySteps": ["Define the central ideas: Panopticism, visibility and self-regulation.", "Use the UX scenario: Workplace productivity dashboards.", "Test your understanding: explain how the idea supports this objective: Analyse the effects of always-on tracking.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Panopticism", "meaning": "Panopticism is Foucault’s analysis of a form of disciplinary power in which the possibility of observation encourages individuals to regulate their own behaviour. A worker dashboard displaying detailed activity logs may influence conduct even when no manager is watching live. The concept is an analytical framework, not a claim that all monitoring is identical."}, {"term": "Surveillance", "meaning": "Surveillance means systematic observation or collection of behaviour. In this lesson, it helps you examine the question: Analyse the effects of always-on tracking. For example, consider this UX research situation: Workplace productivity dashboards. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Safety auditing versus permanent surveillance: purposes and constraints affect ethical justification."}, {"term": "Self-regulation", "meaning": "Self-regulation means adjustment of conduct in anticipation of oversight. In this lesson, it helps you examine the question: Analyse the effects of always-on tracking. For example, consider this UX research situation: Workplace productivity dashboards. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Safety auditing versus permanent surveillance: purposes and constraints affect ethical justification."}, {"term": "Visibility asymmetry", "meaning": "Visibility asymmetry means some parties can observe others more readily than they themselves are observed. In this lesson, it helps you examine the question: Analyse the effects of always-on tracking. For example, consider this UX research situation: Workplace productivity dashboards. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Safety auditing versus permanent surveillance: purposes and constraints affect ethical justification."}], "explanation": "A monitoring interface may alter worker behaviour even when no one actively watches. The design question is not simply whether monitoring improves throughput, but whose autonomy, dignity and control are affected. Consider transparency, appeal, proportionate measurement and access policies.", "workedExample": "An employer displays an always-on activity score. Workers may avoid taking breaks, even when breaks improve quality. That is a behavioural effect of expected visibility, not merely a reporting feature.", "comparison": "Safety auditing versus permanent surveillance: purposes and constraints affect ethical justification.", "pitfall": "Assuming more monitoring always means more accurate understanding of work.", "practice": "Design a privacy-respecting audit log for field investigations; identify what not to record.", "selfCheck": "Limit purpose, retention and access; include appeals and human review.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Discipline+and+surveillance+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "6.3", "title": "Discourse and norms", "concepts": "How words and categories legitimise some practices", "goal": "Ask who defines success and normality in a platform.", "example": "Eligibility and risk scores.", "readings": [{"title": "Stanford Encyclopedia: Foucault", "focus": "Power, knowledge and discipline", "url": "https://plato.stanford.edu/entries/foucault/", "access": "Free online"}, {"title": "Design Justice", "focus": "Critical and ethical questions about technology", "url": "https://designjustice.mitpress.mit.edu/", "access": "Free online"}, {"title": "Winner: Do Artifacts Have Politics?", "focus": "Technology and political arrangements", "url": "https://classes.cs.uchicago.edu/archive/2020/winter/20370-1/readings/Winner.pdf", "access": "Free online"}, {"title": "Yale Open Courses: Introduction to Theory of Literature", "focus": "Supplementary: explore the relevant sections for this lesson", "url": "https://oyc.yale.edu/english/engl-300", "access": "Free reference"}], "studySteps": ["Define the central ideas: How words and categories legitimise some practices.", "Use the UX scenario: Eligibility and risk scores.", "Test your understanding: explain how the idea supports this objective: Ask who defines success and normality in a platform.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Discourse", "meaning": "Discourse refers to historically situated systems of statements, categories and practices that make some things sayable, knowable and legitimate. Product language like “low-value customer” does more than describe; it can influence decisions and institutional priorities. Analyse who gets to define the vocabulary and which alternatives disappear."}, {"term": "Framing", "meaning": "Framing means selection of a perspective that influences interpretation. In this lesson, it helps you examine the question: Ask who defines success and normality in a platform. For example, consider this UX research situation: Eligibility and risk scores. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Neutral description versus evaluative label: the second can embed a conclusion not supported by the evidence."}, {"term": "Norm", "meaning": "Norm means expected standard of behaviour. In this lesson, it helps you examine the question: Ask who defines success and normality in a platform. For example, consider this UX research situation: Eligibility and risk scores. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Neutral description versus evaluative label: the second can embed a conclusion not supported by the evidence."}, {"term": "Subject position", "meaning": "Subject position means role or identity made available within a discourse. In this lesson, it helps you examine the question: Ask who defines success and normality in a platform. For example, consider this UX research situation: Eligibility and risk scores. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Neutral description versus evaluative label: the second can embed a conclusion not supported by the evidence."}], "explanation": "Microcopy creates categories with consequences. Terms such as “defaulter”, “suspicious”, “unproductive” or “fraudulent” do not merely display data: they imply judgments and can justify different interventions. Analyse how a term was produced and whether it accurately reflects the evidence.", "workedExample": "An automated flag says “Fraudulent case” before investigation. “Requires review” is more proportionate if the system has only detected an anomaly.", "comparison": "Neutral description versus evaluative label: the second can embed a conclusion not supported by the evidence.", "pitfall": "Changing vocabulary without examining the process or power behind it.", "practice": "Rewrite three risky dashboard status labels and explain how each alters the decision frame.", "selfCheck": "State what is known, what is inferred, and which actor is responsible for judgment.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Discourse+and+norms+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "6.4", "title": "Politics of artefacts", "concepts": "Winner, design decisions and distribution of power", "goal": "Analyse who benefits, who is excluded and who governs technology.", "example": "Identity checks and automated moderation.", "readings": [{"title": "Stanford Encyclopedia: Foucault", "focus": "Power, knowledge and discipline", "url": "https://plato.stanford.edu/entries/foucault/", "access": "Free online"}, {"title": "Design Justice", "focus": "Critical and ethical questions about technology", "url": "https://designjustice.mitpress.mit.edu/", "access": "Free online"}, {"title": "Winner: Do Artifacts Have Politics?", "focus": "Technology and political arrangements", "url": "https://classes.cs.uchicago.edu/archive/2020/winter/20370-1/readings/Winner.pdf", "access": "Free online"}], "studySteps": ["Define the central ideas: Winner, design decisions and distribution of power.", "Use the UX scenario: Identity checks and automated moderation.", "Test your understanding: explain how the idea supports this objective: Analyse who benefits, who is excluded and who governs technology.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Politics of artefacts", "meaning": "The politics of artefacts concerns how technical objects and infrastructures can embody, reinforce or require particular social arrangements. A default identity verification pathway may redistribute time, access and control among users and institutions. Evaluate who gains options, who is excluded and whether the arrangement could have been designed differently."}, {"term": "Affordance", "meaning": "Affordance means action possibilities relative to an actor and context. In this lesson, it helps you examine the question: Analyse who benefits, who is excluded and who governs technology. For example, consider this UX research situation: Identity checks and automated moderation. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Intent versus effect: a well-intentioned design may still reproduce exclusion."}, {"term": "Distributional impact", "meaning": "Distributional impact means how costs and benefits differ between groups. In this lesson, it helps you examine the question: Analyse who benefits, who is excluded and who governs technology. For example, consider this UX research situation: Identity checks and automated moderation. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Intent versus effect: a well-intentioned design may still reproduce exclusion."}, {"term": "Design justice", "meaning": "Design justice means framework centring the people most affected by design decisions. In this lesson, it helps you examine the question: Analyse who benefits, who is excluded and who governs technology. For example, consider this UX research situation: Identity checks and automated moderation. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Intent versus effect: a well-intentioned design may still reproduce exclusion."}], "explanation": "Technology is not politically blank: infrastructure, defaults and permission structures can distribute opportunity and control. Ask who has a say in defining the problem, who bears the burden of the system and whether alternative designs redistribute power.", "workedExample": "A claim portal requires high-speed internet and digital literacy. It may systematically disadvantage rural applicants even while increasing efficiency for urban users.", "comparison": "Intent versus effect: a well-intentioned design may still reproduce exclusion.", "pitfall": "Treating accessibility as a late-stage polish issue rather than a structural design decision.", "practice": "Review the politics of mandatory smartphone verification for public services.", "selfCheck": "Consider exclusion, alternatives, accountability, implementation and who can contest failure.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Politics+of+artefacts+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}], "assignments": [{"id": "6-a1", "title": "Critical technology essay", "prompt": "Analyse one enterprise system using Foucault and Winner", "length": "900–1,200 words", "criteria": "Thesis, two theoretical concepts, concrete interface evidence, counterargument, conclusion.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}, {"id": "6-a2", "title": "Academic reading response", "prompt": "Evaluate the arguments and limitations of a critical design reading", "length": "400–600 words", "criteria": "Summarise the claim fairly, present evidence, then critique.", "rubric": [["Problem definition and thesis", 20], ["Conceptual or methodological accuracy", 25], ["Use of evidence and examples", 25], ["Critical reflection and limitations", 20], ["Structure, clarity and citations", 10]]}], "quiz": [{"q": "Power/knowledge asks us to examine…", "options": ["How categories and expertise shape what counts as truth", "Only colour palettes", "Only response times", "Only screen sizes"], "answer": 0, "why": "Knowledge-making practices and power reinforce one another."}, {"q": "Panopticism is relevant to…", "options": ["Visibility and self-regulation", "Only colour blindness", "File compression", "Chart bin width"], "answer": 0, "why": "The possibility of being observed can alter conduct."}, {"q": "Do Artifacts Have Politics? invites us to ask…", "options": ["How design embeds social power", "How to optimise icon corners", "Whether mean equals median", "Whether a prototype compiles"], "answer": 0, "why": "Technical arrangements may have political consequences."}], "links": ["https://plato.stanford.edu/entries/foucault/", "https://designjustice.mitpress.mit.edu/"], "quizBank": [{"q": "Power/knowledge asks us to examine…", "options": ["How categories and expertise shape what counts as truth", "Only colour palettes", "Only response times", "Only screen sizes"], "answer": 0, "why": "Knowledge-making practices and power reinforce one another."}, {"q": "Panopticism is relevant to…", "options": ["Visibility and self-regulation", "Only colour blindness", "File compression", "Chart bin width"], "answer": 0, "why": "The possibility of being observed can alter conduct."}, {"q": "Do Artifacts Have Politics? invites us to ask…", "options": ["How design embeds social power", "How to optimise icon corners", "Whether mean equals median", "Whether a prototype compiles"], "answer": 0, "why": "Technical arrangements may have political consequences."}, {"q": "Which concept best matches: Foucauldian insight that knowledge practices and power relations mutually shape each other?", "options": ["Power/knowledge", "Classification", "Institution", "Normalisation"], "answer": 0, "why": "Power/knowledge: Foucauldian insight that knowledge practices and power relations mutually shape each other"}, {"q": "Which concept best matches: Method of naming and sorting observed reality?", "options": ["Classification", "Power/knowledge", "Institution", "Normalisation"], "answer": 0, "why": "Classification: Method of naming and sorting observed reality"}, {"q": "Which concept best matches: Concept of discipline through the possibility of being observed?", "options": ["Panopticism", "Surveillance", "Self-regulation", "Visibility asymmetry"], "answer": 0, "why": "Panopticism: Concept of discipline through the possibility of being observed"}, {"q": "Which concept best matches: Systematic observation or collection of behaviour?", "options": ["Surveillance", "Panopticism", "Self-regulation", "Visibility asymmetry"], "answer": 0, "why": "Surveillance: Systematic observation or collection of behaviour"}, {"q": "Which concept best matches: Patterns of language and practice that shape what is sayable or credible?", "options": ["Discourse", "Framing", "Norm", "Subject position"], "answer": 0, "why": "Discourse: Patterns of language and practice that shape what is sayable or credible"}, {"q": "Which concept best matches: Selection of a perspective that influences interpretation?", "options": ["Framing", "Discourse", "Norm", "Subject position"], "answer": 0, "why": "Framing: Selection of a perspective that influences interpretation"}, {"q": "Which concept best matches: Idea that technologies can embody or reinforce social arrangements?", "options": ["Politics of artefacts", "Affordance", "Distributional impact", "Design justice"], "answer": 0, "why": "Politics of artefacts: Idea that technologies can embody or reinforce social arrangements"}, {"q": "Which concept best matches: Action possibilities relative to an actor and context?", "options": ["Affordance", "Politics of artefacts", "Distributional impact", "Design justice"], "answer": 0, "why": "Affordance: Action possibilities relative to an actor and context"}]}, {"id": 7, "title": "Human Factors & Evaluation", "dates": "Dec 14–20", "desc": "Cognition, workload and usability evidence", "lessons": [{"id": "7.1", "title": "Perception and attention", "concepts": "Selective attention, visual search and salience", "goal": "Reduce attentional competition in complex interfaces.", "example": "Inspect an alert-heavy case management UI.", "readings": [{"title": "Nielsen Norman Group", "focus": "Ten usability heuristics", "url": "https://www.nngroup.com/articles/ten-usability-heuristics/", "access": "Free online"}, {"title": "NASA TLX", "focus": "Task workload dimensions", "url": "https://humansystems.arc.nasa.gov/groups/tlx/", "access": "Free online"}, {"title": "Designing with the Mind in Mind", "focus": "Jeff Johnson, relevant chapters on attention and memory (book reference)", "url": "", "access": "Book reference; obtain through library/bookstore"}], "studySteps": ["Define the central ideas: Selective attention, visual search and salience.", "Use the UX scenario: Inspect an alert-heavy case management UI.", "Test your understanding: explain how the idea supports this objective: Reduce attentional competition in complex interfaces.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Selective attention", "meaning": "Selective attention means prioritising some information while other signals receive less processing. In this lesson, it helps you examine the question: Reduce attentional competition in complex interfaces. For example, consider this UX research situation: Inspect an alert-heavy case management UI. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Salience versus priority: visually loud elements can be misleading if not tied to user needs."}, {"term": "Visual search", "meaning": "Visual search means scanning to find a target. In this lesson, it helps you examine the question: Reduce attentional competition in complex interfaces. For example, consider this UX research situation: Inspect an alert-heavy case management UI. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Salience versus priority: visually loud elements can be misleading if not tied to user needs."}, {"term": "Salience", "meaning": "Salience means degree to which an element attracts attention. In this lesson, it helps you examine the question: Reduce attentional competition in complex interfaces. For example, consider this UX research situation: Inspect an alert-heavy case management UI. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Salience versus priority: visually loud elements can be misleading if not tied to user needs."}, {"term": "Signal detection", "meaning": "Signal detection means framework for distinguishing meaningful signals from background noise. In this lesson, it helps you examine the question: Reduce attentional competition in complex interfaces. For example, consider this UX research situation: Inspect an alert-heavy case management UI. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Salience versus priority: visually loud elements can be misleading if not tied to user needs."}], "explanation": "A dense dashboard competes for finite attention. Effective hierarchy highlights meaningful exceptions, but too many alerts create habituation. A stronger interface supports a task sequence: understand status, identify an exception, investigate, then act. Ground colour and grouping choices in task urgency.", "workedExample": "A fraud review dashboard has 60 equally prominent red indicators. Prioritising time-critical cases and grouping lower-risk details improves search, while text labels provide redundancy.", "comparison": "Salience versus priority: visually loud elements can be misleading if not tied to user needs.", "pitfall": "Making every KPI equally prominent because stakeholders value them all.", "practice": "Redesign an alert panel for a claims analyst with three priority classes and a justification.", "selfCheck": "Use consistent cues, progressive detail and explicit action routes.", "minuteEstimate": 40, "sourceNote": "Teaching explanations are original study notes, informed by the listed sources; not verbatim excerpts from a professor or official course.", "quote": null, "videos": [], "further": [{"title": "Open educational video search for this specific lesson", "url": "https://www.youtube.com/results?search_query=Perception+and+attention+data+visualization+design+research+lecture", "kind": "Search, not verified embedded video"}]}, {"id": "7.2", "title": "Memory and mental models", "concepts": "Working memory, chunking and recognition", "goal": "Explain how external cues support users.", "example": "Redesign multi-step onboarding.", "readings": [{"title": "Nielsen Norman Group", "focus": "Ten usability heuristics", "url": "https://www.nngroup.com/articles/ten-usability-heuristics/", "access": "Free online"}, {"title": "NASA TLX", "focus": "Task workload dimensions", "url": "https://humansystems.arc.nasa.gov/groups/tlx/", "access": "Free online"}, {"title": "Designing with the Mind in Mind", "focus": "Jeff Johnson, relevant chapters on attention and memory (book reference)", "url": "", "access": "Book reference; obtain through library/bookstore"}], "studySteps": ["Define the central ideas: Working memory, chunking and recognition.", "Use the UX scenario: Redesign multi-step onboarding.", "Test your understanding: explain how the idea supports this objective: Explain how external cues support users.", "Write a short evidence-based explanation, cite the reading, and note at least one limitation."], "definitions": [{"term": "Working memory", "meaning": "Working memory is the limited system used to hold and manipulate information during an ongoing task. A long form that forces users to remember details from earlier screens can overload it. Reduce unnecessary recall by exposing relevant information, grouping steps and preserving context, while recognising that limits depend on task and familiarity."}, {"term": "Recognition", "meaning": "Recognition means identifying familiar options with cues present. In this lesson, it helps you examine the question: Explain how external cues support users. For example, consider this UX research situation: Redesign multi-step onboarding. Do not assume this term alone proves the design is effective; identify which observation or comparison would support the claim, and note a plausible limitation. A useful distinction to keep in mind is: Recognition versus recall: visible options reduce retrieval burden; mental models concern the underlying logic users expect."}, {"term": "Recall", "meaning": "Recall means producing information without those cues. In this less
